<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llm-bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* Style « Labo » : clair, dense, orienté données. */
    --bg: #f6f7f9; --surface: #fff; --surface-2: #f1f3f6; --border: #e3e6eb; --text: #14171c; --muted: #5b6472;
    --accent: #2f5bea; --accent-soft: #eef2fe; --ok: #1f7a4d; --ok-soft: #e4f3ea; --bad: #b4232c; --bad-soft: #fce9e6;
    --warn: #a15c00; --warn-soft: #fff2db; --paid: #6a2fd8; --paid-soft: #f1eafe; --free: #0f6b63; --free-soft: #e3f4f1;
    --shadow: 0 1px 2px rgba(20, 23, 28, .05);
    --sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101318; --surface: #171b21; --surface-2: #1f242c; --border: #2c323c; --text: #e7eaf0; --muted: #9aa4b2;
      --accent: #7c9cff; --accent-soft: #1f2a4d; --ok: #4cc38a; --ok-soft: #173326; --bad: #f2756a; --bad-soft: #3b1f1d;
      --warn: #f0b347; --warn-soft: #3a2c12; --paid: #c2a3ff; --paid-soft: #2e2346; --free: #4fd1c0; --free-soft: #12302d; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); }
  button, input, select, textarea { font: inherit; color: inherit; }
  /* Barre latérale (navigation + état) et contenu ; la barre passe au-dessus sur petit écran. */
  .app { display: flex; flex-wrap: wrap; min-height: 100vh; }
  .side { flex: 0 0 240px; width: 240px; background: var(--surface); border-right: 1px solid var(--border); padding: 18px 12px; display: flex; flex-direction: column; gap: 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; overflow-x: hidden;
    transition: flex-basis .28s cubic-bezier(.4, 0, .2, 1), width .28s cubic-bezier(.4, 0, .2, 1), padding .28s; z-index: 10; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 6px; }
  .brand .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--text); color: var(--bg); display: grid; place-items: center; font: 600 13px var(--mono); flex: none; }
  .brand b { display: block; font-size: 15px; }
  .brand small { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 160px; }
  .brand > span:not(.logo) { min-width: 0; flex: 1; transition: opacity .2s; }
  .side-toggle { flex: none; width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--muted); display: grid; place-items: center; cursor: pointer; transition: background .15s, color .15s, transform .28s cubic-bezier(.4, 0, .2, 1); }
  .side-toggle:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .side-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .side-nav { display: flex; flex-direction: column; gap: 2px; }
  .side-group { position: relative; }
  .side-item .lbl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .2s; }
  .side-item .chev { flex: none; opacity: .55; transition: transform .25s cubic-bezier(.4, 0, .2, 1); }
  .side-item.open .chev { transform: rotate(90deg); opacity: .9; }
  .side-item svg:first-child { transition: transform .2s; }
  .side-item:hover svg:first-child { transform: scale(1.12); }
  .side-item.on::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); animation: barIn .3s cubic-bezier(.4, 0, .2, 1); }
  .side-item { position: relative; transition: background .15s, color .15s; }
  /* Ouverture d'un sous-menu : le bloc se déplie puis les entrées apparaissent l'une après l'autre. */
  .side-sub.enter { animation: subOpen .32s cubic-bezier(.4, 0, .2, 1); overflow: hidden; }
  .side-sub.enter > button { animation: subItem .3s cubic-bezier(.4, 0, .2, 1) both; animation-delay: calc(var(--i) * 45ms + 60ms); }
  @keyframes subOpen { from { max-height: 0; opacity: 0; margin-top: 0; margin-bottom: 0; } to { max-height: 320px; opacity: 1; } }
  @keyframes subItem { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
  @keyframes barIn { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  /* Barre repliée : icônes seules, sous-menu en menu flottant au survol. */
  .app.side-collapsed .side { flex-basis: 64px; width: 64px; padding: 18px 10px; overflow: visible; }
  .app.side-collapsed .brand { flex-direction: column; padding: 2px 0 6px; }
  .app.side-collapsed .brand > span:not(.logo), .app.side-collapsed .side .meta { display: none; }
  .app.side-collapsed .side-toggle { transform: rotate(180deg); }
  .app.side-collapsed .side-item { justify-content: center; padding: 10px 0; }
  .app.side-collapsed .side-item .lbl, .app.side-collapsed .side-item .chev { display: none; }
  .app.side-collapsed .side-item.on::before { left: -10px; }
  .app.side-collapsed .side-sub { display: none; position: absolute; left: calc(100% + 8px); top: 0; margin: 0; padding: 6px; min-width: 190px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); box-shadow: 0 8px 28px rgba(0, 0, 0, .18); z-index: 30; }
  .app.side-collapsed .side-sub::before { content: attr(data-title); display: block; padding: 4px 10px 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .app.side-collapsed .side-group::after { content: ""; position: absolute; left: 100%; top: 0; width: 10px; height: 100%; }
  .app.side-collapsed .side-group:hover .side-sub, .app.side-collapsed .side-group:focus-within .side-sub { display: flex; animation: popIn .18s cubic-bezier(.4, 0, .2, 1); }
  @keyframes popIn { from { opacity: 0; transform: translateX(-6px) scale(.97); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .side, .side *, .side *::before { animation: none !important; transition: none !important; } }
  .side-item { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 9px 10px; border-radius: 8px; color: #333a45; font-weight: 500; text-align: left; cursor: pointer; }
  .side-item svg { flex: none; }
  .side-item:hover { background: var(--surface-2); }
  .side-item.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .side-sub { display: flex; flex-direction: column; gap: 1px; margin: 2px 0 6px 19px; padding-left: 10px; border-left: 2px solid var(--accent-soft); }
  .side-sub button { border: 0; background: none; text-align: left; padding: 6px 10px; border-radius: 6px; color: var(--muted); cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .side-sub button:hover { background: var(--surface-2); color: var(--text); }
  .side-sub button.on { color: var(--text); font-weight: 600; background: var(--surface-2); }
  .side .meta { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid var(--border); display: flex; flex-direction: column; align-items: flex-start; gap: 8px; color: var(--muted); font-size: 12.5px; }
  .content { flex: 1 1 560px; min-width: 0; }
  main { max-width: 1320px; margin: 0 auto; padding: 24px 32px 48px; display: grid; gap: 18px; }
  @media (max-width: 860px) {
    .side, .app.side-collapsed .side { flex: 1 1 100%; width: 100%; padding: 14px 16px; position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--border); }
    .app.side-collapsed .brand { flex-direction: row; }
    .app.side-collapsed .brand > span:not(.logo) { display: block; }
    .app.side-collapsed .side-nav { display: none; }
    .side-toggle { transform: rotate(90deg); }
    .app.side-collapsed .side-toggle { transform: rotate(-90deg); }
  }
  @media (prefers-color-scheme: dark) { .side-item { color: var(--text); } }
  h2 { font-size: 15px; margin: 0; }
  h3 { font-size: 14px; margin: 0; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; box-shadow: var(--shadow); min-width: 0; }
  .card-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 16px; }
  @media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } main { padding: 12px 16px; } }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  .strong { font-weight: 600; }
  .mono { font-family: var(--mono); font-size: 12.5px; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button.b, .b { border: 1px solid var(--border); background: var(--surface); padding: 6px 12px; border-radius: 7px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  button.b:hover { background: var(--surface-2); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent); filter: brightness(1.08); }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.link { border: 0; background: none; color: var(--accent); padding: 0; cursor: pointer; }
  /* Retour à une liste : bouton contouré avec flèche, bien visible au-dessus du titre. */
  button.back { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 10px; margin-bottom: 4px;
    border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--text);
    font-weight: 600; cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
  button.back .arrow { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent); font-size: 14px; line-height: 1; transition: transform .15s; }
  button.back:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  button.back:hover .arrow { transform: translateX(-2px); background: var(--surface); }
  button.back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.icon { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 4px 6px; border-radius: 6px; }
  button.icon:hover { background: var(--surface-2); color: var(--text); }
  input[type=text], input[type=number], input[type=search], select, textarea { border: 1px solid var(--border); background: var(--surface); border-radius: 7px; padding: 6px 9px; min-width: 0; }
  textarea { width: 100%; resize: vertical; }
  label.field, div.field { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
  label.field > *, div.field > * { color: var(--text); font-size: 14px; }
  .checklist { list-style: none; margin: 0; padding: 0; max-height: 420px; overflow: auto; border: 1px solid var(--border); border-radius: 8px; }
  .checklist li { border-top: 1px solid var(--border); }
  .checklist li:first-child { border-top: 0; }
  .checklist label { display: flex; gap: 10px; align-items: baseline; padding: 8px 10px; cursor: pointer; }
  .checklist label:hover { background: var(--surface-2); }
  .checklist .txt { min-width: 0; }
  .checklist .msg { display: block; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .chip.ok { background: var(--ok-soft); color: var(--ok); }
  .chip.bad { background: var(--bad-soft); color: var(--bad); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.accent { background: var(--accent-soft); color: var(--accent); }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 8px 10px; border-top: 1px solid var(--border); vertical-align: top; }
  th { font-size: 11.5px; font-weight: 600; color: var(--muted); border-top: 0; white-space: nowrap; text-transform: uppercase; letter-spacing: .04em; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--surface-2); }
  .progress { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--accent); transition: width .3s; }
  .score { display: grid; grid-template-columns: 44px 80px; gap: 8px; align-items: center; }
  .score .progress > div { background: var(--ok); }
  .pill { border: 1px solid transparent; border-radius: 6px; padding: 2px 7px; font-size: 12.5px; cursor: pointer; font-variant-numeric: tabular-nums; white-space: nowrap; margin: 0 4px 4px 0; }
  .pill.pass { background: var(--ok-soft); color: var(--ok); }
  .pill.fail { background: var(--bad-soft); color: var(--bad); }
  .pill.error { background: var(--warn-soft); color: var(--warn); }
  .pill.busy { opacity: .55; cursor: progress; }
  .pill.sel { border-color: currentColor; }
  .picker { position: relative; min-width: 0; }
  .picker-btn { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--surface); border-radius: 7px; padding: 6px 9px; cursor: pointer; text-align: left; }
  .picker-btn .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .picker-pop { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 30; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.18); padding: 6px; display: grid; gap: 4px; }
  .picker-pop[hidden], .picker-o[hidden], .picker [data-group][hidden] { display: none; }
  /* <select> natif caché derrière la liste maison (il garde la valeur). */
  .csel { display: inline-block; vertical-align: middle; min-width: 150px; }
  .csel-native { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; overflow: hidden; }
  .picker-btn { min-height: 34px; }
  .picker-o:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  label.field > .csel { display: block; }
  .logdock-h .picker-btn { background: #1f242c; color: #e7eaf0; border-color: #343b46; }
  .picker-pop input { width: 100%; }
  .picker-list { max-height: 320px; overflow: auto; }
  .picker-g { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; padding: 8px 8px 4px; }
  .picker-o { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 13.5px; }
  .picker-o:hover, .picker-o.on { background: var(--accent-soft); }
  .picker-o.on { color: var(--accent); font-weight: 600; }
  .picker-o .d { color: var(--muted); font-weight: 400; font-size: 12px; }
  .picker-o:disabled { cursor: default; color: var(--muted); background: none; }
  .launch { display: flex; flex-wrap: wrap; align-items: end; gap: 12px 16px; }
  .launch .grow { flex: 1 1 200px; }
  .empty { color: var(--muted); padding: 16px; text-align: center; }
  /* Dépliants : bouton avec chevron qui pivote à l'ouverture. */
  details > summary { list-style: none; display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; max-width: 100%; padding: 6px 12px 6px 10px;
    border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 8px; background: var(--accent-soft); color: var(--accent);
    font-weight: 600; cursor: pointer; user-select: none; transition: background .15s, border-color .15s, box-shadow .15s; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before { content: ""; flex: none; width: 7px; height: 7px; border: solid currentColor; border-width: 0 2px 2px 0; transform: rotate(-45deg); transition: transform .15s; margin-right: 2px; }
  details[open] > summary::before { transform: rotate(45deg); }
  details > summary:hover { border-color: var(--accent); box-shadow: 0 1px 4px color-mix(in srgb, var(--accent) 25%, transparent); }
  details > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  details[open] > summary { background: color-mix(in srgb, var(--tc, var(--accent)) 16%, var(--surface)); border-color: var(--tc, var(--accent)); margin-bottom: 8px; }
  details > summary .chip, details > summary .mono { font-weight: 400; }
  details + details { margin-top: 6px; }
  /* Détail ouvert : barre verticale qui couvre tout le sous-détail (couleur du bloc .trace parent, sinon accent). */
  details[open] { border-left: 3px solid var(--tc, var(--accent)); padding-left: 10px; margin-left: 2px; }
  pre { margin: 0; padding: 10px 12px; background: var(--surface-2); border-radius: 8px; overflow: auto; max-height: 420px; font: 12.5px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; }
  pre.json .j-k { color: var(--accent, #2563eb); }
  pre.json .j-s { color: #15803d; }
  pre.json .j-n { color: #b45309; }
  pre.json .j-b { color: #7c3aed; font-weight: 600; }
  @media (prefers-color-scheme: dark) { pre.json .j-s { color: #4ade80; } pre.json .j-n { color: #fbbf24; } pre.json .j-b { color: #c4b5fd; } }
  table.hx { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.hx th { text-align: left; color: var(--muted); font-weight: 500; padding: 4px 10px 4px 0; white-space: nowrap; vertical-align: top; width: 1%; }
  table.hx td { padding: 4px 0; font-family: var(--mono); word-break: break-all; }
  dl.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin: 0; }
  dl.kv div { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
  dl.kv dt { font-size: 12px; color: var(--muted); }
  dl.kv dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
  table.info { font-size: 13px; }
  table.info th { width: 190px; font-weight: 500; color: var(--muted); white-space: normal; border-top: 1px solid var(--border); }
  table.info td { word-break: break-all; }
  table.info tr:first-child th, table.info tr:first-child td { border-top: 0; }
  .copy { cursor: copy; border-bottom: 1px dashed var(--border); }
  .copy:hover { color: var(--accent); }
  .diff { margin: 0; padding: 8px 0; background: var(--surface-2); border-radius: 8px; overflow: auto; max-height: 420px; font: 12.5px/1.5 var(--mono); }
  .diff div { padding: 0 12px; white-space: pre-wrap; word-break: break-word; }
  .diff .add { background: var(--ok-soft); color: var(--ok); }
  .diff .del { background: var(--bad-soft); color: var(--bad); }
  .diff .skip { color: var(--muted); font-style: italic; }
  table.fields td.differs { background: var(--warn-soft); }
  .checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .checks li { display: flex; gap: 8px; }
  .ok-t { color: var(--ok); } .bad-t { color: var(--bad); } .warn-t { color: var(--warn); }
  .banner { padding: 10px 12px; border-radius: 8px; }
  .banner.pass { background: var(--ok-soft); color: var(--ok); }
  .banner.fail { background: var(--bad-soft); color: var(--bad); }
  .banner.error { background: var(--warn-soft); color: var(--warn); }
  .section { display: grid; gap: 8px; }
  .section h3 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .overlay { position: fixed; inset: 0; background: rgba(10, 12, 16, .45); z-index: 20; display: flex; justify-content: flex-end; }
  .overlay.center { justify-content: center; align-items: flex-start; padding: 40px 16px; overflow: auto; }
  .panel { background: var(--surface); width: min(720px, 100%); height: 100%; overflow: auto; padding: 20px; display: grid; gap: 18px; align-content: start; }
  .overlay.center .panel { height: auto; border-radius: 12px; width: min(820px, 100%); }
  /* Détail d'un résultat : grande modale centrée, défilement interne (en-tête et ✕ toujours visibles). */
  .overlay.center .panel.wide { width: min(1200px, 100%); max-height: calc(100vh - 80px); overflow: auto; padding-top: 0; box-shadow: 0 12px 40px rgba(0, 0, 0, .3); }
  .panel.wide > .panel-h { position: sticky; top: 0; z-index: 1; background: var(--surface); padding: 20px 0 12px; border-bottom: 1px solid var(--border); }
  .panel-h { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
  .row > .grow { flex: 1 1 160px; }
  .editor-item { border: 1px solid var(--border); border-radius: 8px; padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
  .lib { display: grid; gap: 0; }
  .lib-item { border-top: 1px solid var(--border); padding: 12px 0; display: grid; gap: 6px; }
  .lib-item:first-child { border-top: 0; }
  .lib-item a { color: var(--text); font-weight: 600; }
  #toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 40; max-width: min(420px, calc(100vw - 32px)); }
  .toast { background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
  .toast.bad { background: var(--bad); color: #fff; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .heat-t td.hcell { text-align: center; padding: 5px 8px; }

})();
const LOCALE = LANG === "fr" ? "fr-FR" : "en-US";
const tr = (fr, params) => {
  const text = LANG === "en" ? UI_EN[fr] ?? fr : fr;
  return params ? text.replace(/\{(\w+)\}/g, (m, k) => (k in params ? String(params[k]) : m)) : text;
};

/** Place une liste déroulante en position fixe sous son bouton (au-dessus s'il manque de place). */
function placePop(anchor, pop, minWidth = 0) {
  // Position fixe : la liste n'est pas coupée par un tableau ou une carte à défilement.
  const r = anchor.getBoundingClientRect();
  const below = innerHeight - r.bottom - 12;
  const up = below < 220 && r.top > below;
  Object.assign(pop.style, { position: "fixed", left: `${Math.min(r.left, innerWidth - Math.max(r.width, minWidth) - 8)}px`, width: `${Math.max(r.width, minWidth)}px`, right: "auto" });
  if (up) { pop.style.top = "auto"; pop.style.bottom = `${innerHeight - r.top + 4}px`; }
  else { pop.style.bottom = "auto"; pop.style.top = `${r.bottom + 4}px`; }
  const list = pop.querySelector(".picker-list");
  if (list) list.style.maxHeight = `${Math.max(160, Math.min(320, (up ? r.top : below) - (pop.querySelector("input") ? 60 : 16)))}px`;
}

/**
 * Listes déroulantes : le <select> natif (dessiné par le système, non stylable sous macOS) est caché et
 * remplacé par un bouton + une liste au style de l'interface. Le <select> garde la valeur : choisir une
 * option met à jour sa valeur et déclenche « change », donc les actions et la lecture des formulaires
 * existantes fonctionnent sans changement.
 */
function enhanceSelect(sel) {
  if (sel.dataset.enhanced || sel.multiple || sel.size > 1) return;
  sel.dataset.enhanced = "1";
  const wrap = document.createElement("span");
  wrap.className = "picker csel";
  wrap.dataset.picker = "";
  if (sel.style.cssText) wrap.style.cssText = sel.style.cssText;
  sel.parentNode.insertBefore(wrap, sel);
  wrap.appendChild(sel);
  sel.classList.add("csel-native");
  sel.tabIndex = -1;
  sel.setAttribute("aria-hidden", "true");

  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "picker-btn";
  btn.setAttribute("aria-haspopup", "listbox");
  btn.setAttribute("aria-expanded", "false");
  const label = sel.getAttribute("aria-label") || sel.closest("label")?.firstChild?.textContent?.trim();
  if (label) btn.setAttribute("aria-label", label);
  if (sel.id) btn.dataset.for = sel.id;
  const pop = document.createElement("div");
  pop.className = "picker-pop";
  pop.hidden = true;
  wrap.append(btn, pop);

  const current = () => sel.options[sel.selectedIndex];
  const paint = () => {
    btn.disabled = sel.disabled;
    btn.innerHTML = `<span class="v">${esc(current()?.textContent ?? "")}</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true" style="flex:none;opacity:.6"><path d="M6 9l6 6 6-6"/></svg>`;
  };
  const optionHtml = (o) => `<button type="button" class="picker-o ${o.selected ? "on" : ""}" role="option" aria-selected="${o.selected}" data-v="${esc(o.value)}" ${o.disabled ? "disabled" : ""}>${esc(o.textContent)}</button>`;
  const open = () => {
    document.querySelectorAll(".picker-pop:not([hidden])").forEach((p) => { p.hidden = true; });
    const many = sel.options.length > 10;
    pop.innerHTML = `${many ? `<input type="search" placeholder="${esc(tr("Filtrer…"))}" autocomplete="off">` : ""}<div class="picker-list" role="listbox">${[...sel.children].map((c) =>
      c.tagName === "OPTGROUP" ? `<div data-group><div class="picker-g">${esc(c.label)}</div>${[...c.children].map(optionHtml).join("")}</div>` : `<div data-group>${optionHtml(c)}</div>`).join("")}</div>`;
    pop.hidden = false;
    btn.setAttribute("aria-expanded", "true");
    placePop(btn, pop, 180);
    const q = pop.querySelector("input");
    if (q) {
      q.addEventListener("input", () => {
        const t = q.value.trim().toLowerCase();
        pop.querySelectorAll(".picker-o").forEach((o) => { o.hidden = !!t && !o.textContent.toLowerCase().includes(t); });
      });
      q.focus();
    } else (pop.querySelector(".picker-o.on") || pop.querySelector(".picker-o"))?.focus();
    pop.querySelector(".picker-o.on")?.scrollIntoView({ block: "nearest" });
  };
  btn.addEventListener("click", () => (pop.hidden ? open() : (pop.hidden = true)));
  btn.addEventListener("keydown", (e) => { if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); open(); } });
  pop.addEventListener("click", (e) => {
    const o = e.target.closest(".picker-o");
    if (!o || o.disabled) return;
    pop.hidden = true;
    btn.setAttribute("aria-expanded", "false");
    btn.focus();
    if (sel.value === o.dataset.v) return;
    sel.value = o.dataset.v;
    paint();
    sel.dispatchEvent(new Event("change", { bubbles: true }));
  });
  paint();
}
// Toute liste ajoutée à la page (rendu, fenêtres, panneaux) est remplacée dès son insertion.
new MutationObserver(() => document.querySelectorAll("select:not([data-enhanced])").forEach(enhanceSelect))
  .observe(document.documentElement, { childList: true, subtree: true });

const $ = (s, el = document) => el.querySelector(s);
/** Statut d'un modèle chargé, avec la mémoire qu'il occupe : « en mémoire (4.7 Go) ». */
const inMemory = (m) => tr("en mémoire") + (m.memory ? ` (${fmt.gb(m.memory)})` : "");
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
/** Texte JSON (éventuellement entre ```json … ```) réindenté ; tout autre texte inchangé. */
const prettyJson = (text) => {
  const body = String(text ?? "").trim().replace(/^```(?:json)?\s*\n?([\s\S]*?)\n?```$/, "$1");
  if (!/^[{[]/.test(body)) return text;
  try { return JSON.stringify(JSON.parse(body), null, 2); } catch { return text; }
};
/** JSON indenté et coloré (HTML échappé). Les chaînes contenant du JSON sont dépliées. */
const jsonHtml = (v) => {
  if (v == null || v === "") return `<span class="muted">${tr("(vide)")}</span>`;
  if (typeof v === "string") { const p = prettyJson(v); if (p === v) return esc(v); v = JSON.parse(String(v).trim().replace(/^```(?:json)?\s*\n?([\s\S]*?)\n?```$/, "$1")); }
  return JSON.stringify(v, null, 2).replace(/("(?:[^"\\]|\\.)*")(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)|([^"\w-]+|[\w-])/g, (m, str, colon, lit, num, other) =>
    other != null ? esc(other) : str ? `<span class="${colon ? "j-k" : "j-s"}">${esc(str)}</span>${colon || ""}` : lit ? `<span class="j-b">${lit}</span>` : `<span class="j-n">${num}</span>`);
};
const jsonPre = (v) => `<pre class="json">${jsonHtml(v)}</pre>`;

/** Détail HTTP d'un appel LLM relayé : URL réelle, port, clé, requêtes et réponse complètes. */
/**
 * Corps de requête sans ses prompts système (rôle system / developer) : le contenu est remplacé par un
 * repère, et les textes sont renvoyés à part pour être affichés dans un dépliant.
 */
function hideSystemPrompts(body) {
  if (!body || typeof body !== "object" || !Array.isArray(body.messages)) return { body, prompts: [] };
  const prompts = [];
  const messages = body.messages.map((m) => {
    if (!["system", "developer"].includes(m?.role)) return m;
    const text = typeof m.content === "string" ? m.content : JSON.stringify(m.content, null, 2);
    prompts.push(text);
    return { ...m, content: tr("« prompt système n° {n} · {chars} caractères : voir le dépliant ci-dessous »", { n: prompts.length, chars: text.length.toLocaleString(LOCALE) }) };
  });
  return { body: { ...body, messages }, prompts };
}

/** Corps JSON d'une requête, prompts système repliés. */
function requestBody(body) {
  const { body: shown, prompts } = hideSystemPrompts(body);
  return `${jsonPre(shown)}${prompts.map((p, i) => `<details><summary class="small">${tr("Prompt système n° {n} ({chars} caractères)", { n: i + 1, chars: p.length.toLocaleString(LOCALE) })}</summary><pre>${esc(p)}</pre></details>`).join("")}`;
}

function httpExchange(c) {
  const h = c.http;
  if (!h) return "";
  const u = h.upstream, i = h.incoming, r = h.reply;
  const key = u.key ? `<span class="mono">${esc(u.keyHeader)}: </span><span class="mono" data-key="${esc(u.key)}">${esc(u.key.length > 12 ? `${u.key.slice(0, 6)}…${u.key.slice(-4)}` : "••••")}</span> <button class="link small" data-action="revealKey">${tr("afficher")}</button>` : `<span class="muted">${tr("aucune")}</span>`;
  return `<div class="section"><h3>${tr("Appel HTTP")}</h3>
    <table class="hx">
      <tr><th>${tr("URL réelle appelée")}</th><td>${esc(u.method)} ${esc(u.url)}</td></tr>
      <tr><th>${tr("Hôte · port")}</th><td>${esc(u.host)} · ${u.port}</td></tr>
      <tr><th>${tr("Clé envoyée")}</th><td>${key}</td></tr>
      <tr><th>${tr("Appelé par le serveur")}</th><td>${esc(i.method)} ${esc(i.url)}</td></tr>
      <tr><th>${tr("Port local · client")}</th><td>${i.localPort ?? "?"} · ${esc(i.remoteAddress || "?")}:${i.remotePort ?? "?"}</td></tr>
      <tr><th>${tr("Réponse")}</th><td>HTTP ${r.status}${r.statusText ? ` ${esc(r.statusText)}` : ""} · ${tr("{n} octets", { n: r.bytes.toLocaleString(LOCALE) })} · ${fmt.s(c.latencyMs)}</td></tr>
    </table>
    <details><summary class="small">${tr("Requête reçue du serveur — en-têtes")}</summary>${jsonPre(i.headers)}</details>
    <details><summary class="small">${tr("Requête reçue du serveur — corps")}</summary>${requestBody(i.body)}</details>

async function api(path, opts = {}) {
  const res = await fetch(path, {
    method: opts.method || "GET",
    headers: { "x-llm-bench-lang": LANG, ...(opts.body !== undefined ? { "Content-Type": "application/json" } : {}) },
    body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error(data?.error || res.statusText);
  return data;
}

function toast(msg, bad = false) {

}

/** Statistiques d'un modèle sur toutes les campagnes (classement serveur), ou null. */
const lbOf = (key) => (state.leaderboard || []).find((x) => x.model === key) || null;
const isLocalKey = (key) => { const p = providerInfo(providerOf(key)); return p?.kind === "ollama" || /\/\/(localhost|127\.0\.0\.1)/.test(p?.baseUrl || ""); };

/** Durée et coût estimés d'une campagne, d'après les latences et coûts médians des campagnes passées. */
function estimateRun(models, nCases, runs, parallel) {
  const calls = nCases * runs;
  let local = 0, remote = 0, unknown = 0, cost = 0, costUnknown = false;
  for (const k of models) {
    const lb = lbOf(k);
    if (lb?.medianLatencyMs == null) unknown++;
    else if (isLocalKey(k)) local += lb.medianLatencyMs * calls;
    else remote += lb.medianLatencyMs * calls;
    if (tierOfKey(k) === "paid") { if (lb?.costPerCall == null) costUnknown = true; else cost += lb.costPerCall * calls; }
  }
  // Modèles locaux à la suite ; modèles distants en parallèle (en même temps que les locaux si parallélisme > 1).
  const ms = parallel > 1 ? Math.max(local, remote / parallel) : local + remote;
  return { ms, unknown, cost: costUnknown ? null : cost, paid: models.filter((k) => tierOfKey(k) === "paid").length };
}

function failingResults(r) { return r.results.filter((x) => x.status !== "pass"); }

/** Tuiles d'indicateurs d'un rapport : meilleur score, meilleur gratuit, plus rapide, JSON, coût. */
function kpiTiles(tiles) {
  return `<div class="kpis">${tiles.filter(Boolean).map((t) => `<div class="kpi"><div class="l">${t.label}</div><div class="v">${t.value}</div><div class="s" title="${esc(t.sub || "")}">${esc(t.sub || "")}</div></div>`).join("")}</div>`;
}
const ratio = (n, t) => (t ? n / t : -1);
const best = (list, score) => list.reduce((a, b) => (a == null || score(b) > score(a) ? b : a), null);

function promptKpis(r) {
  const rows = r.summary.filter((x) => x.total);
  if (!rows.length) return "";
  const top = best(rows, (x) => ratio(x.passed, x.total));
  const free = best(rows.filter((x) => x.tier === "free"), (x) => ratio(x.passed, x.total));
  const fast = best(rows.filter((x) => x.medianLatencyMs != null), (x) => -x.medianLatencyMs);
  const total = rows.reduce((n, x) => n + x.total, 0), json = rows.reduce((n, x) => n + x.jsonOk, 0);
  const cost = rows.some((x) => x.totalCost != null) ? rows.reduce((n, x) => n + (x.totalCost || 0), 0) : null;
  return kpiTiles([
    { label: tr("Meilleur score"), value: fmt.pct(top.passed, top.total), sub: top.model },
    free && free !== top ? { label: tr("Meilleur gratuit"), value: fmt.pct(free.passed, free.total), sub: free.model } : null,
    fast && { label: tr("Le plus rapide"), value: fmt.s(fast.medianLatencyMs), sub: tr("médiane · {model}", { model: fast.model }) },
    { label: tr("JSON valide"), value: fmt.pct(json, total), sub: tr("{n} réponses", { n: total }) },
    { label: tr("Coût de la campagne"), value: cost == null ? "–" : money(cost), sub: cost == null ? tr("aucun prix renseigné") : "" },
  ]);
}

/** Barre de score : vert ≥ 90 %, bleu ≥ 75 %, orange en dessous. */
function scoreBar(passed, total) {
  const pct = total ? (passed / total) * 100 : 0;
  const color = pct >= 90 ? "var(--ok)" : pct >= 75 ? "var(--accent)" : "var(--warn)";
  return `<div class="sbar"><div class="track"><div style="width:${pct}%;background:${color}"></div></div><b>${fmt.pct(passed, total)}</b></div>`;
}

/**
 * Carte réussi / échoué : une ligne par cas, une colonne par modèle ou serveur.
 * cases = [{ id, text }] ; cols = [{ label, sub, results: (caseId) => [...] }].
 */
/** Tableau cas × colonnes. `status` (filtre) : seules les cases de ce statut s'affichent, les colonnes sans aucune case retenue sont masquées. */
function heatmap(cases, cols, openAction, status = "") {
  const pick = (rs) => (status ? rs.filter((x) => x.status === status) : rs);
  if (status) cols = cols.filter((col) => cases.some((c) => pick(col.results(c.id)).length));
  const cell = (all) => {
    if (!all.length) return `<span class="none">–</span>`;
    const rs = pick(all);
    if (!rs.length) return `<span class="none" title="${tr("Masqué par le filtre de statut")}">·</span>`;
    const st = new Set(rs.map((x) => x.status));
    const cls = st.size === 1 ? [...st][0] : st.has("error") && !st.has("pass") ? "error" : "mix";
    const last = rs[rs.length - 1];
    const label = rs.map((x) => (x.status === "pass" ? tr("réussi") : x.status === "fail" ? tr("échoué") : tr("erreur"))).join(", ");
    const why = rs.filter((x) => x.status !== "pass").map((x) => x.error || (x.failures || []).join(" ; ")).filter(Boolean)[0] || "";
    return `<button type="button" class="${cls}" data-action="${openAction}" data-id="${esc(last.id)}" title="${esc(`${last.caseId} : ${label}${why ? ` — ${why}` : ""}`)}">
      <span>${cls === "mix" ? "±" : RESULT_ICON[cls]}</span><span class="t">${fmt.s(last.latencyMs)}${all.length > 1 ? ` · ${(status ? rs : rs.filter((x) => x.status === "pass")).length}/${all.length}` : ""}</span></button>`;
  };
  return `
    <div class="legend"><span><i style="background:var(--ok)"></i>${tr("réussi")}</span><span><i style="background:#b4530f"></i>${tr("échoué")}</span><span><i style="background:var(--text)"></i>${tr("erreur")}</span><span><i style="background:linear-gradient(135deg,var(--ok) 50%,#b4530f 50%)"></i>${tr("variable selon les runs")}</span></div>
    <div class="table-wrap" style="margin-top:10px"><table class="heat-t">
      <thead><tr><th>${tr("Cas")}</th>${cols.map((c) => `<th class="hcol" title="${esc(c.label)}"><span class="mono">${esc(c.label)}</span>${c.sub ? `<div class="muted" style="font-weight:400;text-transform:none;letter-spacing:0">${c.sub}</div>` : ""}</th>`).join("")}</tr></thead>
      <tbody>${cases.map((c) => `<tr>
        <td class="hcase"><span class="mono strong">${esc(c.id)}</span>${c.html ?? (c.text ? `<div class="muted small">${esc(c.text)}</div>` : "")}</td>
        ${cols.map((col) => `<td class="hcell">${cell(col.results(c.id))}</td>`).join("")}
      </tr>`).join("")}</tbody>
    </table></div>`;
}

function promptRanking(r) {
  const rows = [...r.summary].sort((a, b) => ratio(b.passed, b.total) - ratio(a.passed, a.total));
  return `
  <section class="card">
    <div class="card-h"><h3>${tr("Classement")}</h3><span class="muted small">${tr("trié par score")}</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th style="width:40px">#</th><th>${tr("Modèle")}</th><th style="width:260px">${tr("Score")}</th><th class="num">${tr("JSON valide")}</th><th class="num">${tr("Latence méd.")}</th><th class="num">tok/s</th><th class="num">${tr("Coût / appel")}</th></tr></thead>
      <tbody>${rows.map((x, i) => `<tr>
        <td class="rank">${i + 1}</td>
        <td class="mono" style="white-space:nowrap">${esc(x.model)} ${tierChip(x.tier)}${x.error ? `<div class="bad-t small">${esc(x.error)}</div>` : ""}</td>
        <td>${scoreBar(x.passed, x.total)}<div class="muted small">${x.passed}/${x.total}</div></td>
        <td class="num">${fmt.pct(x.jsonOk, x.total)}</td><td class="num">${fmt.s(x.medianLatencyMs)}</td><td class="num">${fmt.n(x.avgTokensPerSec)}</td><td class="num">${money(x.costPerCall)}</td>
      </tr>`).join("")}</tbody>
    </table></div>
  </section>`;
}

function promptHeat(r) {
  if (!r.results.length) return "";
  const byScore = [...r.summary].sort((a, b) => ratio(b.passed, b.total) - ratio(a.passed, a.total));
  const { cases, bar } = heatFilter(r, state.heatFilter, "heatCat", "heatStatus");
  const comparable = (id) => new Set(r.results.filter((x) => x.caseId === id && x.raw != null).map((x) => x.model)).size >= 2;
  return `
  <section class="card">
    <div class="card-h"><h3>${tr("Résultats par cas")} <span class="muted small">${cases.length}/${r.cases.length}</span></h3><span class="muted small">${tr("cliquer une case pour le détail")}</span></div>
    ${bar}
    ${cases.length
      ? heatmap(cases.map((c) => ({ id: c.id, html: heatCaseHtml(c.category || c.intent, c.message,
          comparable(c.id) && `<button class="link small" data-action="openDiff" data-case="${esc(c.id)}" title="${tr("Comparer les réponses des modèles sur ce cas : champs JSON qui diffèrent et diff ligne à ligne par rapport à un modèle de référence")}">⇄ ${tr("Comparer les réponses")}</button>`) })),
        byScore.map((s) => ({ label: s.model, sub: `${tierChip(s.tier)} ${fmt.pct(s.passed, s.total)}`, results: (id) => r.results.filter((x) => x.caseId === id && x.model === s.model) })), "openResult", state.heatFilter.status)
      : `<p class="empty">${tr("Aucun cas ne correspond aux filtres.")}</p>`}
  </section>`;
}

function serverRanking(r) {
  const rows = [...r.summary].sort((a, b) => ratio(b.passed, b.total) - ratio(a.passed, a.total));
  return `
  <section class="card">
    <div class="card-h"><h3>${tr("Classement")}</h3><span class="muted small">${tr("trié par score")}</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th style="width:40px">#</th><th>${tr("Serveur")}</th><th style="width:260px">${tr("Score")}</th><th class="num">${tr("Vérifs OK")}</th><th class="num">${tr("Latence méd.")}</th><th class="num">${tr("Appels LLM")}</th><th class="num">${tr("Coût / cas")}</th></tr></thead>
      <tbody>${rows.map((x, i) => `<tr>
        <td class="rank">${i + 1}</td>
        <td><span class="strong">${esc(x.name)}</span><div class="mono small">${esc(x.model)} ${providerChip(x.provider)}</div></td>
        <td>${scoreBar(x.passed, x.total)}<div class="muted small">${tr("{n}/{total} cas", { n: x.passed, total: x.total })}</div></td>
        <td class="num">${fmt.pct(x.checksOk, x.checksTotal)}</td><td class="num">${fmt.s(x.medianStepMs)}</td>
        <td class="num">${fmt.n(x.llmCalls)}${x.llmErrors ? `<div class="bad-t small">${tr("{n} en erreur", { n: x.llmErrors })}</div>` : ""}</td><td class="num">${money(x.costPerCase)}</td>
      </tr>`).join("")}</tbody>
    </table></div>
  </section>`;
}

/** Filtres catégorie / statut de « Résultats par cas » : cas retenus et barre de filtres. Statut : au moins un résultat dans ce statut. */
function heatFilter(r, f, catAction, statusAction) {
  const cats = [...new Set(r.cases.map((c) => c.category || ""))].sort();
  const cases = r.cases.filter((c) => (f.cat === null || (c.category || "") === f.cat)
    && (!f.status || r.results.some((x) => x.caseId === c.id && x.status === f.status)));
  const counts = Object.fromEntries(["pass", "fail", "error"].map((st) => [st, new Set(r.results.filter((x) => x.status === st).map((x) => x.caseId)).size]));
  const bar = `<div class="row" style="margin-bottom:12px">
      ${cats.length > 1 || cats[0] ? `<label class="field">${tr("Catégorie")}
        <select data-action="${catAction}"><option value="*">${tr("Toutes les catégories")}</option>${cats.map((c) => `<option value="${esc(c)}" ${f.cat === c ? "selected" : ""}>${esc(c || tr("sans catégorie"))}</option>`).join("")}</select></label>` : ""}
      <label class="field">${tr("Statut")}
        <span class="seg">${[["", tr("Tous")], ["pass", `${RESULT_ICON.pass} ${tr("réussi")}`], ["fail", `${RESULT_ICON.fail} ${tr("échoué")}`], ["error", `${RESULT_ICON.error} ${tr("erreur")}`]].map(([v, l]) =>
          `<button type="button" class="${f.status === v ? "on" : ""}" data-action="${statusAction}" data-v="${v}" ${v && !counts[v] ? "disabled" : ""} title="${v ? esc(tr("Afficher uniquement les résultats « {label} » ({n} cas)", { label: l, n: counts[v] })) : ""}">${l}</button>`).join("")}</span></label>
    </div>`;
  return { cases, bar };
}

/** Cellule « Cas » : catégorie, message(s), lien Comparer. */
const heatCaseHtml = (category, text, compare) => `${category ? ` <span class="chip">${esc(category)}</span>` : ""}
  ${text ? `<div class="muted small" title="${esc(text)}">${esc(text)}</div>` : ""}${compare ? `<div>${compare}</div>` : ""}`;

function serverHeat(r) {
  if (!r.results.length) return "";
  const byScore = [...r.summary].sort((a, b) => ratio(b.passed, b.total) - ratio(a.passed, a.total));
  const { cases, bar } = heatFilter(r, state.mHeatFilter, "mHeatCat", "mHeatStatus");
  return `
  <section class="card">
    <div class="card-h"><h3>${tr("Résultats par cas")} <span class="muted small">${cases.length}/${r.cases.length}</span></h3><span class="muted small">${tr("cliquer une case pour le détail des étapes")}</span></div>
    ${bar}
    ${cases.length
      ? heatmap(cases.map((c) => ({ id: c.id, html: heatCaseHtml(c.category, c.steps.map((st) => st.message).join(" → "),
          serverRunsFor(r, c.id).length >= 2 && `<button class="link small" data-action="openMDiff" data-case="${esc(c.id)}" title="${tr("Comparer les réponses des serveurs sur ce cas, étape par étape : champs JSON qui diffèrent et diff du message par rapport à un serveur de référence")}">⇄ ${tr("Comparer les réponses")}</button>`) })),
        byScore.map((s) => ({ label: s.name, sub: `${esc(s.model)} · ${fmt.pct(s.passed, s.total)}`, results: (id) => r.results.filter((x) => x.caseId === id && x.serverId === s.serverId) })), "openMResult", state.mHeatFilter.status)
      : `<p class="empty">${tr("Aucun cas ne correspond aux filtres.")}</p>`}
  </section>`;
}

function serverKpis(r) {
  const rows = r.summary.filter((x) => x.total);
  if (!rows.length) return "";
  const top = best(rows, (x) => ratio(x.passed, x.total));
  const fast = best(rows.filter((x) => x.medianStepMs != null), (x) => -x.medianStepMs);
  const calls = rows.reduce((n, x) => n + (x.llmCalls || 0), 0), llmErr = rows.reduce((n, x) => n + (x.llmErrors || 0), 0);
  const cost = rows.some((x) => x.totalCost != null) ? rows.reduce((n, x) => n + (x.totalCost || 0), 0) : null;
  return kpiTiles([
    { label: tr("Meilleur score"), value: fmt.pct(top.passed, top.total), sub: `${top.name} · ${top.model}` },
    fast && { label: tr("Réponse la plus rapide"), value: fmt.s(fast.medianStepMs), sub: tr("médiane par requête · {name}", { name: fast.name }) },
    { label: tr("Appels LLM"), value: fmt.n(calls), sub: llmErr ? tr("{n} en erreur", { n: llmErr }) : tr("aucune erreur") },
    { label: tr("Coût de la campagne"), value: cost == null ? "–" : money(cost), sub: cost == null ? tr("aucun prix renseigné") : "" },
  ]);
}

function viewReport() {
  const r = state.report;
  const failing = failingResults(r);
  const running = r.status === "running";
  const replayingAll = state.replaying.size > 0;

  return `

    <div class="card-h">
      <div>

// ---- Comparaison des réponses entre modèles ----
/** JSON à clés triées (l'ordre des clés ne doit pas créer de différence). */
const sortKeys = (v) => (Array.isArray(v) ? v.map(sortKeys) : v && typeof v === "object" ? Object.fromEntries(Object.keys(v).sort().map((k) => [k, sortKeys(v[k])])) : v);
const answerText = (x) => (x.parsed !== undefined ? JSON.stringify(sortKeys(x.parsed), null, 2) : prettyJson(x.raw ?? ""));

/** Feuilles d'un JSON : chemin → valeur (texte JSON). */
function leaves(v, path = "", out = {}) {
  if (v && typeof v === "object" && (Array.isArray(v) ? v.length : Object.keys(v).length)) {
    for (const [k, w] of Object.entries(v)) leaves(w, Array.isArray(v) ? `${path}[${k}]` : path ? `${path}.${k}` : k, out);
  } else out[path || tr("(racine)")] = JSON.stringify(v);
  return out;
}

/** Diff ligne à ligne (plus longue sous-séquence commune) : [{ t: " " | "+" | "-", line }]. */
function lineDiff(a, b) {
  const A = a.split("\n"), B = b.split("\n");
  if (A.length * B.length > 4e6) return [...A.map((line) => ({ t: "-", line })), ...B.map((line) => ({ t: "+", line }))];
  const L = Array.from({ length: A.length + 1 }, () => new Uint32Array(B.length + 1));
  for (let i = A.length - 1; i >= 0; i--) for (let j = B.length - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = [];
  let i = 0, j = 0;
  while (i < A.length && j < B.length) {
    if (A[i] === B[j]) { out.push({ t: " ", line: A[i] }); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) out.push({ t: "-", line: A[i++] });
    else out.push({ t: "+", line: B[j++] });
  }
  while (i < A.length) out.push({ t: "-", line: A[i++] });
  while (j < B.length) out.push({ t: "+", line: B[j++] });
  return out;
}

/** Lignes communes repliées au-delà de 3 lignes de contexte autour des changements. */
function renderDiff(d) {
  const near = d.map((_, k) => d.slice(Math.max(0, k - 3), k + 4).some((x) => x.t !== " "));
  let html = "", skipped = 0;
  const flush = () => { if (skipped) html += `<div class="skip">… ${skipped > 1 ? tr("{n} lignes identiques", { n: skipped }) : tr("{n} ligne identique", { n: skipped })}</div>`; skipped = 0; };
  d.forEach((x, k) => {
    if (x.t === " " && !near[k]) { skipped++; return; }
    flush();
    html += `<div class="${x.t === "+" ? "add" : x.t === "-" ? "del" : ""}">${x.t === " " ? "  " : x.t + " "}${esc(x.line)}</div>`;
  });
  flush();
  return `<div class="diff">${html}</div>`;
}

/**
 * Comparaison de réponses : items = [{ key, label, status, latencyMs, parsed, text, note }].
 * Champs JSON qui diffèrent (clés triées) puis diff ligne à ligne de chaque réponse avec la référence.
 */
function diffBody(items, refKey) {
  const ref = items.find((x) => x.key === refKey) || items[0];
  const json = items.filter((x) => x.parsed !== undefined);
  const leafs = json.map((x) => leaves(x.parsed));
  const paths = [...new Set(leafs.flatMap((l) => Object.keys(l)))].sort();
  const differing = paths.filter((p) => new Set(leafs.map((l) => l[p] ?? "∅")).size > 1);
  const refLeaves = ref.parsed !== undefined ? leaves(ref.parsed) : {};
  const head = (x) => `<span class="pill ${x.status}">${RESULT_ICON[x.status] || "·"}</span> <span class="mono strong">${esc(x.label)}</span> <span class="muted small">${fmt.s(x.latencyMs)}${x.note ? " · " + esc(x.note) : ""}</span>`;
  return `
    <div class="row" style="align-items:center">
      <label class="field">${tr("Référence")}
        <select data-action="diffRef">${items.map((x) => `<option value="${esc(x.key)}" ${x === ref ? "selected" : ""}>${esc(x.label)}</option>`).join("")}</select></label>
      <span class="muted small" style="align-self:center">${tr("Dernière réponse de chacun. JSON réindenté, clés triées : seules les vraies différences ressortent.")}</span>
    </div>

    ${json.length >= 2 ? `<div class="section"><h3>${tr("Champs qui diffèrent")} <span class="muted">${differing.length}/${paths.length}</span></h3>
      ${differing.length ? `<div class="table-wrap"><table class="fields small">
        <thead><tr><th>${tr("Champ")}</th>${json.map((x) => `<th class="mono">${esc(x.label)}${x === ref ? ` <span class="chip accent">${tr("réf.")}</span>` : ""}</th>`).join("")}</tr></thead>
        <tbody>${differing.map((p) => `<tr><td class="mono">${esc(p)}</td>${json.map((x, k) => {
          const v = leafs[k][p];
          return `<td class="mono ${x !== ref && v !== refLeaves[p] ? "differs" : ""}">${v === undefined ? `<span class="muted">${tr("absent")}</span>` : esc(v)}</td>`;
        }).join("")}</tr>`).join("")}</tbody></table></div>` : `<p class="ok-t small" style="margin:0">${tr("Mêmes valeurs partout.")}</p>`}
      ${json.length < items.length ? `<p class="muted small" style="margin:0">${tr("Sans JSON (non comparés champ par champ) : {list}.", { list: items.filter((x) => x.parsed === undefined).map((x) => `<span class="mono">${esc(x.label)}</span>`).join(", ") })}</p>` : ""}
    </div>` : ""}

    <div class="section"><h3>${tr("Référence")}</h3><div>${head(ref)}</div><pre>${esc(ref.text)}</pre></div>

    ${items.filter((x) => x !== ref).map((x) => {
      const d = lineDiff(ref.text, x.text);
      const added = d.filter((y) => y.t === "+").length, removed = d.filter((y) => y.t === "-").length;
      return `<div class="section"><h3>${tr("Différences avec la référence")}</h3>
        <div>${head(x)} ${added || removed ? `<span class="small"><span class="ok-t">+${added}</span> <span class="bad-t">−${removed}</span> ${tr("lignes")}</span>` : `<span class="chip ok">${tr("identique")}</span>`}</div>
        ${added || removed ? renderDiff(d) : ""}</div>`;
    }).join("")}`;
}

// ---- Comparaison des réponses entre serveurs (bench serveur) ----
/** Texte comparable d'une étape : message rédigé, une phrase par ligne ; sinon la réponse JSON. */
function stepText(st) {
  if (st.reply) return String(st.reply).replace(/([.!?…])\s+/g, "$1\n").trim();
  if (st.response !== undefined && st.response !== null) return typeof st.response === "string" ? prettyJson(st.response) : JSON.stringify(sortKeys(st.response), null, 2);
  return st.error || "";
}

/** Serveurs ayant joué ce cas : dernière exécution de chacun. */
function serverRunsFor(r, caseId) {
  return r.servers.map((s) => {
    const res = r.results.filter((x) => x.caseId === caseId && x.serverId === s.id).sort((a, b) => a.at.localeCompare(b.at)).at(-1);
    return res ? { server: s, res } : null;
  }).filter(Boolean);
}

function modalMDiff() {
  const r = state.mReport;
  const c = r.cases.find((y) => y.id === state.mDiffCase);
  const runs = serverRunsFor(r, state.mDiffCase);
  if (runs.length < 2 || !c) return "";
  const nSteps = Math.max(...runs.map((x) => x.res.steps.length));
  const i = Math.min(state.mDiffStep || 0, nSteps - 1);
  const items = runs.filter((x) => x.res.steps[i]).map(({ server, res }) => {
    const st = res.steps[i];
    return {
      key: server.id, label: server.name, status: st.status, latencyMs: st.latencyMs,
      parsed: st.response && typeof st.response === "object" ? st.response : undefined,
      text: stepText(st),
      note: [server.model, st.kind, tr("{n} appel(s) LLM", { n: (st.llmCalls || []).length })].filter(Boolean).join(" · "),

  const message = c.steps[i]?.message ?? runs.find((x) => x.res.steps[i])?.res.steps[i].message;
  return `<div class="overlay center" data-action="closeModal"><div class="panel" data-stop style="width:min(1200px,100%)">

    ${items.length >= 2 ? diffBody(items, state.diffRef) : `<p class="empty">${tr("Moins de deux serveurs ont joué cette étape.")}</p>`}

}

/** Champ "tuples" : [{adult: 2, child: 0}, …] ↔ "2+0, …" selon les clés du champ. */
const tuplesToText = (v, keys) => (Array.isArray(v) ? v.map((r) => keys.map((k) => r?.[k] ?? 0).join("+")).join(", ") : "");
const textToTuples = (t, keys) => String(t).split(",").map((s) => s.trim()).filter(Boolean).map((s) => {
  const parts = s.split("+").map((n) => Number(n.trim()) || 0);
  return Object.fromEntries(keys.map((k, i) => [k, parts[i] ?? 0]));
});

function fieldInput(f, v, path) {
  if (f.kind === "select") {
    const opts = f.options.includes(v) || v == null || v === "" ? f.options : [v, ...f.options];
    return `<select data-path="${path}">${opts.map((o) => `<option value="${esc(o)}" ${o === v ? "selected" : ""}>${esc(f.optionLabels?.[o] ?? o)}</option>`).join("")}</select>`;
  }
  if (f.kind === "tuples") return `<input type="text" data-path="${path}" data-kind="tuples" data-keys="${esc((f.keys || ["a", "b"]).join(","))}" value="${esc(tuplesToText(v, f.keys || ["a", "b"]))}" placeholder="${esc(f.placeholder || "")}">`;
  if (f.kind === "number") return `<input type="number" data-path="${path}" data-kind="number" value="${esc(v ?? "")}" placeholder="${esc(f.placeholder || "")}" style="width:110px">`;
  if (f.kind === "boolean") return `<input type="checkbox" data-path="${path}" ${v ? "checked" : ""}>`;
  return `<input type="text" data-path="${path}" value="${esc(v ?? "")}" placeholder="${esc(f.placeholder || "")}">`;
}

/** Recopie les champs du formulaire dans le brouillon (avant un re-rendu ou l'enregistrement). */
function readEditor() {
  const d = (state.editing || state.mEditing).draft;
  document.querySelectorAll("#layer [data-path]").forEach((el) => {
    const keys = el.dataset.path.split(".");
    let v = el.type === "checkbox" ? el.checked : el.value;
    if (el.dataset.kind === "tuples") v = textToTuples(v, el.dataset.keys.split(","));
    if (el.dataset.kind === "number") v = v === "" ? "" : Number(v);
    let o = d;
    keys.slice(0, -1).forEach((k) => { o = o[k]; });
    o[keys.at(-1)] = v;
  });
}

/** Fournisseurs (hors Ollama) d'une offre, avec leurs modèles et leur état. */
function providerRows(tier) {
  return (state.status?.providers || []).filter((p) => p.tier === tier && p.kind !== "ollama").flatMap((p) => {
    const g = state.avail.find((x) => x.name === p.name);
    const models = g?.models.length ? g.models.map((m) => m.model) : p.models;
    return models.map((model) => ({ p, model, error: g?.error || p.unavailable }));
  });
}
const hostOf = (url) => String(url || "").replace(/^(https?:\/\/[^/]+).*$/, "$1");

const fromConfigNote = () => `<span class="muted small" title="${tr("Déclaré dans {file}", { file: esc(state.status?.configFile || "bench.config.ts") })}">${tr("config")}</span>`;

    <div class="card-h" style="padding:16px 20px;margin:0;border-bottom:1px solid var(--border)"><h2>${tr("Classement sur vos cas")} <span class="muted" style="font-weight:400">${tr("(toutes les campagnes du bench prompt)")}</span></h2>
      <span class="muted small">${tr("score = cas réussis · latence médiane · débit en sortie")}</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th style="padding-left:20px">${tr("Modèle")}</th><th>${tr("Offre")}</th><th style="width:240px">${tr("Score")}</th><th class="num">${tr("Latence")}</th><th class="num">tok/s</th><th class="num">${tr("Réponses")}</th><th>${tr("État")}</th><th></th></tr></thead>
      <tbody>${rows.length ? rows.map(({ m, lb }) => `<tr>

        <td>${lb ? scoreBar(lb.passed, lb.total) : `<span class="muted small">${tr("jamais testé")}</span>`}</td>
        <td class="num">${fmt.s(lb?.medianLatencyMs)}</td><td class="num">${fmt.n(lb?.medianTokensPerSec)}</td><td class="num">${lb ? lb.total : "–"}</td>
        <td class="small">${stateOf(m)}</td>

/** Routage de la passerelle : votre application → passerelle → fournisseur réel (hôte et port). */
function gatewayRoute(g) {
  const envNames = state.status?.server?.env;
  const p = g.target ? providerInfo(providerOf(g.target)) : null;
  let host = "", port = "";
  try {
    const u = new URL(p?.baseUrl || "");
    host = u.hostname;
    port = u.port || (u.protocol === "https:" ? "443" : "80");
  } catch { /* fournisseur sans URL */ }
  const gwUrl = (() => { try { return new URL(g.url); } catch { return null; } })();
  const last = g.calls?.[0];
  return `
  <section class="card">
    <div class="card-h"><h2>${tr("Routage")}</h2>
      ${last ? `<span class="muted small">${tr("dernier appel : {time} · HTTP {status} · {latency}", { time: new Date(last.at).toLocaleTimeString(LOCALE), status: last.status, latency: fmt.s(last.latencyMs) })}</span>` : ""}</div>
    <div class="route">
      <div class="node"><span class="k">${tr("Votre application")}</span><span class="t">${esc(state.status?.name || tr("projet"))}</span>
        <span class="d">${envNames ? `${esc(envNames.baseUrl)} = ${tr("la passerelle")}` : tr("endpoint compatible OpenAI")}</span></div>
      <div class="arrow">${tr("requête OpenAI")}</div>
      <div class="node gw"><span class="k">${tr("Passerelle llm-bench")}</span><span class="t">${esc(gwUrl ? gwUrl.host + gwUrl.pathname : g.url)}</span>
        <span class="d">${tr("port {port}", { port: esc(gwUrl?.port || "") })}</span></div>
      <div class="arrow">${tr("modèle remplacé · clé ajoutée")}</div>
      <div class="node"><span class="k">${tr("Fournisseur")} ${tierChip(g.tier)}</span>
        <span class="t">${g.target ? esc(g.target) : `<span class="warn-t">${tr("aucun modèle choisi")}</span>`}</span>
        <span class="d">${host ? `${esc(host)} · ${tr("port {port}", { port: esc(port) })}` : "–"}</span></div>
    </div>
  </section>`;
}

/** Texte à coller dans le .env du projet pour l'appeler via la passerelle. */
function gatewayEnvText(g) {
  const envNames = state.status?.server?.env;
  return envNames
    ? `${envNames.baseUrl}=${g.url}\n${envNames.apiKey ? `${envNames.apiKey}=llm-bench   # ${tr("la vraie clé est ajoutée par la passerelle")}\n` : ""}${envNames.model}=<${tr("n'importe quel nom : remplacé par la passerelle")}>`
    : `baseURL = ${g.url}\napiKey  = llm-bench   (${tr("la vraie clé est ajoutée par la passerelle")})`;
}

/** Détail compact d'un appel de la passerelle (colonne de droite). */
function gatewayCallDetail(c) {
  const h = c.http;
  const u = h?.upstream, i = h?.incoming, r = h?.reply;
  const key = u?.key ? `<span class="mono">${esc(u.keyHeader)}: </span><span class="mono" data-key="${esc(u.key)}">${esc(u.key.length > 12 ? `${u.key.slice(0, 6)}…${u.key.slice(-4)}` : "••••")}</span> <button class="link small" data-action="revealKey">${tr("afficher")}</button>` : `<span class="muted">${tr("aucune")}</span>`;
  return `
    ${c.error ? `<div class="banner fail small mono">${esc(c.error)}</div>` : ""}
    ${h ? `<dl class="gwdl">
      <dt>${tr("URL réelle")}</dt><dd class="mono">${esc(u.method)} ${esc(u.url)}</dd>
      <dt>${tr("Hôte · port")}</dt><dd class="mono">${esc(u.host)} · ${u.port}</dd>
      <dt>${tr("Clé envoyée")}</dt><dd>${key}</dd>
      <dt>${tr("Appelé par")}</dt><dd class="mono">${esc(i.remoteAddress || "?")}:${i.remotePort ?? "?"} → :${i.localPort ?? "?"}${esc((() => { try { return new URL(i.url).pathname; } catch { return ""; } })())}</dd>
      <dt>${tr("Réponse")}</dt><dd class="mono">HTTP ${r.status}${r.statusText ? ` ${esc(r.statusText)}` : ""} · ${tr("{n} octets", { n: r.bytes.toLocaleString(LOCALE) })} · ${fmt.s(c.latencyMs)}</dd>
    </dl>
    <div style="display:grid;gap:6px">
      <details><summary>${tr("Requête reçue du serveur")}</summary>${requestBody(i.body)}<details><summary class="small">${tr("En-têtes")}</summary>${jsonPre(i.headers)}</details></details>
      <details open><summary>${tr("Requête envoyée au fournisseur")}</summary>${requestBody(u.body)}<details><summary class="small">${tr("En-têtes")}</summary>${jsonPre(u.headers)}</details></details>
      <details><summary>${tr("Réponse du fournisseur")}${Array.isArray(r.body) && c.stream ? ` (${tr("{n} événements SSE", { n: r.body.length })})` : ""}</summary>${jsonPre(r.body)}<details><summary class="small">${tr("En-têtes")}</summary>${jsonPre(r.headers)}</details></details>
    </div>` : `<p class="muted small">${tr("Pas de détail HTTP pour cet appel.")}</p>`}`;
}

function viewGateway() {

  if (!g) return `<section class="card"><p class="empty"><span class="spin"></span> ${tr("Chargement…")}</p></section>`;
  const st = g.stats;
  const sel = g.calls.find((c) => c.id === state.gwSel) || null;
  const toggle = [["free", tr("Gratuit")], ["paid", tr("Payant")]].map(([t, l]) => {
    const k = g.quick?.[t];
    const on = g.tier === t;
    return `<button type="button" class="gwt ${t} ${on ? "on" : ""}" data-action="gwUse" data-v="${esc(k || "")}" ${k ? "" : "disabled"} aria-pressed="${on}"
      title="${esc(k || (t === "free" ? tr("aucun modèle gratuit : en choisir un dans la liste ci-dessous") : tr("aucun modèle payant : en choisir un dans la liste ci-dessous")))}">
      <span class="l">${l}${on ? ` · ${tr("actif")}` : ""}</span><span class="m">${k ? esc(modelOf(k)) : tr("aucun")}</span></button>`;
  }).join("");
  return `
  <div class="pagehead">
    <div><h1>${tr("Passerelle")}</h1><p>${tr("Un endpoint fixe pour votre projet ; le modèle réel se choisit ici.")}</p></div>
    <div class="gwtoggle" role="group" aria-label="${tr("Bascule gratuit ou payant")}" title="${tr("Bascule vers le dernier modèle utilisé dans l'offre (sinon le profil de la config)")}">${toggle}</div>
  </div>

  ${gatewayRoute(g)}

  <section class="card">
    <div class="card-h"><h2>${tr("Brancher le projet")}</h2>
      ${g.profiles.length ? `<span class="muted small">${tr("Profils de la config :")} ${g.profiles.map((p) => `<button class="link small ${g.profile === p.name ? "strong" : ""}" data-action="gwUse" data-v="${esc(p.name)}" title="${esc(p.key)}">${esc(p.name)}</button>`).join(" · ")}</span>` : ""}</div>
    <div class="gwenv"><pre class="code">${esc(gatewayEnvText(g))}</pre><button class="b" data-action="gwCopy">${tr("Copier")}</button></div>
    <p class="muted small" style="margin:10px 0 0">${tr("En ligne de commande, sur une passerelle déjà lancée :")} <span class="mono">llm-bench gateway use ${esc(g.profiles[0]?.name || tr("fournisseur/modèle"))}</span></p>
    <form class="launch" data-form="gateway" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border)">
      <label class="field">${tr("Offre")}
        <span class="seg">${[["", tr("Tous")], ["free", tr("Gratuits")], ["paid", tr("Payants")]].map(([v, l]) => `<button type="button" class="${state.tierFilter === v ? "on" : ""}" data-action="tierFilter" data-v="${v}">${l}</button>`).join("")}</span>
      </label>
      <div class="field grow">${tr("Autre modèle")}${modelDropdown("gwModel", gwPicked(g.target), { action: "gwPick" })}</div>
      <button class="b primary" type="submit">${tr("Utiliser ce modèle")}</button>
    </form>
  </section>

  <section class="card" style="padding:0;overflow:hidden">
      <div class="card-h" style="padding:14px 20px;margin:0;border-bottom:1px solid var(--border)">
        <h2>${tr("Appels depuis le démarrage")} <span class="muted" style="font-weight:400">${st.calls}</span></h2>
        <span class="muted small">${st.errors ? `<span class="bad-t">${tr("{n} en erreur", { n: st.errors })}</span> · ` : ""}${st.promptTokens.toLocaleString(LOCALE)} → ${st.completionTokens.toLocaleString(LOCALE)} tokens · ${tr("coût {cost}", { cost: money(st.cost) })}${st.unknownCost ? ` (${tr("+ {n} appel(s) sans prix", { n: st.unknownCost })})` : ""}</span>
      </div>
      ${g.calls.length ? `<div class="table-wrap"><table>
        <thead><tr><th style="padding-left:20px">${tr("Heure")}</th><th>${tr("Appel")}</th><th>${tr("Modèle")}</th><th class="num">HTTP</th><th class="num">${tr("Latence")}</th><th class="num" style="padding-right:20px">${tr("Tokens")}</th></tr></thead>
        <tbody>${g.calls.map((c) => `<tr class="clickable ${c === sel ? "gw-sel" : ""}" data-action="gwCall" data-id="${esc(c.id)}" title="${tr("Cliquer pour afficher le détail")}">
          <td class="mono small" style="padding-left:20px">${new Date(c.at).toLocaleTimeString(LOCALE)}</td>
          <td><span class="chip ${c.error ? "bad" : "accent"}">${esc(callKindLabel(c.kind))}</span>${c.stream ? ' <span class="chip">stream</span>' : ""}</td>
          <td class="mono small">${esc(c.model)}</td><td class="num mono">${c.status}</td><td class="num mono">${fmt.s(c.latencyMs)}</td>
          <td class="num mono small" style="padding-right:20px">${c.promptTokens ? `${c.promptTokens} → ${c.completionTokens ?? "?"}` : "–"}</td></tr>`).join("")}</tbody>
      </table></div>` : `<p class="empty">${tr("Aucun appel pour l'instant.")}</p>`}
  </section>`;
}

const PHASES = {
  copying: ["ph-busy", tr("copie des sources"), true],
  installing: ["ph-busy", tr("installation"), true],
  building: ["ph-busy", tr("build"), true],
  starting: ["ph-busy", tr("démarrage"), true],
  running: ["ph-running", tr("actif"), false],
  stopped: ["ph-stopped", tr("arrêté"), false],
  failed: ["ph-failed", tr("échec"), false],
};
const phaseChip = (p) => { const [cls, label, spin] = PHASES[p] || ["", p, false]; return `<span class="chip ${cls}">${spin ? '<span class="spin"></span> ' : ""}${esc(label)}</span>`; };
const isBusyPhase = (p) => PHASES[p]?.[2];
const kindChip = (k) => `<span class="chip k-${esc(k)}">${esc({ error: tr("erreur") }[k] || k)}</span>`;
const serverName = (id) => state.servers.find((s) => s.id === id)?.name || state.mReport?.servers?.find((s) => s.id === id)?.name || id;

async function loadMStatus() { state.mStatus = state.status?.server || null; }
async function loadServers() { state.servers = await api("/api/server/servers"); }
async function loadMCases() {
  state.mCases = await api("/api/server/cases");
  if (state.mSelCases === null) state.mSelCases = state.mCases.map((c) => c.id);
}
async function loadMReports() { state.mReports = await api("/api/server/reports"); }
async function loadMReport(id) { state.mReport = await api("/api/server/reports/" + id); }
async function loadLog() { if (state.logFor) state.logText = (await api(`/api/server/servers/${state.logFor}/log`)).log; }

async function mcpTick() {
  if (state.menu !== "mcp" && !state.mActive && !state.servers.some((s) => isBusyPhase(s.phase))) return;
  const wasActive = state.mActive;
  state.mActive = await api("/api/server/runs/active");
  if (state.mActive) {
    const rep = await api("/api/server/reports/" + state.mActive.reportId);
    state.mActiveReport = rep;
    if (state.mReportId === state.mActive.reportId) state.mReport = rep;
  }
  if (wasActive && !state.mActive) {
    state.mLastFinished = wasActive.reportId;
    state.mActiveReport = null;
    toast(tr("Campagne serveurs terminée"));
    await loadMReports();
    if (state.mReportId === wasActive.reportId) await loadMReport(state.mReportId);
  }
  const before = new Map(state.servers.map((s) => [s.id, s.phase]));
  await loadServers();
  for (const s of state.servers) {
    const prev = before.get(s.id);
    if (prev && prev !== s.phase && s.phase === "running") toast(tr("{name} est prêt sur le port {port}", { name: s.name, port: s.port }));
    if (prev && prev !== s.phase && s.phase === "failed") toast(`${s.name} : ${s.error || tr("échec")}`, true);
  }
  if (state.logFor) await loadLog();
  await loadDockLog();
}

/** Journal affiché en bas de la page Serveurs. */
async function loadDockLog() {
  if (state.menu !== "mcp" || state.mtab !== "servers") return;
  const s = dockServer();
  if (!s) return;
  const log = (await api(`/api/server/servers/${s.id}/log`).catch(() => ({ log: "" }))).log;
  state.dockFor = s.id;
  state.dockText = log;
}

const ADD_PAID = "__addPaid", ADD_FREE = "__addFree";

/**
 * Choix d'un modèle en liste déroulante ancrée sous le champ (la liste native de macOS s'ouvre
 * par-dessus). Ne propose que les modèles de l'offre filtrée (sauf `allTiers`) ; la valeur est dans
 * l'input caché #id, et `action` reçoit le modèle choisi.
 */
function modelDropdown(id, value, opts = {}) {
  const tf = opts.allTiers ? "" : state.tierFilter;
  const tierLabel = { free: tr("gratuit"), paid: tr("payant") };
  const groups = state.avail.filter((g) => !tf || providerInfo(g.name)?.tier === tf);
  const cur = groups.some((g) => g.models.some((m) => m.key === value)) ? value : "";
  const label = (g) => (providerInfo(g.name)?.label || g.name) + ` · ${tierLabel[providerInfo(g.name)?.tier] || ""}`;
  const placeholder = tf === "free" ? tr("— choisir un modèle gratuit —") : tf === "paid" ? tr("— choisir un modèle payant —") : tr("— choisir —");
  // Aucun modèle utilisable dans une offre : proposer d'en ajouter un (menu Modèles).
  const none = (tier) => opts.offerAdd && (!tf || tf === tier) && !availFlat().some((m) => m.tier === tier);
  const add = [none("free") && [ADD_FREE, tr("↓ Télécharger un modèle gratuit…")], none("paid") && [ADD_PAID, tr("+ Ajouter un modèle payant…")]].filter(Boolean);
  return `<div class="picker" data-picker data-on-pick="${esc(opts.action || "")}">
    <input type="hidden" id="${id}" value="${esc(cur)}">
    <button type="button" class="picker-btn" data-action="pickerToggle"><span class="v ${cur ? "mono" : "muted"}">${esc(cur || placeholder)}</span><span class="muted">▾</span></button>
    <div class="picker-pop" hidden>
      <input type="search" placeholder="${tr("Filtrer…")}" data-action="pickerFilter" autocomplete="off">
      <div class="picker-list">
        ${groups.map((g) => `<div data-group><div class="picker-g">${esc(label(g))}${g.models.length ? "" : ` — ${esc(g.error || tr("aucun modèle"))}`}</div>
          ${g.models.map((m) => `<button type="button" class="picker-o ${m.key === cur ? "on" : ""}" data-action="pickerPick" data-v="${esc(m.key)}">${esc(m.model)}${m.details ? ` <span class="d">· ${esc(m.details)}</span>` : ""}</button>`).join("")}</div>`).join("")}
        ${add.map(([v, l]) => `<button type="button" class="picker-o" data-action="pickerPick" data-v="${v}" data-add>${l}</button>`).join("")}
        ${!groups.some((g) => g.models.length) && !add.length ? `<div class="muted small" style="padding:8px">${tf === "free" ? tr("Aucun modèle gratuit disponible.") : tf === "paid" ? tr("Aucun modèle payant disponible.") : tr("Aucun modèle disponible.")}</div>` : ""}
      </div>
    </div>
  </div>`;
}

/** Relit le formulaire « ajouter un modèle » dans state.provDraft. */
function readProvDraft() {
  const d = state.provDraft;
  const v = (id) => $("#" + id)?.value ?? "";
  Object.assign(d, { name: v("pvName").trim(), label: v("pvLabel"), baseUrl: v("pvBaseUrl").trim(), apiKeyHeader: v("pvHeader"), model: v("pvModel").trim(), input: v("pvIn"), output: v("pvOut") });
  if (!d.useProjectKey) d.apiKey = v("pvApiKey");
  d.existing = Boolean(d.edit) || (state.status?.providers || []).some((p) => p.fromUi && p.name === d.name);
}
