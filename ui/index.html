function sourceLabel(src) {
  if (!src) return "–";
  if (src.kind === "module") return `<span class="mono">${esc(src.module)}</span> → <span class="mono strong">${esc(src.export)}</span>`;
  if (src.kind === "file") return tr("fichier {file}", { file: `<span class="mono">${esc(src.file)}</span>` });
  return `${tr("écrit directement dans {file}", { file: '<span class="mono">bench.config.ts</span>' })}${src.kind === "code" ? ` (${tr("fonction")})` : ""}`;
}

function viewPrompt() {
  const ps = state.promptSrc, cur = state.promptCur;
  if (!ps) return `<section class="card"><p class="empty"><span class="spin"></span> ${tr("Chargement…")}</p></section>`;
  const src = ps.source;
  const choosing = !src || state.promptChanging;
  return `
  ${src ? `<section class="card">
    <div class="card-h"><h2>${tr("Prompt système")}</h2>
      <div class="btns">
        ${cur?.text ? `<button class="b" data-action="promptToggleText">${state.promptShowText ? tr("Masquer le texte") : tr("Afficher le texte")}</button>` : ""}
        <button class="b" data-action="promptChange">${state.promptChanging ? tr("Annuler") : tr("Changer de prompt")}</button>
      </div></div>
    <div class="row" style="gap:6px 20px;align-items:baseline">
      <div><span class="muted small">${tr("Source")}</span><div>${sourceLabel(src)}</div></div>
      <div><span class="muted small">${tr("Version")}</span><div class="mono">${esc(cur?.version || "–")}${src.version ? "" : ` <span class="muted small">${tr("(empreinte du texte)")}</span>`}</div></div>
      <div><span class="muted small">${tr("Longueur")}</span><div>${cur?.text ? tr("{n} caractères", { n: cur.text.length.toLocaleString(LOCALE) }) : "–"}</div></div>
    </div>
    ${cur?.error ? `<div class="banner error small" style="margin-top:10px">${tr("Lecture impossible : {error}", { error: esc(cur.error) })}</div>` : ""}
    ${state.promptShowText && cur?.text ? `<pre style="margin-top:12px;max-height:520px">${esc(cur.text)}</pre>` : ""}
    <p class="muted small" style="margin:10px 0 0">${tr("Relu à chaque campagne : une modification du prompt dans le projet est testée dès la campagne suivante.")}</p>
  </section>` : `<section class="card">
    <div class="card-h"><h2>${tr("Prompt système")}</h2></div>
    <p class="small" style="margin:0">${tr("Le bench prompt envoie directement au modèle le {b} suivi des messages des cas de test, sans lancer le serveur.", { b: `<b>${tr("prompt système du projet")}</b>` })}
      ${tr("Aucun prompt n'est encore configuré : choisir l'un des prompts trouvés dans le projet, ou le définir à la main.")}</p>
  </section>`}
  ${choosing ? viewPromptCandidates() + viewPromptManual() : ""}`;
}

function viewPromptCandidates() {
  const c = state.promptCands;
  const list = Array.isArray(c) ? c : [];
  const best = list.find((x) => x.ok);
  const src = state.promptSrc?.source;
  const isCurrent = (x) => src && ((src.kind === "module" && x.kind === "module" && src.export === x.export && src.module.endsWith(x.file)) || (src.kind === "file" && x.kind === "file" && src.file.endsWith(x.file)));
  return `
  <section class="card">
    <div class="card-h"><h2>${tr("Prompts trouvés dans le projet")} ${list.length ? `<span class="muted">${list.length}</span>` : ""}</h2>
      <button class="b" data-action="promptDetect" ${c === "loading" ? "disabled" : ""}>${c === "loading" ? `<span class="spin"></span> ${tr("Recherche…")}` : tr("Relancer la détection")}</button></div>
    <p class="muted small" style="margin:0 0 10px">${tr("Recherche dans {root} : textes passés comme message système ({ex1}, {ex2}…), exports nommés comme un prompt système, fichiers {md} / {txt} de prompt. Chaque export est exécuté à part pour lire le texte réel.", { root: `<span class="mono">${esc(state.promptSrc?.root || "")}</span>`, ex1: '<span class="mono">new SystemMessage(…)</span>', ex2: '<span class="mono">role: "system"</span>', md: '<span class="mono">.md</span>', txt: '<span class="mono">.txt</span>' })}</p>
    ${c === null || c === "loading" ? `<p class="empty"><span class="spin"></span> ${tr("Recherche des prompts…")}</p>` : !list.length ? `<p class="empty">${tr("Aucun prompt trouvé : le définir ci-dessous.")}</p>` : `<div style="display:grid;gap:10px">${list.map((x) => `
      <div class="editor-item" style="display:grid;gap:6px;${x === best ? "border-color:var(--accent)" : ""}">
        <div class="card-h" style="margin:0">
          <span>${x.kind === "module" ? `<span class="mono strong">${esc(x.export)}</span> <span class="muted small">${tr("dans")}</span> <span class="mono small">${esc(x.file)}${x.line ? ":" + x.line : ""}</span>` : `<span class="mono strong">${esc(x.file)}</span>`}
            ${x === best ? `<span class="chip accent">${tr("recommandé")}</span>` : ""} ${isCurrent(x) ? `<span class="chip ok">${tr("actuel")}</span>` : ""}</span>
          <button class="b ${x === best ? "primary" : ""}" data-action="promptUse" data-id="${esc(x.id)}" ${x.ok && !isCurrent(x) ? "" : "disabled"}>${tr("Utiliser ce prompt")}</button>
        </div>
        <div class="small">${x.ok ? tr("{n} caractères", { n: x.length.toLocaleString(LOCALE) }) : `<span class="bad-t">${esc(x.error || tr("illisible"))}</span>`}${x.version ? ` · ${tr("version")} <span class="mono">${esc(x.version.value)}</span> <span class="muted">(${esc(x.version.export)})</span>` : ""}</div>
        ${x.usages.length ? `<div class="small muted">${tr("Utilisé dans :")} ${x.usages.slice(0, 4).map((u) => `<span class="mono">${esc(u.file)}:${u.line}</span> (${esc(u.how)})`).join(", ")}${x.usages.length > 4 ? ` +${x.usages.length - 4}` : ""}</div>` : `<div class="small muted">${esc(x.reasons.join(" · "))}</div>`}
        ${x.text ? `<details><summary class="small">${tr("Aperçu")}</summary><pre>${esc(x.text.length > 3000 ? x.text.slice(0, 3000) + "\n…" : x.text)}</pre></details>` : ""}
      </div>`).join("")}</div>`}
  </section>`;
}

function viewPromptManual() {
  const m = state.promptManual;
  const t = m.test;
  return `
  <section class="card">
    <div class="card-h"><h2>${tr("Définir le prompt à la main")}</h2></div>
    <div class="seg" style="margin-bottom:12px">${[["module", tr("Export d'un fichier du projet")], ["file", tr("Fichier texte")], ["text", tr("Coller le texte")]].map(([v, l]) => `<button type="button" class="${m.mode === v ? "on" : ""}" data-action="promptMode" data-v="${v}">${l}</button>`).join("")}</div>
    ${m.mode === "module" ? `
      <p class="muted small" style="margin:0 0 8px">${tr("Un fichier du projet qui exporte le prompt : une chaîne, ou une fonction sans paramètre qui le renvoie. Chemin relatif à la racine du projet.")}</p>
      <div class="row">
        <label class="field grow">${tr("Fichier")}<input type="text" id="pmModule" class="mono" data-action="pmField" data-k="module" value="${esc(m.module)}" placeholder="src/llm/prompts/index.ts"></label>
        <label class="field">${tr("Export")}<input type="text" id="pmExport" class="mono" data-action="pmField" data-k="export" value="${esc(m.export)}" placeholder="SYSTEM_PROMPT"></label>
      </div>` : m.mode === "file" ? `
      <p class="muted small" style="margin:0 0 8px">${tr("Un fichier {md} ou {txt} du projet qui contient le prompt tel quel. Chemin relatif à la racine du projet.", { md: '<span class="mono">.md</span>', txt: '<span class="mono">.txt</span>' })}</p>
      <label class="field">${tr("Fichier")}<input type="text" id="pmFile" class="mono" data-action="pmField" data-k="file" value="${esc(m.file)}" placeholder="prompts/system.md"></label>` : `
      <p class="muted small" style="margin:0 0 8px">${tr("Le texte est enregistré dans {file}, à côté de la config. À utiliser si le prompt n'existe pas sous forme lisible dans le projet.", { file: '<span class="mono">system-prompt.md</span>' })}</p>
      <label class="field">${tr("Prompt système")}<textarea id="pmText" rows="10" data-action="pmField" data-k="text" placeholder="${tr("Tu es un assistant…")}">${esc(m.text)}</textarea></label>`}
    ${t ? `<div class="small" style="margin-top:10px">${t.ok ? `<span class="chip ok">${tr("lisible")} ✓</span> ${tr("{n} caractères", { n: t.length.toLocaleString(LOCALE) })}<details><summary class="small">${tr("Aperçu")}</summary><pre>${esc(t.text.slice(0, 3000))}</pre></details>` : `<span class="bad-t">${esc(t.error)}</span>`}</div>` : ""}
    <div class="btns" style="margin-top:12px">
      ${m.mode !== "text" ? `<button class="b" data-action="promptTest">${tr("Tester")}</button>` : ""}
      <button class="b primary" data-action="promptSaveManual">${tr("Enregistrer")}</button>
      <span class="muted small" style="margin-left:auto">${tr("Enregistré dans la section {section} de {file}", { section: '<span class="mono">prompt</span>', file: `<span class="mono">${esc(state.promptSrc?.configFile || "bench.config.ts")}</span>` })}</span>
    </div>
  </section>`;
}

const ENV_ROLES = [
  { role: "baseUrl", title: tr("Endpoint du LLM"), required: true,
    what: tr("URL de l'API compatible OpenAI que le projet appelle."),
    value: (i) => `<span class="mono">${esc(i.proxyBase)}</span><div class="muted small">${tr("proxy du bench : il enregistre chaque appel et le relaie au fournisseur du modèle choisi")}</div>` },
  { role: "apiKey", title: tr("Clé API"), required: false,
    what: tr("Clé envoyée au fournisseur. Laisser vide si le projet n'en lit pas."),
    value: () => `${tr("clé du fournisseur choisi")}<div class="muted small">${tr("« ollama » pour un modèle local")}</div>` },
  { role: "model", title: tr("Modèle"), required: true,
    what: tr("Nom du modèle passé dans chaque requête."),
    value: () => `<span class="mono">gpt-4.1-mini</span>, <span class="mono">qwen2.5:7b</span>…<div class="muted small">${tr("le modèle choisi à la création du serveur")}</div>` },
  { role: "port", title: tr("Port HTTP"), required: true,
    what: tr("Port d'écoute du serveur du projet."),
    value: (i) => `<span class="mono">${i.firstPort}</span>, <span class="mono">${i.firstPort + 1}</span>…<div class="muted small">${tr("un port libre par serveur")}</div>` },
];

async function loadEnv() {
  state.envInfo = await api("/api/server/env");
  state.envDraft = { ...state.envInfo.names };
}

function viewEnv() {
  const i = state.envInfo, d = state.envDraft;
  if (!i || !d) return `<section class="card"><p class="empty"><span class="spin"></span> ${tr("Chargement…")}</p></section>`;
  const changed = ENV_ROLES.some(({ role }) => (d[role] || "") !== (i.names[role] || ""));
  const isDefault = ENV_ROLES.every(({ role }) => (d[role] || "") === i.defaults[role]);
  const known = [...new Set([...i.inEnvFiles, ...i.inCode])].sort();
  const found = (n) => {
    if (!n) return `<span class="muted small">${tr("non utilisée")}</span>`;
    const f = i.inEnvFiles.includes(n), c = i.inCode.includes(n);
    if (f || c) return `${f ? `<span class="chip ok">${esc(i.envFile)} ✓</span>` : ""} ${c ? `<span class="chip ok">${tr("lue par le code")} ✓</span>` : ""}`;
    return `<span class="chip warn" title="${tr("Ni dans les fichiers d'environnement, ni dans le code (src, app, lib, server)")}">${tr("introuvable dans le projet")}</span>`;
  };
  const v = (r) => d[r] || i.defaults[r];
  return `
  <section class="card">
    <div class="card-h"><h2>${tr("Variables d'environnement du serveur")}</h2>${changed ? `<span class="chip warn">${tr("modifications non enregistrées")}</span>` : ""}</div>
    <p class="small" style="margin:0 0 12px">${tr("Pour chaque serveur, le bench copie le projet, écrit ces variables dans le {file} de la copie, puis le lance.", { file: `<span class="mono">${esc(i.envFile)}</span>` })}
      ${tr("Indiquer ici {b} : c'est par eux que le serveur reçoit le modèle choisi.", { b: `<b>${tr("les noms que le code du projet lit")}</b>` })}</p>
    <datalist id="envNames">${known.map((n) => `<option value="${esc(n)}">`).join("")}</datalist>
    <div class="table-wrap"><table>
      <thead><tr><th>${tr("Rôle")}</th><th>${tr("Nom de la variable")}</th><th>${tr("Dans le projet")}</th><th>${tr("Valeur écrite par le bench")}</th></tr></thead>
      <tbody>${ENV_ROLES.map((r) => `<tr>
        <td><div class="strong">${r.title}${r.required ? "" : ` <span class="muted small">${tr("(facultatif)")}</span>`}</div><div class="muted small">${r.what}</div></td>
        <td><input type="text" id="env-${r.role}" class="mono" data-action="envName" data-role="${r.role}" value="${esc(d[r.role] || "")}" list="envNames" placeholder="${r.required ? esc(i.defaults[r.role]) : tr("aucune")}" autocomplete="off" spellcheck="false" style="width:210px"></td>
        <td>${found(d[r.role])}</td>
        <td class="small">${r.value(i)}</td>
      </tr>`).join("")}</tbody>
    </table></div>
    <div class="btns" style="margin-top:14px">
      <button class="b primary" data-action="saveEnv" ${changed && !state.savingEnv ? "" : "disabled"}>${state.savingEnv ? '<span class="spin"></span> ' : ""}${tr("Enregistrer")}</button>
      <button class="b" data-action="resetEnv" ${changed ? "" : "disabled"}>${tr("Annuler les modifications")}</button>
      <button class="b" data-action="defaultEnv" ${isDefault ? "disabled" : ""} title="${esc(Object.values(i.defaults).join(", "))}">${tr("Valeurs par défaut")}</button>
      <span class="muted small" style="margin-left:auto">${tr("Enregistré dans {file}", { file: `<span class="mono">${esc(i.configFile)}</span>` })} (<span class="mono">server.env</span>)</span>
    </div>
  </section>

  <section class="card">
    <div class="card-h"><h2>${tr("Guide")}</h2></div>
    <div class="section">
      <h3>${tr("Ce que fait le bench")}</h3>
      <ol class="small" style="margin:0;padding-left:20px;display:grid;gap:4px">
        <li>${tr("Il copie le projet dans {dir}, avec le {file} du projet.", { dir: `<span class="mono">${esc(state.mStatus?.instancesDir || "")}/&lt;${tr("serveur")}&gt;</span>`, file: `<span class="mono">${esc(i.envFile)}</span>` })}</li>
        <li>${tr("Dans ce {file}, il remplace {vars} par les valeurs du modèle choisi. Les autres variables ne changent pas.", { file: `<span class="mono">${esc(i.envFile)}</span>`, vars: `<span class="mono">${ENV_ROLES.map((r) => d[r.role]).filter(Boolean).map(esc).join("</span>, <span class=\"mono\">")}</span>` })}</li>
        <li>${tr("Il lance le serveur, qui appelle le LLM via le proxy du bench : chaque appel est enregistré (prompt, réponse, tokens, coût).")}</li>
      </ol>
    </div>
    <div class="section" style="margin-top:14px">
      <h3>${tr("Ce que le code du projet doit faire")}</h3>
      <p class="small" style="margin:0">${tr("Lire ces variables au lieu de valeurs en dur. Par exemple, avec le SDK OpenAI en Node :")}</p>
      <pre>const client = new OpenAI({
  baseURL: process.env.${esc(v("baseUrl"))},${d.apiKey ? `
  apiKey: process.env.${esc(d.apiKey)},` : ""}
});
const res = await client.chat.completions.create({ model: process.env.${esc(v("model"))}, messages });

app.listen(Number(process.env.${esc(v("port"))}));</pre>
    </div>
    <div class="section" style="margin-top:14px">
      <h3>${tr("Quand modifier ces noms")}</h3>
      <ul class="small" style="margin:0;padding-left:20px;display:grid;gap:4px">
        <li>${tr("Le projet utilise d'autres noms, par exemple {a} ou {b} : les saisir ici. La liste propose les variables trouvées dans le projet.", { a: '<span class="mono">OPENAI_BASE_URL</span>', b: '<span class="mono">AZURE_OPENAI_ENDPOINT</span>' })}</li>
        <li>${tr("Un nom marqué {chip} : le serveur ne le lira pas et utilisera sa propre configuration. Le bench ne pourra alors ni changer de modèle ni enregistrer les appels.", { chip: `<span class="chip warn">${tr("introuvable dans le projet")}</span>` })}</li>
        <li>${tr("Le projet ne lit pas de clé (modèle local uniquement) : laisser la clé vide.")}</li>
        <li>${tr("L'endpoint est codé en dur dans le projet : il faut d'abord le rendre configurable par une variable.")}</li>
      </ul>
    </div>
    <div class="section" style="margin-top:14px">
      <h3>${tr("Après un changement")}</h3>
      <ul class="small" style="margin:0;padding-left:20px;display:grid;gap:4px">
        <li>${tr("Il s'applique tout de suite aux {b}, sans redémarrer le bench.", { b: `<b>${tr("nouveaux serveurs")}</b>` })}</li>
        <li>${tr("Les {b} gardent les anciens noms dans leur {file} : les recréer, ou utiliser « changer de modèle » (✎ dans la liste des serveurs) pour réécrire leurs variables.", { b: `<b>${tr("serveurs existants")}</b>`, file: `<span class="mono">${esc(i.envFile)}</span>` })}</li>
        <li>${tr("Le bloc {block} de la config est réécrit. Le reste du fichier ne change pas.", { block: '<span class="mono">server.env</span>' })}</li>
      </ul>
    </div>
  </section>`;
}

function viewServers() {

  const steps = [

  <section class="card">

        <span class="seg" role="group" aria-label="${tr("Offre")}">${[["", tr("Tous")], ["free", tr("Gratuits")], ["paid", tr("Payants")]].map(([v, l]) => `<button type="button" class="${state.tierFilter === v ? "on" : ""}" data-action="tierFilter" data-v="${v}" aria-pressed="${state.tierFilter === v}">${l}</button>`).join("")}</span>

      ${(ms.shareDirs || []).length ? `<label class="small" title="${tr("Lien symbolique vers {dirs} du projet : pas d'installation, création en quelques secondes. Décocher pour un serveur totalement isolé.", { dirs: esc(ms.shareDirs.join(", ")) })}"><input type="checkbox" data-action="nsLink" ${n.linkModules ? "checked" : ""}> ${tr("Partager {dirs} (rapide)", { dirs: esc(ms.shareDirs.join(", ")) })}</label>` : ""}
      <button class="b primary" type="submit" ${canCreate ? "" : "disabled"}>${state.creating ? '<span class="spin"></span> ' : ""}${tr("Créer et démarrer")}</button>
      </div>

      ${tr("Le serveur appelle son modèle via le bench ({var} = proxy d'enregistrement).", { var: `<span class="mono">${esc(ms.env?.baseUrl || "")}</span>` })}</p>

/** Serveur dont le journal est affiché en bas (choisi en cliquant sa ligne), ou null : journal masqué. */
function dockServer() {
  return state.servers.find((s) => s.id === state.dockLog) || null;
}

/** Ligne de journal colorée : lignes du bench en gris, erreurs en rouge, avertissements en orange. */
function logLine(line) {
  const t = esc(line);
  if (/^\[bench [^\]]*\]/.test(line)) {
    const m = t.match(/^(\[bench [^\]]*\])(.*)$/);
    const warn = /ATTENTION|WARNING|ÉCHEC|FAILED/i.test(line);
    return `<span class="lg-b">${m[1]}</span><span class="${warn ? "lg-w" : ""}">${m[2]}</span>`;
  }
  if (/\b(Error|TypeError|ReferenceError|Exception|ERR!|ECONNREFUSED|failed)\b|^\s+at /.test(line)) return `<span class="lg-e">${t}</span>`;
  if (/\bWARN/.test(line)) return `<span class="lg-w">${t}</span>`;
  return t;
}

function dockLog() {
  const s = dockServer();
  if (!s) return "";
  const text = state.dockFor === s.id ? state.dockText : "";
  const lines = String(text || "").split("\n").slice(-300);
  const state_ = s.phase === "failed" ? `<span class="lg-e strong">${tr("échec")}${s.error ? " · " + esc(s.error) : ""}</span>` : phaseChip(s.phase);
  return `
  <section class="logdock" aria-labelledby="dockTitle">
    <div class="logdock-h">
      <h2 id="dockTitle">${tr("Journal")} · <span class="mono">${esc(s.name)}</span></h2>
      <span class="small">${state_}</span>
      <div class="btns" style="margin-left:auto">
        ${state.servers.length > 1 ? `<select data-action="dockPick" aria-label="${tr("Serveur du journal")}">${state.servers.map((x) => `<option value="${esc(x.id)}" ${x.id === s.id ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select>` : ""}
        <button type="button" class="b" data-action="openLog" data-id="${esc(s.id)}">${tr("Ouvrir dans une fenêtre")}</button>
        <button type="button" class="b" data-action="toggleDock" data-id="${esc(s.id)}" aria-label="${tr("Masquer le journal")}" title="${tr("Masquer le journal")}">✕</button>
      </div>
    </div>
    <pre id="dockPre">${text ? lines.map(logLine).join("\n") : `<span class="lg-b">${tr("(vide)")}</span>`}</pre>
  </section>`;
}

function modalLog() {
  const s = state.servers.find((x) => x.id === state.logFor);

function llmCallsBlock(calls) {
  return `<div class="trace llm">
    <div class="trace-h"><span class="ico">✦</span><div><div class="t">${tr("Appels LLM du serveur ({n})", { n: calls.length })}</div><div class="sub">${tr("Requêtes faites par le serveur au modèle pendant cette étape")}</div></div></div>
    ${calls.length ? "" : `<div class="muted small">${tr("Aucun appel LLM enregistré pour cette étape.")}</div>`}
    ${calls.map((c, i) => {
      const msgs = c.request?.messages || [];
      return `<details ${c.error ? "open" : ""}>
        <summary class="small"><span class="chip ${c.error ? "bad" : "accent"}">${esc(callKindLabel(c.kind))}</span> <span class="mono">${esc(c.model || "")}</span>
          · ${fmt.s(c.latencyMs)} · HTTP ${c.status}${c.promptTokens ? ` · ${c.promptTokens} → ${c.completionTokens ?? "?"} tokens` : ""}${c.finishReason ? ` · ${esc(c.finishReason)}` : ""}${c.stream ? " · stream" : ""}${c.cost ? ` · ${money(c.cost)}` : ""}</summary>
        <div style="display:grid;gap:8px;margin-top:8px">
          ${c.error ? `<div class="bad-t small mono">${esc(c.error)}</div>` : ""}
          <div class="small muted">${tr("Messages envoyés au modèle")}</div>
          ${msgs.map((m) => {
            const content = typeof m.content === "string" ? m.content : JSON.stringify(m.content);
            const ref = content.match(/^<<prompt:([0-9a-f]+)>>$/);
            return `<pre><b>${esc(m.role)}</b> ${ref ? `<button class="link small" data-action="showMPrompt" data-h="${ref[1]}">${tr("prompt système ({n} caractères) — afficher", { n: (state.mReport?.prompts?.[ref[1]] || "").length.toLocaleString(LOCALE) })}</button>` : esc(content)}</pre>`;
          }).join("")}
          <div class="small muted">${tr("Réponse du modèle")}</div>
          <pre>${esc(c.content != null ? prettyJson(c.content) : typeof c.response === "string" ? c.response : tr("(vide)"))}</pre>
          ${c.http ? httpExchange(c) : `<details><summary class="small">${tr("Requête HTTP complète")} (${esc(c.path)})</summary>${jsonPre({ ...c.request, messages: undefined })}</details>
          <details><summary class="small">${tr("Réponse HTTP complète")}</summary>${jsonPre(c.response)}</details>`}
        </div>
      </details>`;
    }).join("")}
  </div>`;
}

function freshMCheck(type) { return freshCheck(type, state.mStatus?.checkTypes); }

function freshCheck(type, types) {
  const t = (types || []).find((x) => x.type === type);
  const c = { type };
  (t?.fields || []).forEach((f) => { c[f.name] = f.kind === "select" ? f.options[0] : f.kind === "tuples" ? [] : f.kind === "boolean" ? false : ""; });
  return c;
}

async function mReplayOne(id, quiet = false) {
  const reportId = state.mReport.id;
  state.mReplaying.add(id); render(); renderLayer();
  try {
    const fresh = await api(`/api/server/reports/${reportId}/replay`, { method: "POST", body: { resultId: id } });
    if (!quiet) toast(fresh.status === "pass" ? tr("Rejeu : réussi ✓") : tr("Rejeu : toujours en échec"));
    return fresh;
  } catch (e) {
    toast(e.message, true);
  } finally {
    state.mReplaying.delete(id);
    if (state.mReportId === reportId) await guard(() => loadMReport(reportId));
    render(); renderLayer();
  }
}

function gwPicked(target) {

const GW_ACTIONS = {
  gwPick(el) {
    const picks = state.gwPicks ||= {};

    const tier = tierOfKey(el.value);
    if (tier) picks[tier] = el.value;
  },
  async gwUse(el) { await gwSet(el.dataset.v); },
  pickerToggle(el) {
    const pop = el.nextElementSibling;
    document.querySelectorAll(".picker-pop:not([hidden])").forEach((p) => { if (p !== pop) p.hidden = true; });
    pop.hidden = !pop.hidden;
    if (pop.hidden) return;
    placePop(el, pop, 280);
    const q = pop.querySelector("input"); q.value = ""; actions.pickerFilter(q); q.focus();
    pop.querySelector(".picker-o.on")?.scrollIntoView({ block: "nearest" });
  },
  pickerFilter(el) {
    const q = el.value.trim().toLowerCase();
    el.closest(".picker-pop").querySelectorAll("[data-group]").forEach((g) => {
      let any = false;
      g.querySelectorAll(".picker-o").forEach((o) => { const ok = !q || o.dataset.v.toLowerCase().includes(q); o.hidden = !ok; any ||= ok; });
      g.hidden = !any && Boolean(q);
    });
  },
  pickerPick(el) {
    const picker = el.closest("[data-picker]");
    picker.querySelector(".picker-pop").hidden = true;
    const onPick = picker.dataset.onPick;
    if (el.hasAttribute("data-add")) return actions[onPick]?.({ value: el.dataset.v });
    picker.querySelector("input[type=hidden]").value = el.dataset.v;
    const v = picker.querySelector(".picker-btn .v");
    v.textContent = el.dataset.v; v.className = "v mono";
    picker.querySelectorAll(".picker-o.on").forEach((o) => o.classList.remove("on"));
    el.classList.add("on");
    actions[onPick]?.({ value: el.dataset.v });
  },
  revealKey(el) {
    const k = el.previousElementSibling;
    const shown = el.textContent === tr("masquer");
    if (!shown) { k.dataset.masked = k.textContent; k.textContent = k.dataset.key; } else k.textContent = k.dataset.masked;
    el.textContent = shown ? tr("afficher") : tr("masquer");
  },
  async gwCopy() {
    try { await navigator.clipboard.writeText(gatewayEnvText(state.gw)); toast(tr("Copié")); } catch { toast(tr("Copie impossible : sélectionnez le texte"), true); }
  },
  gwCall(el) {
    // Par identifiant : la liste est rafraîchie en continu, un index pourrait désigner un autre appel.
    const c = state.gw.calls.find((x) => x.id === el.dataset.id);
    if (!c) return toast(tr("Appel introuvable (sorti de l'historique)"), true);
    const prompts = state.gw.prompts || {};
    const all = c.request?.messages || [];
    // Les clients de chat renvoient toute la conversation à chaque appel : ce qui précède le dernier
    // message utilisateur est de l'historique, pas une trace d'un autre appel.
    const lastUser = all.findLastIndex((m) => m.role === "user");
    const text = (m) => {
      const content = typeof m.content === "string" ? m.content : JSON.stringify(m.content);
      const ref = content.match(/^<<prompt:([0-9a-f]+)>>$/);
      return ref ? prompts[ref[1]] || content : content;
    };
    const msg = (m) => ["system", "developer"].includes(m.role)
      ? `<details><summary class="small">${tr("Prompt système ({chars} caractères)", { chars: text(m).length.toLocaleString(LOCALE) })}</summary><pre>${esc(text(m))}</pre></details>`
      : `<pre><b>${esc(m.role)}</b> ${esc(text(m))}</pre>`;
    const system = all.filter((m, i) => i < lastUser && ["system", "developer"].includes(m.role));
    const history = all.filter((m, i) => i < lastUser && !["system", "developer"].includes(m.role));
    const current = lastUser < 0 ? all : all.slice(lastUser);
    const msgs = system.map(msg).join("")
      + (history.length ? `<details><summary class="small">${tr("Historique de conversation renvoyé par votre serveur dans cette requête ({n} message(s))", { n: history.length })}</summary><div style="display:grid;gap:8px;margin-top:8px">${history.map(msg).join("")}</div></details>` : "")
      + current.map(msg).join("");
    state.gwSel = c.id;
    state.modal = `<div class="overlay center" data-action="closeModal"><div class="panel" data-stop style="width:min(1000px,100%)">
      <div class="panel-h"><div><h2>${esc(callKindLabel(c.kind))} · <span class="mono">${esc(c.model)}</span></h2><div class="muted small">${fmt.date(c.at)} · HTTP ${c.status} · ${fmt.s(c.latencyMs)}${c.promptTokens ? ` · ${c.promptTokens} → ${c.completionTokens ?? "?"} tokens` : ""}</div></div><button class="icon" data-action="closeModal">✕</button></div>
      <div class="section"><h3>${tr("Appel HTTP")}</h3><div class="gwdetail">${gatewayCallDetail(c)}</div></div>
      <div class="section"><h3>${tr("Messages envoyés")}</h3>${msgs || '<p class="muted small">–</p>'}</div>
      <div class="section"><h3>${tr("Réponse")}</h3>${jsonPre(c.content ?? c.response)}</div>
    </div></div>`;
    render(); renderLayer();
  },
};

      await api(`/api/providers/${encodeURIComponent(name)}/models/${encodeURIComponent(model)}`, { method: "DELETE" });
      await loadStatus(); await loadAvail();
      if (state.newServer.model === `${name}/${model}`) { state.newServer.model = ""; store.set("newServer", state.newServer); }
      toast(tr("{name} supprimé", { name: `${name}/${model}` }));
    });
    render();
  },
  provImport() {
    readProvDraft();
    const d = state.provDraft, pe = state.projectEnv;
    if (pe.baseUrl) d.baseUrl = pe.baseUrl;
    if (pe.model) d.model = pe.model;
    if (pe.hasKey) d.useProjectKey = true;
    if (!d.name && /azure\.com/.test(pe.baseUrl || "")) { d.name = "azure"; d.label ||= "Azure"; }
    renderLayer();
  },
  provTypeKey() { readProvDraft(); state.provDraft.useProjectKey = false; renderLayer(); },
  async saveProvider() {
    readProvDraft();
    const d = state.provDraft;
    state.savingProvider = true; renderLayer();
    await guard(async () => {
      const { key } = await api("/api/providers", { method: "POST", body: {
        name: d.name, label: d.label, baseUrl: d.baseUrl, apiKeyHeader: d.apiKeyHeader, tier: "paid", model: d.model, originalModel: d.edit?.model,
        apiKey: d.useProjectKey ? undefined : d.apiKey, useProjectKey: d.useProjectKey,
        input: d.input === "" ? null : Number(d.input), output: d.output === "" ? null : Number(d.output),

      await loadStatus(); await loadAvail();
            if (d.edit && state.newServer.model === `${d.edit.name}/${d.edit.model}`) state.newServer.model = key;

  nsLink(el) { state.newServer.linkModules = el.checked; store.set("newServer", state.newServer); },
  async createServer() {
    const n = state.newServer;

    await guard(async () => {
      const s = await api("/api/server/servers", { method: "POST", body: {
        model: n.model, name: n.name, linkModules: n.linkModules,
      } });
      n.name = "";
      state.selServers.add(s.id); store.set("selServers", [...state.selServers]);
      await loadServers();
      toast(n.linkModules ? tr("{name} : création sur le port {port}", { name: s.name, port: s.port }) : tr("{name} : création sur le port {port} (l'installation peut prendre quelques minutes)", { name: s.name, port: s.port }));
    });
    state.creating = false; render();
  },
  async refreshServers() { await guard(loadServers); render(); },
  async serverOp(el) {
    const op = el.dataset.op;
    const id = el.dataset.id;
    const label = { start: tr("Démarrage"), stop: tr("Arrêt"), refresh: tr("Mise à jour du code"), reinstall: tr("Réinstallation") }[op];
    if (op === "reinstall" && !confirm(tr("Réinstaller les dépendances de ce serveur ?"))) return;
    el.disabled = true;
    if (op === "start") { const s = state.servers.find((x) => x.id === id); if (s) s.phase = "starting"; render(); }
    await guard(async () => {
      await api(`/api/server/servers/${id}/${op}`, { method: "POST" });
      toast(`${label} : ${serverName(id)}`);
    });
    await guard(loadServers); render();
  },
  async serverInfo(el) {
    let d;
    await guard(async () => { d = await api(`/api/server/servers/${el.dataset.id}/details`); });
    if (!d) return;
    const c = (v, tip = tr("Cliquer pour copier")) => (v ? `<span class="mono copy" data-action="copyText" data-text="${esc(v)}" title="${esc(tip)}">${esc(v)}</span>` : '<span class="muted">–</span>');

    const ROLES = { baseUrl: tr("Endpoint LLM"), apiKey: tr("Clé API"), model: tr("Modèle"), port: tr("Port") };
    state.modal = `<div class="overlay center" data-action="closeModal"><div class="panel" data-stop>
      <div class="panel-h"><div><h2>${esc(d.name)}</h2><div class="muted small"><span class="mono">${esc(d.id)}</span> · ${phaseChip(d.phase)}${d.pid ? ` · PID <span class="mono">${d.pid}</span>` : ""}</div></div><button class="icon" data-action="closeModal">✕</button></div>
      ${d.error ? `<div class="banner fail small mono">${esc(d.error)}</div>` : ""}

      <div class="section"><h3>${tr("Modèle")}</h3><table class="info">
        ${row(tr("Modèle"), `${c(d.model)} ${providerChip(d.provider.name)}`)}
        ${row(tr("Endpoint réel du fournisseur"), c(d.provider.baseUrl), tr("où le bench relaie les appels, en ajoutant la clé API"))}
        ${row(tr("Proxy LLM du bench"), c(d.proxyUrl), tr("URL que le serveur appelle réellement : chaque requête y est enregistrée puis relayée"))}
      </table></div>

      <div class="section"><h3>${tr("Variables d'environnement")}</h3><table class="info">
        <tr><th>${tr("Variable")}</th><td><div class="row" style="justify-content:space-between"><span class="muted small">${tr("dans le fichier {file}", { file: esc(d.envFile.split("/").pop()) })}</span><span class="muted small">${tr("reçue au démarrage")}</span></div></td></tr>
        ${d.vars.map((v) => row(`<span class="mono">${esc(v.name)}</span><div class="small" style="font-weight:400">${ROLES[v.role] || v.role}</div>`,
          `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div>${c(v.file)}</div><div>${v.atStart !== v.file ? `<b>${c(v.atStart)}</b>` : c(v.atStart)}</div></div>`)).join("")}
      </table>
      <p class="muted small" style="margin:0">${tr("Au démarrage, le bench passe ces variables dans l'environnement du processus ; elles priment sur le fichier (dotenv ne les écrase pas). En gras : valeur différente du fichier. Le fichier garde le vrai endpoint pour que la copie reste utilisable seule. Clé API masquée.")}</p></div>

      <div class="section"><h3>${tr("Accès")}</h3><table class="info">
        ${row(tr("Serveur"), live ? `<a href="${esc(d.appUrl)}" target="_blank" rel="noopener" class="mono">${esc(d.appUrl)}</a>` : c(d.appUrl))}
        ${row(tr("Santé"), c(d.healthUrl), tr("prêt quand cette URL répond 2xx"))}
        ${row(tr("Route de chat testée"), c(d.chat))}
        ${row(tr("Appels LLM hors campagne"), `${d.pendingCalls}${d.lastCallAt ? ` <span class="muted small">· ${tr("dernier {date}", { date: fmt.date(d.lastCallAt) })}</span>` : ""}`, tr("enregistrés par le proxy depuis la dernière campagne"))}
      </table></div>

      <div class="section"><h3>${tr("Fichiers")}</h3><table class="info">
        ${row(tr("Dossier du serveur"), c(d.dir), tr("copie du projet"))}
        ${row(tr("Source copiée"), `${c(d.source)}${d.sourceCommit ? ` <span class="muted small">· ${tr("commit")} <span class="mono">${esc(d.sourceCommit)}</span></span>` : ""}`)}
        ${row(tr("Fichier d'environnement"), c(d.envFile))}
        ${row(tr("Journal"), c(d.logFile))}
        ${row(tr("Métadonnées"), c(d.metaFile))}
        ${d.shareDirs.length ? row(tr("Dossiers partagés"), d.shareDirs.map((x) => c(x)).join(" "), tr("liens symboliques vers ceux du projet")) : ""}
      </table></div>

      <div class="section"><h3>${tr("Commandes")}</h3><table class="info">
        ${row(tr("Installation"), d.commands.install.length ? d.commands.install.map((x) => c(x)).join("<br>") : `<span class="muted">${d.linkedModules ? tr("aucune (dépendances partagées)") : tr("aucune")}</span>`)}
        ${row(tr("Build"), d.commands.build.length ? d.commands.build.map((x) => c(x)).join("<br>") : `<span class="muted">${tr("aucun")}</span>`)}
        ${row(tr("Démarrage"), c(d.commands.start))}
      </table></div>

      <div class="section"><h3>${tr("Dates")}</h3><table class="info">
        ${row(tr("Créé le"), fmt.date(d.createdAt))}
        ${row(tr("Code copié le"), fmt.date(d.updatedAt))}
      </table></div>
    </div></div>`;
    renderLayer();
  },
  async copyText(el) {
    try { await navigator.clipboard.writeText(el.dataset.text); toast(tr("Copié")); } catch { toast(tr("Copie impossible"), true); }
  },
  async toggleDock(el) {
    // Même serveur : masquer ; autre serveur : basculer sur son journal.
    if (state.dockLog === el.dataset.id) { state.dockLog = null; render(); return; }
    state.dockLog = el.dataset.id; state.dockText = ""; state.dockFor = null; state.dockStick = true;
    render(); await guard(loadDockLog); render();
    $(".content .logdock")?.scrollIntoView({ behavior: "smooth", block: "nearest" });
  },
  async dockPick(el) { state.dockLog = el.value; state.dockText = ""; state.dockFor = null; render(); await guard(loadDockLog); render(); },
  async openLog(el) { state.logFor = el.dataset.id; state.logText = ""; renderLayer(); await guard(loadLog); renderLayer(); const pre = $("#logPre"); if (pre) pre.scrollTop = pre.scrollHeight; },
  async deleteServer(el) {
    if (!confirm(tr("Arrêter et supprimer « {name} » et son dossier ?", { name: serverName(el.dataset.id) }))) return;
    await guard(async () => {
      await api("/api/server/servers/" + el.dataset.id, { method: "DELETE" });
      state.selServers.delete(el.dataset.id); store.set("selServers", [...state.selServers]);
      await loadServers(); render(); toast(tr("Serveur supprimé"));
    });
  },

  // Lancer
  selServers(el) {
    state.selServers = new Set(el.dataset.v === "all" ? state.servers.filter((s) => s.phase === "running").map((s) => s.id) : []);
    store.set("selServers", [...state.selServers]); render();
  },
  toggleServer(el) {
    el.checked ? state.selServers.add(el.dataset.id) : state.selServers.delete(el.dataset.id);
    store.set("selServers", [...state.selServers]); render();
  },
  mSelCases(el) {
    const visible = filteredMCases().map((c) => c.id);
    const sel = new Set(state.mSelCases);
    if (el.dataset.v === "all") visible.forEach((id) => sel.add(id));
    if (el.dataset.v === "none") visible.forEach((id) => sel.delete(id));
    if (el.dataset.v === "invert") visible.forEach((id) => (sel.has(id) ? sel.delete(id) : sel.add(id)));
    state.mSelCases = [...sel]; store.set("mSelCases", state.mSelCases); render();
  },
  toggleMCase(el) {
    const sel = new Set(state.mSelCases);
    el.checked ? sel.add(el.dataset.id) : sel.delete(el.dataset.id);
    state.mSelCases = [...sel]; store.set("mSelCases", state.mSelCases); render();
  },
  mCaseSearch(el) { state.mFilter.q = el.value; render(); },
  mCaseCat(el) { state.mFilter.category = el.value; render(); },
  mRunName(el) { state.mRunName = el.value; },
  mParallelInput(el) { state.mParallel = Math.min(16, Math.max(1, Number(el.value) || 1)); store.set("mParallel", state.mParallel); render(); },
  mRunsInput(el) { state.mRuns = Math.min(10, Math.max(1, Number(el.value) || 1)); render(); },
  async mLaunch() {
    await guard(async () => {
      const serverIds = state.servers.filter((s) => s.phase === "running" && state.selServers.has(s.id)).map((s) => s.id);
      const caseIds = state.mCases.filter((c) => state.mSelCases.includes(c.id)).map((c) => c.id);
      const { reportId } = await api("/api/server/runs", { method: "POST", body: { serverIds, caseIds, runs: state.mRuns, name: state.mRunName, parallel: state.mParallel } });
      state.mActive = { reportId, done: 0, total: serverIds.length * caseIds.length * state.mRuns, current: serverIds[0] };
      state.mLastFinished = null;
      toast(tr("Campagne serveurs lancée"));
      render();
    });
  },
  async mStopRun() { await guard(() => api("/api/server/runs/stop", { method: "POST" })); toast(tr("Arrêt demandé")); },

  // Rapports
  async openMReport(el) {
    state.mReportId = el.dataset.id; store.set("mReportId", state.mReportId);
    state.menu = "mcp"; state.mtab = "reports"; store.set("menu", "mcp"); store.set("mtab", "reports");
    state.mResultId = null; state.mOnlyFailures = false; state.mHeatFilter = { cat: null, status: "" };
    await guard(() => loadMReport(state.mReportId));
    render(); renderLayer();
  },
  async closeMReport() {
    state.mReportId = null; state.mReport = null; store.set("mReportId", null);
    await guard(loadMReports); render();
  },
  async deleteMReport(el) {
    if (!confirm(tr("Supprimer ce rapport ?"))) return;
    await guard(async () => {
      await api("/api/server/reports/" + el.dataset.id, { method: "DELETE" });
      if (state.mReportId === el.dataset.id) { state.mReportId = null; state.mReport = null; store.set("mReportId", null); }
      await loadMReports(); render(); toast(tr("Rapport supprimé"));
    });
  },
  mOnlyFailures(el) { state.mOnlyFailures = el.checked; render(); },
  mHeatCat(el) { state.mHeatFilter.cat = el.value === "*" ? null : el.value; render(); },
  mHeatStatus(el) { state.mHeatFilter.status = el.dataset.v; render(); },
  openMResult(el) { state.mResultId = el.dataset.id; render(); renderLayer(); },
  async mReplay(el) { await mReplayOne(el.dataset.id); },
  async mReplayFailures() {
    const ids = state.mReport.results.filter((x) => x.status !== "pass").map((x) => x.id);
    ids.forEach((id) => state.mReplaying.add(id));
    render(); renderLayer();
    let fixed = 0;
    for (const id of ids) if ((await mReplayOne(id, true))?.status === "pass") fixed++;
    toast(tr("{n} cas rejoué(s) · {fixed} désormais réussi(s)", { n: ids.length, fixed }));
  },
  showMPrompt(el) {
    const text = state.mReport?.prompts?.[el.dataset.h] || tr("(introuvable)");
    state.modal = `<div class="overlay center" data-action="closeModal"><div class="panel" data-stop>
      <div class="panel-h"><div><h2>${tr("Prompt système")}</h2><div class="muted small mono">${esc(el.dataset.h)} · ${tr("{n} caractères", { n: text.length.toLocaleString(LOCALE) })}</div></div><button class="icon" data-action="closeModal">✕</button></div>
      <pre style="max-height:70vh">${esc(text)}</pre></div></div>`;
    renderLayer();
  },
  downloadMReport() {
    const { summary, ...report } = state.mReport;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(report, null, 2)], { type: "application/json" }));
    a.download = `bench-serveurs-${report.id}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },

  // Cas de test serveurs
  newMCase() {
    state.mEditing = { originalId: null, draft: { id: "", description: "", category: "", ...caseDefaults(), steps: [{ message: "", checks: [{ type: "notError" }, LANGUAGE_CHECK()] }] } };
    renderLayer();
  },
  editMCase(el) {
    const c = state.mCases.find((x) => x.id === el.dataset.id);
    state.mEditing = { originalId: c.id, draft: structuredClone({ description: "", category: "", ...caseDefaults(), ...c }) };
    renderLayer();
  },
  duplicateMCase(el) {
    const c = state.mCases.find((x) => x.id === el.dataset.id);
    state.mEditing = { originalId: null, draft: structuredClone({ description: "", category: "", ...caseDefaults(), ...c, id: c.id + tr("-copie") }) };
    renderLayer();
  },
  async deleteMCase(el) {
    if (!confirm(tr("Supprimer le cas « {id} » ?", { id: el.dataset.id }))) return;
    await guard(async () => {
      await api("/api/server/cases/" + encodeURIComponent(el.dataset.id), { method: "DELETE" });
      state.mEditing = null; renderLayer();
      await loadMCases(); render(); toast(tr("Cas supprimé"));
    });
  },
  addMStep() { readEditor(); state.mEditing.draft.steps.push({ message: "", checks: [{ type: "notError" }, LANGUAGE_CHECK()] }); renderLayer(); },
  removeMStep(el) { readEditor(); state.mEditing.draft.steps.splice(Number(el.dataset.i), 1); renderLayer(); },
  addMCheck(el) { readEditor(); const st = state.mEditing.draft.steps[Number(el.dataset.i)]; (st.checks ||= []).push(freshMCheck("kind")); renderLayer(); },
  removeMCheck(el) { readEditor(); state.mEditing.draft.steps[Number(el.dataset.i)].checks.splice(Number(el.dataset.j), 1); renderLayer(); },
  mCheckType(el) {
    readEditor();
    state.mEditing.draft.steps[Number(el.dataset.i)].checks[Number(el.dataset.j)] = freshMCheck(el.value);
    renderLayer();
  },
  async saveMCase() {
    readEditor();
    const d = state.mEditing.draft;
    const body = { originalId: state.mEditing.originalId, case: d };
    await guard(async () => {
      const saved = await api("/api/server/cases", { method: "POST", body });
      if (!state.mSelCases.includes(saved.id)) { state.mSelCases = [...state.mSelCases.filter((id) => id !== state.mEditing.originalId), saved.id]; store.set("mSelCases", state.mSelCases); }
      state.mEditing = null; renderLayer();
      await loadMCases(); render(); toast(tr("Cas enregistré"));
    });
  },
};

// =============================================================================================
// Actions
// =============================================================================================
const actions = {
  setLang(el) {
    if (el.dataset.v === LANG) return;
    // Laisse la pastille glisser avant de recharger la page dans l'autre langue.
    el.parentElement.className = "lang-switch " + el.dataset.v;
    el.parentElement.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === el));
    store.set("lang", el.dataset.v);
    setTimeout(() => location.reload(), 220);
  },
  async tab(el) {
    state.tab = el.dataset.tab;
    store.set("tab", state.tab);
    state.resultId = null;
    render(); renderLayer();
    if (state.tab === "reports") { await guard(loadReports); if (state.reportId) await guard(() => loadReport(state.reportId)); render(); }
    if (state.tab === "run") { await loadAvail(); render(); }
    if (state.tab === "prompt") await actions.promptOpen();
  },
  async promptOpen() {
    await guard(loadPromptSource); render();
    if (!state.promptSrc?.source && state.promptCands === null) await loadPromptCandidates();
  },
  promptToggleText() { state.promptShowText = !state.promptShowText; render(); },
  async promptChange() {
    state.promptChanging = !state.promptChanging; render();
    if (state.promptChanging && state.promptCands === null) await loadPromptCandidates();
  },
  promptDetect() { return loadPromptCandidates(); },
  promptMode(el) { state.promptManual.mode = el.dataset.v; state.promptManual.test = null; render(); },
  pmField(el) { state.promptManual[el.dataset.k] = el.value; },
  async promptTest() {
    const m = state.promptManual;
    await guard(async () => {
      m.test = await api("/api/prompt/test", { method: "POST", body: m.mode === "file" ? { kind: "file", file: m.file } : { kind: "module", module: m.module, export: m.export } });
    });
    render();
  },
  async promptUse(el) {
    const x = state.promptCands.find((c) => c.id === el.dataset.id);
    if (!x) return;
    await savePrompt(x.kind === "module"
      ? { kind: "module", module: x.file, export: x.export, version: x.version ? { module: x.version.file, export: x.version.export } : null }
      : { kind: "file", file: x.file });
  },
  async promptSaveManual() {
    const m = state.promptManual;
    await savePrompt(m.mode === "module" ? { kind: "module", module: m.module, export: m.export } : m.mode === "file" ? { kind: "file", file: m.file } : { kind: "text", text: m.text });
  },

  // Lancer
  selModels(el) {
    state.selModels = new Set(el.dataset.v === "all" ? availFlat().filter((m) => !state.tierFilter || m.tier === state.tierFilter).map((m) => m.key) : []);
    store.set("selModels", [...state.selModels]); render();
  },
  toggleModel(el) {
    el.checked ? state.selModels.add(el.dataset.name) : state.selModels.delete(el.dataset.name);
    store.set("selModels", [...state.selModels]); render();
  },
  selCases(el) {
    const visible = filteredCases().map((c) => c.id);
    const sel = new Set(state.selCases);
    if (el.dataset.v === "all") visible.forEach((id) => sel.add(id));
    if (el.dataset.v === "none") visible.forEach((id) => sel.delete(id));
    if (el.dataset.v === "invert") visible.forEach((id) => (sel.has(id) ? sel.delete(id) : sel.add(id)));
    state.selCases = [...sel]; store.set("selCases", state.selCases); render();
  },
  lbSearch(el) { state.lbQuery = el.value; render(); },
  async testModel(el) {
    state.selModels = new Set([el.dataset.name]); store.set("selModels", [...state.selModels]);
    state.tab = "run"; store.set("tab", "run");
    await actions.menu({ dataset: { menu: "llm" } });
  },
  async goPull() {
    if (!freeListShown()) await actions.modtab({ dataset: { tab: "free" } });
    $("#pullName")?.scrollIntoView({ behavior: "smooth", block: "center" });
    $("#pullName")?.focus();
  },
  toggleCat(el) {
    const cs = filteredCases().filter((c) => (c.category || "") === el.dataset.cat).map((c) => c.id);
    const sel = new Set(state.selCases);
    cs.forEach((id) => (el.checked ? sel.add(id) : sel.delete(id)));
    state.selCases = [...sel]; store.set("selCases", state.selCases); render();
  },
  openCat(el) { const c = el.dataset.cat; state.openCats.has(c) ? state.openCats.delete(c) : state.openCats.add(c); render(); },
  async selFailures() {
    await guard(async () => {
      const last = state.reports[0];
      const r = await api("/api/reports/" + last.id);
      const failing = [...new Set(r.results.filter((x) => x.status !== "pass").map((x) => x.caseId))].filter((id) => state.cases.some((c) => c.id === id));
      state.selCases = failing; store.set("selCases", state.selCases);
      toast(failing.length ? tr("{n} cas en échec sélectionné(s)", { n: failing.length }) : tr("Aucun échec dans le dernier rapport"));
    });
    render();
  },
  toggleCase(el) {
    const sel = new Set(state.selCases);
    el.checked ? sel.add(el.dataset.id) : sel.delete(el.dataset.id);
    state.selCases = [...sel]; store.set("selCases", state.selCases); render();
  },
  caseSearch(el) { state.caseFilter.q = el.value; render(); },
  caseCat(el) { state.caseFilter.category = el.value; render(); },
  async refreshAvail() { await loadAvail(); render(); },
  runName(el) { state.runName = el.value; },
  parallelInput(el) { state.parallel = Math.min(16, Math.max(1, Number(el.value) || 1)); store.set("parallel", state.parallel); render(); },
  runsInput(el) { state.runs = Math.min(10, Math.max(1, Number(el.value) || 1)); render(); },
  async launch() {
    await guard(async () => {
      const models = availFlat().filter((m) => state.selModels.has(m.key)).map((m) => m.key);
      const caseIds = state.cases.filter((c) => state.selCases.includes(c.id)).map((c) => c.id);
      const { reportId } = await api("/api/runs", { method: "POST", body: { models, caseIds, runs: state.runs, name: state.runName, parallel: state.parallel } });
      state.active = { reportId, done: 0, total: models.length * caseIds.length * state.runs, phase: "loading", current: models[0] };
      state.lastFinished = null;
      toast(tr("Campagne lancée"));
      render();
    });
  },
  async stopRun() { await guard(() => api("/api/runs/stop", { method: "POST" })); toast(tr("Arrêt demandé : le test en cours se termine d'abord")); },

  // Rapports
  async openReport(el) {
    state.reportId = el.dataset.id; store.set("reportId", state.reportId);
    state.tab = "reports"; store.set("tab", "reports");
    state.resultId = null; state.onlyFailures = false; state.heatFilter = { cat: null, status: "" };
    await guard(() => loadReport(state.reportId));
    render(); renderLayer();
  },
  async closeReport() {
    state.reportId = null; state.report = null; store.set("reportId", null);
    await guard(loadReports); render();
  },
  async deleteReport(el) {
    if (!confirm(tr("Supprimer ce rapport ?"))) return;
    await guard(async () => {
      await api("/api/reports/" + el.dataset.id, { method: "DELETE" });
      if (state.reportId === el.dataset.id) { state.reportId = null; state.report = null; store.set("reportId", null); }
      await loadReports(); render(); toast(tr("Rapport supprimé"));
    });
  },
  onlyFailures(el) { state.onlyFailures = el.checked; render(); },
  heatCat(el) { state.heatFilter.cat = el.value === "*" ? null : el.value; render(); },
  heatStatus(el) { state.heatFilter.status = el.dataset.v; render(); },
  openResult(el) { state.resultId = el.dataset.id; render(); renderLayer(); },
  openDiff(el) { state.diffCase = el.dataset.case; state.mDiffCase = null; state.diffRef = null; state.modal = modalDiff(); renderLayer(); },
  diffRef(el) { state.diffRef = el.value; state.modal = state.mDiffCase ? modalMDiff() : modalDiff(); renderLayer(); },
  openMDiff(el) { state.mDiffCase = el.dataset.case; state.mDiffStep = 0; state.diffRef = null; state.modal = modalMDiff(); renderLayer(); },
  mDiffStep(el) { state.mDiffStep = Number(el.dataset.i); state.modal = modalMDiff(); renderLayer(); },
  async replay(el) { await replayOne(el.dataset.id); },
  async replayFailures() {
    const ids = failingResults(state.report).map((x) => x.id);
    ids.forEach((id) => state.replaying.add(id));
    render(); renderLayer();
    let fixed = 0;
    for (const id of ids) if ((await replayOne(id, true))?.status === "pass") fixed++;
    toast(tr("{n} test(s) rejoué(s) · {fixed} désormais réussi(s)", { n: ids.length, fixed }));
  },
  showPrompt() {
    state.modal = `<div class="overlay center" data-action="closeModal"><div class="panel" data-stop>
      <div class="panel-h"><div><h2>${tr("Prompt système")}</h2><div class="muted small">${state.report.promptVersion ? `${tr("version")} ${esc(state.report.promptVersion)} · ` : ""} ${tr("{n} caractères", { n: state.report.systemPrompt.length.toLocaleString(LOCALE) })}</div></div><button class="icon" data-action="closeModal">✕</button></div>
      <pre style="max-height:70vh">${esc(state.report.systemPrompt)}</pre></div></div>`;
    renderLayer();
  },
  closeModal() { state.modal = null; state.mDiffCase = null; render(); renderLayer(); },
  downloadReport() {
    const { summary, ...report } = state.report;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(report, null, 2)], { type: "application/json" }));
    a.download = `bench-${report.id}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },
  closeLayer() {
    if (state.modal) { state.modal = null; }
    else if (state.provDraft) { state.provDraft = null; }
    else if (state.keyDraft) { state.keyDraft = null; }
    else if (state.editing) { state.editing = null; }
    else if (state.mEditing) { state.mEditing = null; }
    else if (state.logFor) { state.logFor = null; }
    else { state.resultId = null; state.mResultId = null; render(); }
    renderLayer();
  },

  // Cas de test
  newCase() {
    const nc = state.status?.prompt?.newCase || {};
    const draft = structuredClone({ id: "", description: "", category: "", message: "", history: [], checks: [], ...nc });
    if (!draft.checks.some((k) => k.type === "language")) draft.checks.push(LANGUAGE_CHECK());
    state.editing = { originalId: null, draft };
    renderLayer();
  },
  editCase(el) {
    const c = state.cases.find((x) => x.id === el.dataset.id);
    state.editing = { originalId: c.id, draft: structuredClone({ history: [], checks: [], description: "", ...c }) };
    renderLayer();
  },
  duplicateCase(el) {
    const c = state.cases.find((x) => x.id === el.dataset.id);
    state.editing = { originalId: null, draft: structuredClone({ history: [], checks: [], description: "", ...c, id: c.id + tr("-copie") }) };
    renderLayer();
  },
  async deleteCase(el) {
    if (!confirm(tr("Supprimer le cas « {id} » ?", { id: el.dataset.id }))) return;
    await guard(async () => {
      await api("/api/cases/" + encodeURIComponent(el.dataset.id), { method: "DELETE" });
      state.editing = null; renderLayer();
      await loadCases(); render(); toast(tr("Cas supprimé"));
    });
  },
  addHistory() { readEditor(); state.editing.draft.history.push({ role: state.editing.draft.history.at(-1)?.role === "user" ? "assistant" : "user", content: "" }); renderLayer(); },
  removeHistory(el) { readEditor(); state.editing.draft.history.splice(Number(el.dataset.i), 1); renderLayer(); },
  addCheck() { readEditor(); state.editing.draft.checks.push(freshCheck((state.status?.prompt?.checkTypes || [])[0]?.type, state.status?.prompt?.checkTypes)); renderLayer(); },
  removeCheck(el) { readEditor(); state.editing.draft.checks.splice(Number(el.dataset.i), 1); renderLayer(); },
  checkType(el) {
    readEditor();
    state.editing.draft.checks[Number(el.dataset.i)] = freshCheck(el.value, state.status?.prompt?.checkTypes);
    renderLayer();
  },
  async saveCase() {
    readEditor();
    const d = state.editing.draft;
    const body = { originalId: state.editing.originalId, case: { ...d, history: (d.history || []).filter((h) => h.content.trim()) } };
    await guard(async () => {
      const saved = await api("/api/cases", { method: "POST", body });
      if (!state.selCases.includes(saved.id)) { state.selCases = [...state.selCases.filter((id) => id !== state.editing.originalId), saved.id]; store.set("selCases", state.selCases); }
      state.editing = null; renderLayer();
      await loadCases(); render(); toast(tr("Cas enregistré"));
    });
  },

  // Modèles
  async refreshModels() { await Promise.all([loadModels(), loadAvail()]); render(); },
  async deleteModel(el) {
    if (!confirm(tr("Supprimer {name} du disque ?", { name: el.dataset.name }))) return;
    await guard(async () => { await api("/api/models/" + encodeURIComponent(el.dataset.name), { method: "DELETE" }); await Promise.all([loadModels(), loadAvail()]); render(); toast(tr("Modèle supprimé")); });
  },
  async pull(el) { await startPull(el.dataset.name); },
  async cancelPull(el) { await guard(() => api("/api/pulls/" + encodeURIComponent(el.dataset.name), { method: "DELETE" })); state.pulls = await api("/api/pulls"); render(); },
  async searchLibrary() {
    state.libraryLoading = true; render();
    await guard(async () => { state.library = await api("/api/library/search?q=" + encodeURIComponent(state.libraryQuery)); });
    state.libraryLoading = false; render();
  },
  async toggleTags(el) {
    const name = el.dataset.name;
    if (state.tags[name]) { delete state.tags[name]; render(); return; }
    state.tags[name] = "loading"; render();
    await guard(async () => { state.tags[name] = await api("/api/library/tags?name=" + encodeURIComponent(name)); });
    if (state.tags[name] === "loading") delete state.tags[name];
    render();
  },
};

Object.assign(actions, MCP_ACTIONS, GW_ACTIONS);

async function startPull(name) {
  name = String(name || "").trim();
  if (!name) return;
  await guard(async () => {
    await api("/api/pulls", { method: "POST", body: { name } });
    state.pulls = await api("/api/pulls");
    toast(tr("Téléchargement de {name} lancé", { name }));
    render();
  });
}

async function replayOne(id, quiet = false) {
  const reportId = state.report.id;
  state.replaying.add(id); render(); renderLayer();
  try {
    const fresh = await api(`/api/reports/${reportId}/replay`, { method: "POST", body: { resultId: id } });
    if (!quiet) toast(fresh.status === "pass" ? tr("Rejeu : réussi ✓") : tr("Rejeu : toujours en échec"));
    return fresh;
  } catch (e) {
    toast(e.message, true);
  } finally {
    state.replaying.delete(id);
    if (state.reportId === reportId) await guard(() => loadReport(reportId));
    render(); renderLayer();
  }
}

// ---- Délégation d'événements ----
// Journal en bas de la page Serveurs : il suit les nouvelles lignes sauf si l'utilisateur remonte.
document.addEventListener("scroll", (e) => {
  if (e.target?.id === "dockPre") state.dockStick = e.target.scrollTop + e.target.clientHeight >= e.target.scrollHeight - 20;
}, true);
document.addEventListener("click", (e) => {
  document.querySelectorAll(".picker-pop:not([hidden])").forEach((p) => { if (!p.closest("[data-picker]").contains(e.target)) p.hidden = true; });
}, true);
addEventListener("scroll", (e) => {
  document.querySelectorAll(".picker-pop:not([hidden])").forEach((p) => { if (!p.contains(e.target)) p.hidden = true; });
}, true);
addEventListener("resize", () => document.querySelectorAll(".picker-pop:not([hidden])").forEach((p) => { p.hidden = true; }));
document.addEventListener("keydown", (e) => {
  if ((e.key === "ArrowDown" || e.key === "ArrowUp") && e.target.closest?.(".picker-pop")) {
    const opts = [...e.target.closest(".picker-pop").querySelectorAll(".picker-o:not([hidden]):not(:disabled)")];
    if (opts.length) {
      e.preventDefault();
      const i = opts.indexOf(document.activeElement);
      opts[e.key === "ArrowDown" ? Math.min(opts.length - 1, i + 1) : Math.max(0, i < 0 ? 0 : i - 1)].focus();
    }
    return;
  }
  if (e.key === "Enter" && e.target.matches(".picker-pop input")) {
    e.preventDefault();
    e.target.closest(".picker-pop").querySelector(".picker-o:not([hidden]):not(:disabled)")?.click();
    return;
  }
  if (e.key !== "Escape") return;
  const open = document.querySelector(".picker-pop:not([hidden])");
  if (open) { open.hidden = true; e.stopImmediatePropagation(); }
}, true);
document.addEventListener("click", (e) => {
  const stop = e.target.closest("[data-stop]");
  const el = e.target.closest("[data-action]");
  if (!el || (stop && !stop.contains(el))) return;
  if (el.matches("input, select") ) return; // gérés par "change"
  if (el.classList.contains("overlay") && e.target !== el) return; // clic dans le panneau
  // Ligne cliquable : un clic sur un bouton, un lien ou une liste de la ligne garde son propre effet.
  if (el.tagName === "TR" && e.target.closest("button, a, input, select, label, .picker")) return;
  e.preventDefault();
  actions[el.dataset.action]?.(el);
});
document.addEventListener("change", (e) => {
  const el = e.target.closest("input[data-action], select[data-action]");
  if (el && el.type !== "search" && el.type !== "text") actions[el.dataset.action]?.(el);
});
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.matches("input[type=search][data-action], input[type=text][data-action], textarea[data-action]")) actions[el.dataset.action]?.(el);
});
document.addEventListener("submit", (e) => {
  const form = e.target.closest("[data-form]");
  if (!form) return;
  e.preventDefault();
  if (form.dataset.form === "pull") { startPull($("#pullName").value); $("#pullName").value = ""; }
  if (form.dataset.form === "library") { state.libraryQuery = $("#libQuery").value; actions.searchLibrary(); }
  if (form.dataset.form === "newServer") actions.createServer();
  if (form.dataset.form === "gateway") { const v = $("#gwModel")?.value; if (v) gwSet(v); }
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if ($("#layer").innerHTML) return actions.closeLayer();
  if (e.target.matches?.("input, textarea, select")) return;
  // Échap sur un rapport ouvert : retour à la liste (même effet que le bouton « Retour »).
  const back = $("button.back[data-action]");
  if (back) actions[back.dataset.action]?.(back);
});

// =============================================================================================
// Rafraîchissement périodique (campagne en cours, téléchargements)
// =============================================================================================
let lastSig = "";
async function tick() {
  try {
    const wasActive = state.active;
    state.active = await api("/api/runs/active");
    if (state.active) {
      const rep = await api("/api/reports/" + state.active.reportId);
      state.activeReport = rep;
      if (state.reportId === state.active.reportId) state.report = rep;
    }
    if (wasActive && !state.active) {
      state.lastFinished = wasActive.reportId;
      state.activeReport = null;
      toast(tr("Campagne terminée"));
      await Promise.all([loadReports(), loadLeaderboard()]);
      if (state.reportId === wasActive.reportId) await loadReport(state.reportId);
      await loadModels();
    }
    if (freeListShown() || state.pulls.some((p) => !p.done)) {
      const before = state.pulls.filter((p) => !p.done).length;
      state.pulls = await api("/api/pulls");
      const after = state.pulls.filter((p) => !p.done).length;
      if (after < before) { await Promise.all([loadModels(), loadAvail()]); state.pulls.filter((p) => p.done && !p.error).forEach((p) => toast(tr("{name} téléchargé", { name: p.name }))); }
    }
    await mcpTick();
    if (state.menu === "gw" || state.gw) await loadGateway().catch(() => {});
    const sig = JSON.stringify([state.menu, state.active, state.pulls, state.report?.results?.length, state.report?.status, state.models.length,
      state.mActive, state.servers.map((x) => [x.id, x.phase, x.error, x.updatedAt, x.model]), state.mReport?.results?.length, state.mReport?.status, state.logText.length, state.dockFor, state.dockText.length,
      state.gw?.target, state.gw?.stats?.calls]);
    // Pas de rendu pendant une saisie ou une popin (sauf la passerelle : la popin de détail d'un appel est
    // dans #layer, la liste peut se mettre à jour dessous). La signature n'est retenue qu'une fois affichée :
    // un changement survenu pendant une popin est rendu au tick qui suit sa fermeture.
    const blocked = state.editing || state.mEditing || (state.modal && state.menu !== "gw") || state.provDraft || state.keyDraft || state.changingModel;
    if (sig !== lastSig && !blocked) {
      lastSig = sig;
      render();
      if (state.resultId || state.mResultId || state.logFor) {
        const pre = $("#logPre");
        const atBottom = !pre || pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 20;
        renderLayer();
        const next = $("#logPre");
        if (next && atBottom) next.scrollTop = next.scrollHeight;
      }
    }
  } catch {
    // serveur arrêté : on réessaie au prochain tour
  } finally {
    setTimeout(tick, 1500);
  }
}

// =============================================================================================
// Démarrage
// =============================================================================================
(async () => {
  await guard(loadStatus);
  const p = state.status?.prompt, sv = state.status?.server;
  await Promise.all([loadModels(), loadAvail(), loadLeaderboard(), guard(loadGateway), guard(loadMStatus),
    p ? guard(loadCases) : null, p ? guard(loadReports) : null,
    sv ? guard(loadServers) : null, sv ? guard(loadMCases) : null, sv ? guard(loadMReports) : null, sv ? guard(loadEnv) : null]);
  state.selCases ??= [];
  state.mSelCases ??= [];
  if (state.reportId) await loadReport(state.reportId).catch(() => { state.reportId = null; store.set("reportId", null); });
  if (state.mReportId) await loadMReport(state.mReportId).catch(() => { state.mReportId = null; store.set("mReportId", null); });
  render();
  if (freeListShown() && state.status?.ollama) actions.searchLibrary();
  if (state.menu === "llm" && (state.tab === "prompt" || !state.status?.prompt)) actions.promptOpen();
  tick();
})();
</script>
