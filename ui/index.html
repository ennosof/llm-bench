<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llm-bench</title>
<style>
  :root {
    --bg: #f5f6f8; --surface: #fff; --surface-2: #f0f2f5; --border: #e1e4e9; --text: #1a1e24; --muted: #5d6877;
    --accent: #4b45d6; --accent-soft: #eceeff; --ok: #17794a; --ok-soft: #e3f4ea; --bad: #be3a30; --bad-soft: #fcebe9;
    --warn: #9a5c00; --warn-soft: #fff2db; --shadow: 0 1px 2px rgba(16, 24, 40, .06);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111317; --surface: #1a1d23; --surface-2: #22262e; --border: #30353f; --text: #e7e9ee; --muted: #9aa3b2;
      --accent: #8f8bff; --accent-soft: #2a2a4a; --ok: #4cc38a; --ok-soft: #173326; --bad: #f2756a; --bad-soft: #3b1f1d;
      --warn: #f0b347; --warn-soft: #3a2c12; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; margin: 0; }
  header .meta { display: flex; flex-wrap: wrap; gap: 8px; color: var(--muted); font-size: 12.5px; }
  nav { display: flex; gap: 4px; padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--border); overflow-x: auto; }
  nav button { border: 0; background: none; padding: 10px 12px; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
  nav button.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  main { max-width: 1280px; margin: 0 auto; padding: 20px; display: grid; gap: 16px; }
  h2 { font-size: 15px; margin: 0; }
  h3 { font-size: 14px; margin: 0; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
  .card-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 16px; }
  @media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } main { padding: 12px 16px; } }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  .strong { font-weight: 600; }
  .mono { font-family: var(--mono); font-size: 12.5px; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button.b, .b { border: 1px solid var(--border); background: var(--surface); padding: 6px 12px; border-radius: 7px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  button.b:hover { background: var(--surface-2); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent); filter: brightness(1.08); }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.link { border: 0; background: none; color: var(--accent); padding: 0; cursor: pointer; }
  button.icon { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 4px 6px; border-radius: 6px; }
  button.icon:hover { background: var(--surface-2); color: var(--text); }
  input[type=text], input[type=number], input[type=search], select, textarea { border: 1px solid var(--border); background: var(--surface); border-radius: 7px; padding: 6px 9px; min-width: 0; }
  textarea { width: 100%; resize: vertical; }
  label.field, div.field { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
  label.field > *, div.field > * { color: var(--text); font-size: 14px; }
  .checklist { list-style: none; margin: 0; padding: 0; max-height: 420px; overflow: auto; border: 1px solid var(--border); border-radius: 8px; }
  .checklist li { border-top: 1px solid var(--border); }
  .checklist li:first-child { border-top: 0; }
  .checklist label { display: flex; gap: 10px; align-items: baseline; padding: 8px 10px; cursor: pointer; }
  .checklist label:hover { background: var(--surface-2); }
  .checklist .txt { min-width: 0; }
  .checklist .msg { display: block; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .chip.ok { background: var(--ok-soft); color: var(--ok); }
  .chip.bad { background: var(--bad-soft); color: var(--bad); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.accent { background: var(--accent-soft); color: var(--accent); }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 8px 10px; border-top: 1px solid var(--border); vertical-align: top; }
  th { font-size: 12px; font-weight: 600; color: var(--muted); border-top: 0; white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--surface-2); }
  .progress { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--accent); transition: width .3s; }
  .score { display: grid; grid-template-columns: 44px 80px; gap: 8px; align-items: center; }
  .score .progress > div { background: var(--ok); }
  .pill { border: 1px solid transparent; border-radius: 6px; padding: 2px 7px; font-size: 12.5px; cursor: pointer; font-variant-numeric: tabular-nums; white-space: nowrap; margin: 0 4px 4px 0; }
  .pill.pass { background: var(--ok-soft); color: var(--ok); }
  .pill.fail { background: var(--bad-soft); color: var(--bad); }
  .pill.error { background: var(--warn-soft); color: var(--warn); }
  .pill.busy { opacity: .55; cursor: progress; }
  .pill.sel { border-color: currentColor; }
  .picker { position: relative; min-width: 0; }
  .picker-btn { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--surface); border-radius: 7px; padding: 6px 9px; cursor: pointer; text-align: left; }
  .picker-btn .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .picker-pop { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 30; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.18); padding: 6px; display: grid; gap: 4px; }
  .picker-pop[hidden], .picker-o[hidden], .picker [data-group][hidden] { display: none; }
  .picker-pop input { width: 100%; }
  .picker-list { max-height: 320px; overflow: auto; }
  .picker-g { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; padding: 8px 8px 4px; }
  .picker-o { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 13.5px; }
  .picker-o:hover, .picker-o.on { background: var(--accent-soft); }
  .picker-o.on { color: var(--accent); font-weight: 600; }
  .picker-o .d { color: var(--muted); font-weight: 400; font-size: 12px; }
  .picker-o:disabled { cursor: default; color: var(--muted); background: none; }
  .launch { display: flex; flex-wrap: wrap; align-items: end; gap: 12px 16px; }
  .launch .grow { flex: 1 1 200px; }
  .empty { color: var(--muted); padding: 16px; text-align: center; }
  /* Dépliants : bouton avec chevron qui pivote à l'ouverture. */
  details > summary { list-style: none; display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; max-width: 100%; padding: 6px 12px 6px 10px;
    border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 8px; background: var(--accent-soft); color: var(--accent);
    font-weight: 600; cursor: pointer; user-select: none; transition: background .15s, border-color .15s, box-shadow .15s; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before { content: ""; flex: none; width: 7px; height: 7px; border: solid currentColor; border-width: 0 2px 2px 0; transform: rotate(-45deg); transition: transform .15s; margin-right: 2px; }
  details[open] > summary::before { transform: rotate(45deg); }
  details > summary:hover { border-color: var(--accent); box-shadow: 0 1px 4px color-mix(in srgb, var(--accent) 25%, transparent); }
  details > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  details[open] > summary { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); border-color: var(--accent); margin-bottom: 8px; }
  details > summary .chip, details > summary .mono { font-weight: 400; }
  details + details { margin-top: 6px; }
  pre { margin: 0; padding: 10px 12px; background: var(--surface-2); border-radius: 8px; overflow: auto; max-height: 420px; font: 12.5px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; }
  pre.json .j-k { color: var(--accent, #2563eb); }
  pre.json .j-s { color: #15803d; }
  pre.json .j-n { color: #b45309; }
  pre.json .j-b { color: #7c3aed; font-weight: 600; }
  @media (prefers-color-scheme: dark) { pre.json .j-s { color: #4ade80; } pre.json .j-n { color: #fbbf24; } pre.json .j-b { color: #c4b5fd; } }
  table.hx { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.hx th { text-align: left; color: var(--muted); font-weight: 500; padding: 4px 10px 4px 0; white-space: nowrap; vertical-align: top; width: 1%; }
  table.hx td { padding: 4px 0; font-family: var(--mono); word-break: break-all; }
  dl.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin: 0; }
  dl.kv div { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
  dl.kv dt { font-size: 12px; color: var(--muted); }
  dl.kv dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
  table.info { font-size: 13px; }
  table.info th { width: 190px; font-weight: 500; color: var(--muted); white-space: normal; border-top: 1px solid var(--border); }
  table.info td { word-break: break-all; }
  table.info tr:first-child th, table.info tr:first-child td { border-top: 0; }
  .copy { cursor: copy; border-bottom: 1px dashed var(--border); }
  .copy:hover { color: var(--accent); }
  .diff { margin: 0; padding: 8px 0; background: var(--surface-2); border-radius: 8px; overflow: auto; max-height: 420px; font: 12.5px/1.5 var(--mono); }
  .diff div { padding: 0 12px; white-space: pre-wrap; word-break: break-word; }
  .diff .add { background: var(--ok-soft); color: var(--ok); }
  .diff .del { background: var(--bad-soft); color: var(--bad); }
  .diff .skip { color: var(--muted); font-style: italic; }
  table.fields td.differs { background: var(--warn-soft); }
  .checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .checks li { display: flex; gap: 8px; }
  .ok-t { color: var(--ok); } .bad-t { color: var(--bad); } .warn-t { color: var(--warn); }
  .banner { padding: 10px 12px; border-radius: 8px; }
  .banner.pass { background: var(--ok-soft); color: var(--ok); }
  .banner.fail { background: var(--bad-soft); color: var(--bad); }
  .banner.error { background: var(--warn-soft); color: var(--warn); }
  .section { display: grid; gap: 8px; }
  .section h3 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .overlay { position: fixed; inset: 0; background: rgba(10, 12, 16, .45); z-index: 20; display: flex; justify-content: flex-end; }
  .overlay.center { justify-content: center; align-items: flex-start; padding: 40px 16px; overflow: auto; }
  .panel { background: var(--surface); width: min(720px, 100%); height: 100%; overflow: auto; padding: 20px; display: grid; gap: 18px; align-content: start; }
  .overlay.center .panel { height: auto; border-radius: 12px; width: min(820px, 100%); }
  .panel-h { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
  .row > .grow { flex: 1 1 160px; }
  .editor-item { border: 1px solid var(--border); border-radius: 8px; padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
  .lib { display: grid; gap: 0; }
  .lib-item { border-top: 1px solid var(--border); padding: 12px 0; display: grid; gap: 6px; }
  .lib-item:first-child { border-top: 0; }
  .lib-item a { color: var(--text); font-weight: 600; }
  #toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 40; max-width: min(420px, calc(100vw - 32px)); }
  .toast { background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
  .toast.bad { background: var(--bad); color: #fff; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .menu { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; padding: 3px; gap: 2px; }
  .menu button { border: 0; background: none; padding: 6px 14px; border-radius: 7px; cursor: pointer; color: var(--muted); display: grid; text-align: left; line-height: 1.25; }
  .menu button small { font-size: 11.5px; font-weight: 400; }
  .menu button.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow), 0 0 0 1px var(--border); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: var(--surface); padding: 6px 14px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .seg.lang button { padding: 2px 8px; font-size: 12px; }
  .seg button:disabled { opacity: .45; cursor: not-allowed; }
  .ph-running { background: var(--ok-soft); color: var(--ok); }
  .ph-failed { background: var(--bad-soft); color: var(--bad); }
  .ph-stopped { background: var(--surface-2); color: var(--muted); }
  .ph-busy { background: var(--accent-soft); color: var(--accent); }
  .step { border: 1px solid var(--border); border-radius: 8px; padding: 12px; display: grid; gap: 10px; }
  .step-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center; }
  .k-success { background: var(--ok-soft); color: var(--ok); }
  .k-info { background: var(--accent-soft); color: var(--accent); }
  .k-no_results { background: var(--warn-soft); color: var(--warn); }
  .k-error { background: var(--bad-soft); color: var(--bad); }
  .t-free { background: var(--ok-soft); color: var(--ok); }
  .t-paid { background: var(--warn-soft); color: var(--warn); }
  .group-h { padding: 6px 10px; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--surface-2); display: flex; justify-content: space-between; gap: 8px; }
  .gw-target { font-size: 18px; font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1 id="title">llm-bench</h1>
  <div class="menu" id="menu"></div>
  <div class="meta" id="meta"></div>
</header>
<nav id="tabs"></nav>
<main id="view"></main>
<div id="layer"></div>
<div id="toasts"></div>

const LANG = (() => {
  try { const v = JSON.parse(localStorage.getItem("bench.lang")); if (v === "fr" || v === "en") return v; } catch {}
  return (navigator.language || "").toLowerCase().startsWith("fr") ? "fr" : "en";
})();
const LOCALE = LANG === "fr" ? "fr-FR" : "en-US";
const tr = (fr, params) => {
  const text = LANG === "en" ? UI_EN[fr] ?? fr : fr;
  return params ? text.replace(/\{(\w+)\}/g, (m, k) => (k in params ? String(params[k]) : m)) : text;
};
document.documentElement.lang = LANG;
/** Type d'un appel LLM capturé : codes du bench traduits (anciens enregistrements anglais compris), noms de la config tels quels. */
const callKindLabel = (k) => ({ "génération": tr("génération"), generation: tr("génération"), outils: tr("outils"), tools: tr("outils") }[k] ?? k);
const langSwitch = () => `<span class="seg lang">${["fr", "en"].map((l) => `<button type="button" class="${LANG === l ? "on" : ""}" data-action="setLang" data-v="${l}">${l.toUpperCase()}</button>`).join("")}</span>`;

const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
/** Texte JSON (éventuellement entre ```json … ```) réindenté ; tout autre texte inchangé. */
const prettyJson = (text) => {
  const body = String(text ?? "").trim().replace(/^```(?:json)?\s*\n?([\s\S]*?)\n?```$/, "$1");
  if (!/^[{[]/.test(body)) return text;
  try { return JSON.stringify(JSON.parse(body), null, 2); } catch { return text; }
};
/** JSON indenté et coloré (HTML échappé). Les chaînes contenant du JSON sont dépliées. */
const jsonHtml = (v) => {
  if (v == null || v === "") return `<span class="muted">${tr("(vide)")}</span>`;
  if (typeof v === "string") { const p = prettyJson(v); if (p === v) return esc(v); v = JSON.parse(String(v).trim().replace(/^```(?:json)?\s*\n?([\s\S]*?)\n?```$/, "$1")); }
  return JSON.stringify(v, null, 2).replace(/("(?:[^"\\]|\\.)*")(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)|([^"\w-]+|[\w-])/g, (m, str, colon, lit, num, other) =>
    other != null ? esc(other) : str ? `<span class="${colon ? "j-k" : "j-s"}">${esc(str)}</span>${colon || ""}` : lit ? `<span class="j-b">${lit}</span>` : `<span class="j-n">${num}</span>`);
};
const jsonPre = (v) => `<pre class="json">${jsonHtml(v)}</pre>`;

/** Détail HTTP d'un appel LLM relayé : URL réelle, port, clé, requêtes et réponse complètes. */
function httpExchange(c) {
  const h = c.http;
  if (!h) return "";
  const u = h.upstream, i = h.incoming, r = h.reply;
  const key = u.key ? `<span class="mono">${esc(u.keyHeader)}: </span><span class="mono" data-key="${esc(u.key)}">${esc(u.key.length > 12 ? `${u.key.slice(0, 6)}…${u.key.slice(-4)}` : "••••")}</span> <button class="link small" data-action="revealKey">${tr("afficher")}</button>` : `<span class="muted">${tr("aucune")}</span>`;
  return `<div class="section"><h3>${tr("Appel HTTP")}</h3>
    <table class="hx">
      <tr><th>${tr("URL réelle appelée")}</th><td>${esc(u.method)} ${esc(u.url)}</td></tr>
      <tr><th>${tr("Hôte · port")}</th><td>${esc(u.host)} · ${u.port}</td></tr>
      <tr><th>${tr("Clé envoyée")}</th><td>${key}</td></tr>
      <tr><th>${tr("Appelé par le serveur")}</th><td>${esc(i.method)} ${esc(i.url)}</td></tr>
      <tr><th>${tr("Port local · client")}</th><td>${i.localPort ?? "?"} · ${esc(i.remoteAddress || "?")}:${i.remotePort ?? "?"}</td></tr>
      <tr><th>${tr("Réponse")}</th><td>HTTP ${r.status}${r.statusText ? ` ${esc(r.statusText)}` : ""} · ${tr("{n} octets", { n: r.bytes.toLocaleString(LOCALE) })} · ${fmt.s(c.latencyMs)}</td></tr>
    </table>
    <details><summary class="small">${tr("Requête reçue du serveur — en-têtes")}</summary>${jsonPre(i.headers)}</details>
    <details><summary class="small">${tr("Requête reçue du serveur — corps")}</summary>${jsonPre(i.body)}</details>
    <details><summary class="small">${tr("Requête envoyée au fournisseur — en-têtes")}</summary>${jsonPre(u.headers)}</details>
    <details open><summary class="small">${tr("Requête envoyée au fournisseur — corps")}</summary>${jsonPre(u.body)}</details>
    <details><summary class="small">${tr("Réponse du fournisseur — en-têtes")}</summary>${jsonPre(r.headers)}</details>
    <details open><summary class="small">${tr("Réponse du fournisseur — corps")}${Array.isArray(r.body) && c.stream ? ` (${tr("{n} événements SSE", { n: r.body.length })})` : ""}</summary>${jsonPre(r.body)}</details>
  </div>`;
}

const store = {
  get(k, d) { try { const v = localStorage.getItem("bench." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("bench." + k, JSON.stringify(v)); } catch {} },
};
const fmt = {
  gb: (b) => (b ? (b / 1e9).toFixed(1) + " " + tr("Go") : "–"),
  s: (ms) => (ms == null ? "–" : (ms / 1000).toFixed(1) + " s"),
  pct: (n, t) => (t ? Math.round((n / t) * 100) + " %" : "–"),
  n: (v) => (v == null ? "–" : String(v)),
  date: (d) => (d ? new Date(d).toLocaleString(LOCALE, { dateStyle: "short", timeStyle: "short" }) : "–"),
};
const resolveDates = (t) => String(t ?? "").replace(/\{\{\s*J\s*([+-]\s*\d+)?\s*\}\}/g, (_, o) =>
  new Date(Date.now() + Number((o || "0").replace(/\s/g, "")) * 864e5).toISOString().slice(0, 10));

async function api(path, opts = {}) {
  const res = await fetch(path, {
    method: opts.method || "GET",
    headers: { "x-llm-bench-lang": LANG, ...(opts.body !== undefined ? { "Content-Type": "application/json" } : {}) },
    body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error(data?.error || res.statusText);
  return data;
}

function toast(msg, bad = false) {
  const el = document.createElement("div");
  el.className = "toast" + (bad ? " bad" : "");
  el.textContent = msg;
  $("#toasts").append(el);
  setTimeout(() => el.remove(), bad ? 7000 : 3500);
}

async function guard(fn) {
  try { return await fn(); } catch (e) { toast(e.message || String(e), true); }
}

function renderMeta() {
  const s = state.status;
  if (!s) return;
  const ollama = s.ollama ? (s.ollama.ok ? `<span class="chip ok">Ollama ${esc(s.ollama.version)}</span>` : `<span class="chip bad" title="${esc(s.ollama.error)}">${tr("Ollama injoignable")}</span>`) : "";

  const providers = `<span title="${esc(s.providers.map((p) => `${p.name} : ${p.unavailable || "OK"}`).join("\n"))}">${tr("{n}/{total} fournisseur(s)", { n: s.providers.length - off.length, total: s.providers.length })}</span>`;
  const gw = state.gw?.target ? `<span class="chip accent" title="${tr("Passerelle")}">⇄ ${esc(state.gw.target)}</span>` : "";

}

function render() {
  const mcp = state.menu === "mcp";
  if (state.menu === "llm" && !state.status?.prompt) state.tab = "prompt"; // rien d'autre sans prompt système
  const current = mcp ? state.mtab : state.tab;
  $("#menu").innerHTML = MENUS().map(([id, label, sub]) => `<button data-action="menu" data-menu="${id}" class="${id === state.menu ? "on" : ""}">${label}<small>${sub}</small></button>`).join("");
  if (state.menu === "gw") {
    $("#tabs").innerHTML = "";
    renderMeta();
    $("#view").innerHTML = viewGateway();
    return;
  }
  if (state.menu === "models") {
    $("#tabs").innerHTML = MODEL_TABS.map(([id, label]) => `<button data-action="modtab" data-tab="${id}" class="${id === state.modtab ? "on" : ""}">${label}</button>`).join("");
    renderMeta();
    $("#view").innerHTML = state.modtab === "paid" ? viewPaidModels() : viewFreeModels();
    return;
  }
  const busyTab = mcp ? state.mActive : state.active;
  $("#tabs").innerHTML = (mcp ? MCP_TABS : LLM_TABS.filter(([id]) => state.status?.prompt || id === "prompt")).map(([id, label]) =>
    `<button data-action="${mcp ? "mtab" : "tab"}" data-tab="${id}" class="${id === current ? "on" : ""}">${label}${id === "run" && busyTab ? ' <span class="spin"></span>' : ""}</button>`).join("");
  renderMeta();
  const focused = document.activeElement;
  const focusId = focused && focused.id && $("#view").contains(focused) ? focused.id : null;
  const caret = focusId && "selectionStart" in focused ? focused.selectionStart : null;

  const views = mcp
    ? { servers: viewServers, run: viewMRun, reports: viewMReports, cases: viewMCases, env: viewEnv }
    : { run: viewRun, reports: viewReports, cases: viewCases, prompt: viewPrompt };
  $("#view").innerHTML = (views[current] || Object.values(views)[0])();

  if (focusId) {
    const el = document.getElementById(focusId);
    if (el) { el.focus(); if (caret != null && el.setSelectionRange) try { el.setSelectionRange(caret, caret); } catch {} }
  }
}

function renderLayer() {
  let html = "";
  if (state.menu === "llm" && state.resultId && state.report) html = drawerResult();
  if (state.menu === "mcp" && state.mResultId && state.mReport) html = drawerMResult();
  if (state.menu === "mcp" && state.logFor) html = modalLog();
  if (state.editing) html = modalEditor();
  if (state.mEditing) html = modalMEditor();
  if (state.provDraft) html = modalProvider();
  if (state.keyDraft) html = modalKey();
  if (state.modal) html = state.modal;
  const scroll = $("#layer .panel")?.scrollTop ?? 0;
  $("#layer").innerHTML = html;
  const panel = $("#layer .panel");
  if (panel) panel.scrollTop = scroll;
}

function filteredCases() {
  const q = state.caseFilter.q.toLowerCase();
  return state.cases.filter((c) =>
    (!state.caseFilter.category || c.category === state.caseFilter.category) &&
    (!q || (c.id + " " + c.message + " " + (c.description || "")).toLowerCase().includes(q)));
}

function modelPicker(opts) {
  const tf = state.tierFilter;
  const groups = state.avail.filter((g) => !tf || providerInfo(g.name)?.tier === tf);
  return `
    <div class="seg" style="margin-bottom:10px">
      ${[["", tr("Tous")], ["free", tr("Gratuits")], ["paid", tr("Payants")]].map(([v, l]) => `<button type="button" class="${tf === v ? "on" : ""}" data-action="tierFilter" data-v="${v}">${l}</button>`).join("")}
    </div>
    ${groups.length ? `<ul class="checklist">${groups.map((g) => `
      <li><div class="group-h"><span>${esc(providerInfo(g.name)?.label || g.name)} ${tierChip(providerInfo(g.name)?.tier)}</span><span class="muted">${g.error ? `<span class="bad-t">${esc(g.error)}</span>` : tr("{n} modèle(s)", { n: g.models.length })}</span></div></li>
      ${g.models.map((m) => `<li><label><input type="checkbox" data-action="${opts.action}" data-name="${esc(m.key)}" ${opts.selected.has(m.key) ? "checked" : ""}>
        <span class="txt"><span class="strong mono">${esc(m.model)}</span>${m.details ? `<span class="msg">${esc(m.details)}</span>` : ""}</span>
        ${m.loaded ? `<span class="chip ok">${tr("en mémoire")}</span>` : ""}</label></li>`).join("")}`).join("")}</ul>`
      : `<p class="empty">${state.status?.ollama ? tr("Aucun modèle. Déclarer des fournisseurs et leurs modèles dans la config, ou {link}.", { link: `<button class="link" data-action="goModels">${tr("télécharger un modèle Ollama")}</button>` }) : tr("Aucun modèle. Déclarer des fournisseurs et leurs modèles dans la config.")}</p>`}`;
}

function viewRun() {
  const keys = new Set(availFlat().map((m) => m.key));
  const selM = [...state.selModels].filter((k) => keys.has(k));
  const selC = state.cases.filter((c) => state.selCases.includes(c.id));
  const calls = selM.length * selC.length * state.runs;
  const list = filteredCases();
  const cats = [...new Set([...(state.status?.prompt?.categories || []), ...state.cases.map((c) => c.category).filter(Boolean)])];
  const paid = selM.filter((k) => tierOfKey(k) === "paid").length;

  return `
  ${state.active ? activePanel() : ""}
  ${!state.active && state.lastFinished ? `<div class="card card-h" style="margin:0"><span>${tr("Campagne terminée.")}</span><button class="b" data-action="openReport" data-id="${esc(state.lastFinished)}">${tr("Voir le rapport")}</button></div>` : ""}
  <div class="grid2">
    <section class="card">
      <div class="card-h">
        <h2>${tr("Modèles")} <span class="muted">${selM.length}/${keys.size}</span></h2>
        <div class="btns"><button class="link" data-action="selModels" data-v="all">${tr("Tous")}</button><button class="link" data-action="selModels" data-v="none">${tr("Aucun")}</button><button class="link" data-action="refreshAvail">${tr("Actualiser")}</button></div>
      </div>
      ${modelPicker({ action: "toggleModel", selected: state.selModels })}
    </section>
    <section class="card">
      <div class="card-h">
        <h2>${tr("Cas de test")} <span class="muted">${selC.length}/${state.cases.length}</span></h2>
        <div class="btns">
          <button class="link" data-action="selCases" data-v="all">${tr("Tous")}</button>
          <button class="link" data-action="selCases" data-v="none">${tr("Aucun")}</button>
          <button class="link" data-action="selCases" data-v="invert">${tr("Inverser")}</button>
          <button class="link" data-action="tab" data-tab="cases">${tr("Gérer")}</button>
        </div>
      </div>
      <div class="row" style="margin-bottom:10px">
        <input type="search" id="caseSearch" class="grow" placeholder="${tr("Filtrer (id, message…)")}" value="${esc(state.caseFilter.q)}" data-action="caseSearch">
        <select id="caseCat" data-action="caseCat"><option value="">${tr("Toutes les catégories")}</option>${cats.map((c) => `<option ${state.caseFilter.category === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>
      </div>
      ${list.length ? `<ul class="checklist">${list.map((c) => `
        <li><label><input type="checkbox" data-action="toggleCase" data-id="${esc(c.id)}" ${state.selCases.includes(c.id) ? "checked" : ""}>
          <span class="txt"><span class="strong mono">${esc(c.id)}</span> ${catChip(c.category)}
          <span class="msg">${esc(c.message)}</span></span></label></li>`).join("")}</ul>`
        : `<p class="empty">${tr("Aucun cas ne correspond.")}</p>`}
    </section>
  </div>
  <section class="card launch">
    <label class="field grow">${tr("Nom du rapport (facultatif)")}<input type="text" id="runName" data-action="runName" value="${esc(state.runName)}" placeholder="${tr("ex. qwen vs llama, prompt v2.1")}"></label>
    <label class="field">${tr("Répétitions par cas")}<input type="number" id="runsInput" data-action="runsInput" min="1" max="10" value="${state.runs}" style="width:90px"></label>
    <label class="field" title="${tr("Appels simultanés vers les modèles distants (cloud). Les modèles locaux (Ollama, localhost) restent toujours l'un après l'autre. 1 = tout à la suite.")}">${tr("Parallélisme")}<input type="number" id="parallelInput" data-action="parallelInput" min="1" max="16" value="${state.parallel}" style="width:90px"></label>
    <div class="muted small">${tr("{m} modèle(s) × {c} cas × {r} = {calls} appel(s)", { m: selM.length, c: selC.length, r: state.runs, calls: `<b>${calls}</b>` })}${state.parallel > 1 ? ` · ${tr("jusqu'à {n} en parallèle (modèles locaux à la suite)", { n: state.parallel })}` : ""}${paid ? ` · <span class="warn-t">${tr("{n} modèle(s) payant(s)", { n: paid })}</span>` : ""}</div>
    <button class="b primary" data-action="launch" ${!calls || state.active ? "disabled" : ""}>${tr("Lancer la campagne")}</button>
  </section>`;
}

function activePanel() {
  const a = state.active;
  const pct = a.total ? (a.done / a.total) * 100 : 0;
  const recent = (state.activeReport?.results || []).slice(-8).reverse();
  return `
  <section class="card">
    <div class="card-h">
      <h2><span class="spin"></span> ${tr("Campagne en cours")}</h2>
      <div class="btns"><button class="b" data-action="openReport" data-id="${esc(a.reportId)}">${tr("Voir le rapport")}</button><button class="b danger" data-action="stopRun">${tr("Arrêter")}</button></div>
    </div>
    <div class="progress"><div style="width:${pct}%"></div></div>
    <p class="muted small">${tr("{done}/{total} appels", { done: a.done, total: a.total })} · ${a.phase === "loading" ? tr("préparation de {name}", { name: `<b>${esc(a.current || "")}</b>` }) : tr("en cours : {name}", { name: `<b>${esc(a.current || "")}</b>` })}</p>
    ${recent.length ? `<div class="table-wrap"><table><tbody>${recent.map((r) => `
      <tr><td><span class="pill ${r.status}">${RESULT_ICON[r.status]}</span></td><td class="mono">${esc(r.caseId)}</td><td>${esc(r.model)}</td>
      <td class="num">${fmt.s(r.latencyMs)}</td><td class="small muted">${esc(r.status === "pass" ? "" : r.error || r.failures.join(" ; "))}</td></tr>`).join("")}</tbody></table></div>` : ""}
  </section>`;
}

function viewReports() {
  if (state.reportId && state.report) return viewReport();
  if (!state.reports.length) return `<section class="card"><p class="empty">${tr("Aucun rapport. Lancez une campagne depuis l'onglet « Lancer ».")}</p></section>`;
  return `
  <section class="card">
    <div class="card-h"><h2>${tr("Rapports")} <span class="muted">${state.reports.length}</span></h2></div>
    <div class="table-wrap"><table>
      <thead><tr><th>${tr("Date")}</th><th>${tr("Nom")}</th><th>${tr("Statut")}</th><th>${tr("Score par modèle")}</th><th class="num">${tr("Cas")}</th><th></th></tr></thead>
      <tbody>${state.reports.map((r) => `
        <tr class="clickable" data-action="openReport" data-id="${esc(r.id)}">
          <td style="white-space:nowrap">${fmt.date(r.date)}</td>
          <td>${esc(r.name || "")}<div class="muted small">${r.promptVersion ? `prompt v${esc(r.promptVersion)} · ` : ""}${tr("{n} run(s)", { n: r.runs })}</div></td>
          <td>${statusChip(r.status)}</td>
          <td>${r.summary.map((s) => `<div class="small"><span class="mono">${esc(s.model)}</span> <b>${fmt.pct(s.passed, s.total)}</b> <span class="muted">(${s.passed}/${s.total})</span></div>`).join("")}</td>
          <td class="num">${r.caseCount}</td>
          <td class="num"><button class="icon" title="${tr("Supprimer")}" data-action="deleteReport" data-id="${esc(r.id)}">🗑</button></td>
        </tr>`).join("")}</tbody>
    </table></div>
  </section>`;
}

function failingResults(r) { return r.results.filter((x) => x.status !== "pass"); }

  const r = state.report;
  const failing = failingResults(r);
  const running = r.status === "running";
  const replayingAll = state.replaying.size > 0;

  <section class="card">

      <div>
        <button class="link" data-action="closeReport">← ${tr("Tous les rapports")}</button>

        <div class="muted small">${fmt.date(r.date)} · ${r.promptVersion ? `prompt v${esc(r.promptVersion)} · ` : ""}${tr("{c} cas × {r} run(s)", { c: r.cases.length, r: r.runs })}</div>

          <td><div class="score"><b>${fmt.pct(s.passed, s.total)}</b><div class="progress"><div style="width:${s.total ? (s.passed / s.total) * 100 : 0}%"></div></div></div><div class="muted small">${s.passed}/${s.total}</div></td>
          <td class="num">${fmt.pct(s.jsonOk, s.total)}</td>

      <tbody>${cases.map((c) => `

          ${r.models.map((m) => {
            const rs = r.results.filter((x) => x.caseId === c.id && x.model === m.name);
            if (!rs.length) return `<td class="muted">${running ? "…" : "–"}</td>`;
            return `<td>${rs.map((x) => `<button class="pill ${x.status} ${state.replaying.has(x.id) ? "busy" : ""} ${state.resultId === x.id ? "sel" : ""}" data-action="openResult" data-id="${esc(x.id)}" title="${esc((x.status === "pass" ? tr("réussi") : x.error || x.failures.join(" ; ")) + (x.contextTruncated ? " — ⚠ " + tr("contexte probablement tronqué") : ""))}">${state.replaying.has(x.id) ? '<span class="spin"></span>' : RESULT_ICON[x.status]} ${fmt.s(x.latencyMs)}${x.previous?.length ? " ↻" : ""}${x.contextTruncated ? " ⚠" : ""}</button>`).join("")}
              ${rs.filter((x) => x.status !== "pass").map((x) => `<div class="small bad-t">${esc(x.error ? tr("erreur d'appel") : x.failures.join(" ; "))}</div>`).slice(0, 1).join("")}</td>`;
          }).join("")}
        </tr>`).join("")}</tbody>
    </table></div>` : `<p class="empty">${state.onlyFailures ? tr("Aucun échec 🎉") : tr("Aucun résultat.")}</p>`}
  </section>`;
}

// ---- Comparaison des réponses entre modèles ----
/** JSON à clés triées (l'ordre des clés ne doit pas créer de différence). */
const sortKeys = (v) => (Array.isArray(v) ? v.map(sortKeys) : v && typeof v === "object" ? Object.fromEntries(Object.keys(v).sort().map((k) => [k, sortKeys(v[k])])) : v);
const answerText = (x) => (x.parsed !== undefined ? JSON.stringify(sortKeys(x.parsed), null, 2) : prettyJson(x.raw ?? ""));

/** Feuilles d'un JSON : chemin → valeur (texte JSON). */
function leaves(v, path = "", out = {}) {
  if (v && typeof v === "object" && (Array.isArray(v) ? v.length : Object.keys(v).length)) {
    for (const [k, w] of Object.entries(v)) leaves(w, Array.isArray(v) ? `${path}[${k}]` : path ? `${path}.${k}` : k, out);
  } else out[path || tr("(racine)")] = JSON.stringify(v);
  return out;
}

/** Diff ligne à ligne (plus longue sous-séquence commune) : [{ t: " " | "+" | "-", line }]. */
function lineDiff(a, b) {
  const A = a.split("\n"), B = b.split("\n");
  if (A.length * B.length > 4e6) return [...A.map((line) => ({ t: "-", line })), ...B.map((line) => ({ t: "+", line }))];
  const L = Array.from({ length: A.length + 1 }, () => new Uint32Array(B.length + 1));
  for (let i = A.length - 1; i >= 0; i--) for (let j = B.length - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = [];
  let i = 0, j = 0;
  while (i < A.length && j < B.length) {
    if (A[i] === B[j]) { out.push({ t: " ", line: A[i] }); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) out.push({ t: "-", line: A[i++] });
    else out.push({ t: "+", line: B[j++] });
  }
  while (i < A.length) out.push({ t: "-", line: A[i++] });
  while (j < B.length) out.push({ t: "+", line: B[j++] });
  return out;
}

/** Lignes communes repliées au-delà de 3 lignes de contexte autour des changements. */
function renderDiff(d) {
  const near = d.map((_, k) => d.slice(Math.max(0, k - 3), k + 4).some((x) => x.t !== " "));
  let html = "", skipped = 0;
  const flush = () => { if (skipped) html += `<div class="skip">… ${skipped > 1 ? tr("{n} lignes identiques", { n: skipped }) : tr("{n} ligne identique", { n: skipped })}</div>`; skipped = 0; };
  d.forEach((x, k) => {
    if (x.t === " " && !near[k]) { skipped++; return; }
    flush();
    html += `<div class="${x.t === "+" ? "add" : x.t === "-" ? "del" : ""}">${x.t === " " ? "  " : x.t + " "}${esc(x.line)}</div>`;
  });
  flush();
  return `<div class="diff">${html}</div>`;
}

function modalDiff() {
  const r = state.report;
  const c = r.cases.find((y) => y.id === state.diffCase);
  // Dernière réponse de chaque modèle sur ce cas.
  const byModel = r.models.map((m) => r.results.filter((x) => x.caseId === state.diffCase && x.model === m.name && x.raw != null).sort((a, b) => a.at.localeCompare(b.at)).at(-1)).filter(Boolean);
  if (byModel.length < 2) return "";
  const ref = byModel.find((x) => x.model === state.diffRef) || byModel[0];
  const refText = answerText(ref);

  // Champs JSON qui diffèrent entre au moins deux modèles.
  const json = byModel.filter((x) => x.parsed !== undefined);
  const leafs = json.map((x) => leaves(x.parsed));
  const paths = [...new Set(leafs.flatMap((l) => Object.keys(l)))].sort();
  const differing = paths.filter((p) => new Set(leafs.map((l) => l[p] ?? "∅")).size > 1);

  const head = (x) => `<span class="pill ${x.status}">${RESULT_ICON[x.status]}</span> <span class="mono strong">${esc(x.model)}</span> <span class="muted small">${fmt.s(x.latencyMs)}</span>`;
  return `<div class="overlay center" data-action="closeModal"><div class="panel" data-stop style="width:min(1200px,100%)">
    <div class="panel-h"><div><h2>${tr("Comparer les réponses")} · <span class="mono">${esc(state.diffCase)}</span></h2>${c ? `<div class="muted small">${esc(c.message)}</div>` : ""}</div><button class="icon" data-action="closeModal">✕</button></div>

    <div class="row" style="align-items:center">
      <label class="field">${tr("Référence")}
        <select data-action="diffRef">${byModel.map((x) => `<option value="${esc(x.model)}" ${x === ref ? "selected" : ""}>${esc(x.model)}</option>`).join("")}</select></label>
      <span class="muted small" style="align-self:center">${tr("Dernière réponse de chaque modèle. JSON réindenté, clés triées : seules les vraies différences ressortent.")}</span>
    </div>

    ${json.length >= 2 ? `<div class="section"><h3>${tr("Champs qui diffèrent")} <span class="muted">${differing.length}/${paths.length}</span></h3>
      ${differing.length ? `<div class="table-wrap"><table class="fields small">
        <thead><tr><th>${tr("Champ")}</th>${json.map((x) => `<th class="mono">${esc(x.model)}${x === ref ? ` <span class="chip accent">${tr("réf.")}</span>` : ""}</th>`).join("")}</tr></thead>
        <tbody>${differing.map((p) => {
          const refVal = leaves(ref.parsed ?? {})[p];
          return `<tr><td class="mono">${esc(p)}</td>${json.map((x, k) => {
            const v = leafs[k][p];
            return `<td class="mono ${x !== ref && v !== refVal ? "differs" : ""}">${v === undefined ? `<span class="muted">${tr("absent")}</span>` : esc(v)}</td>`;
          }).join("")}</tr>`;
        }).join("")}</tbody></table></div>` : `<p class="ok-t small" style="margin:0">${tr("Mêmes valeurs dans tous les modèles.")}</p>`}
      ${json.length < byModel.length ? `<p class="muted small" style="margin:0">${tr("Sans JSON valide (non comparés champ par champ) : {list}.", { list: byModel.filter((x) => x.parsed === undefined).map((x) => `<span class="mono">${esc(x.model)}</span>`).join(", ") })}</p>` : ""}
    </div>` : ""}

    <div class="section"><h3>${tr("Référence")}</h3><div>${head(ref)}</div><pre>${esc(refText)}</pre></div>

    ${byModel.filter((x) => x !== ref).map((x) => {
      const text = answerText(x);
      const d = lineDiff(refText, text);
      const added = d.filter((y) => y.t === "+").length, removed = d.filter((y) => y.t === "-").length;
      return `<div class="section"><h3>${tr("Différences avec la référence")}</h3>
        <div>${head(x)} ${added || removed ? `<span class="small"><span class="ok-t">+${added}</span> <span class="bad-t">−${removed}</span> ${tr("lignes")}</span>` : `<span class="chip ok">${tr("identique")}</span>`}</div>
        ${added || removed ? renderDiff(d) : ""}</div>`;
    }).join("")}

/** Champ "tuples" : [{adult: 2, child: 0}, …] ↔ "2+0, …" selon les clés du champ. */
const tuplesToText = (v, keys) => (Array.isArray(v) ? v.map((r) => keys.map((k) => r?.[k] ?? 0).join("+")).join(", ") : "");
const textToTuples = (t, keys) => String(t).split(",").map((s) => s.trim()).filter(Boolean).map((s) => {
  const parts = s.split("+").map((n) => Number(n.trim()) || 0);
  return Object.fromEntries(keys.map((k, i) => [k, parts[i] ?? 0]));
});

function fieldInput(f, v, path) {
  if (f.kind === "select") {
    const opts = f.options.includes(v) || v == null || v === "" ? f.options : [v, ...f.options];
    return `<select data-path="${path}">${opts.map((o) => `<option ${o === v ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  }
  if (f.kind === "tuples") return `<input type="text" data-path="${path}" data-kind="tuples" data-keys="${esc((f.keys || ["a", "b"]).join(","))}" value="${esc(tuplesToText(v, f.keys || ["a", "b"]))}" placeholder="${esc(f.placeholder || "")}">`;
  if (f.kind === "number") return `<input type="number" data-path="${path}" data-kind="number" value="${esc(v ?? "")}" placeholder="${esc(f.placeholder || "")}" style="width:110px">`;
  if (f.kind === "boolean") return `<input type="checkbox" data-path="${path}" ${v ? "checked" : ""}>`;
  return `<input type="text" data-path="${path}" value="${esc(v ?? "")}" placeholder="${esc(f.placeholder || "")}">`;
}

function checkFieldInput(check, f, i) { return fieldInput(f, check[f.name], `checks.${i}.${f.name}`); }

/** Recopie les champs du formulaire dans le brouillon (avant un re-rendu ou l'enregistrement). */
function readEditor() {
  const d = (state.editing || state.mEditing).draft;
  document.querySelectorAll("#layer [data-path]").forEach((el) => {
    const keys = el.dataset.path.split(".");
    let v = el.type === "checkbox" ? el.checked : el.value;
    if (el.dataset.kind === "tuples") v = textToTuples(v, el.dataset.keys.split(","));
    if (el.dataset.kind === "number") v = v === "" ? "" : Number(v);
    let o = d;
    keys.slice(0, -1).forEach((k) => { o = o[k]; });
    o[keys.at(-1)] = v;
  });
}

const PHASES = {
  copying: ["ph-busy", tr("copie des sources"), true],
  installing: ["ph-busy", tr("installation"), true],
  building: ["ph-busy", tr("build"), true],
  starting: ["ph-busy", tr("démarrage"), true],
  running: ["ph-running", tr("actif"), false],
  stopped: ["ph-stopped", tr("arrêté"), false],
  failed: ["ph-failed", tr("échec"), false],
};
const phaseChip = (p) => { const [cls, label, spin] = PHASES[p] || ["", p, false]; return `<span class="chip ${cls}">${spin ? '<span class="spin"></span> ' : ""}${esc(label)}</span>`; };
const isBusyPhase = (p) => PHASES[p]?.[2];
const kindChip = (k) => `<span class="chip k-${esc(k)}">${esc({ error: tr("erreur") }[k] || k)}</span>`;
const serverName = (id) => state.servers.find((s) => s.id === id)?.name || state.mReport?.servers?.find((s) => s.id === id)?.name || id;

async function loadMStatus() { state.mStatus = state.status?.server || null; }
async function loadServers() { state.servers = await api("/api/server/servers"); }
async function loadMCases() {
  state.mCases = await api("/api/server/cases");
  if (state.mSelCases === null) state.mSelCases = state.mCases.map((c) => c.id);
}
async function loadMReports() { state.mReports = await api("/api/server/reports"); }
async function loadMReport(id) { state.mReport = await api("/api/server/reports/" + id); }
async function loadLog() { if (state.logFor) state.logText = (await api(`/api/server/servers/${state.logFor}/log`)).log; }

async function mcpTick() {
  if (state.menu !== "mcp" && !state.mActive && !state.servers.some((s) => isBusyPhase(s.phase))) return;
  const wasActive = state.mActive;
  state.mActive = await api("/api/server/runs/active");
  if (state.mActive) {
    const rep = await api("/api/server/reports/" + state.mActive.reportId);
    state.mActiveReport = rep;
    if (state.mReportId === state.mActive.reportId) state.mReport = rep;
  }
  if (wasActive && !state.mActive) {
    state.mLastFinished = wasActive.reportId;
    state.mActiveReport = null;
    toast(tr("Campagne serveurs terminée"));
    await loadMReports();
    if (state.mReportId === wasActive.reportId) await loadMReport(state.mReportId);
  }
  const before = new Map(state.servers.map((s) => [s.id, s.phase]));
  await loadServers();
  for (const s of state.servers) {
    const prev = before.get(s.id);
    if (prev && prev !== s.phase && s.phase === "running") toast(tr("{name} est prêt sur le port {port}", { name: s.name, port: s.port }));
    if (prev && prev !== s.phase && s.phase === "failed") toast(`${s.name} : ${s.error || tr("échec")}`, true);
  }
  if (state.logFor) await loadLog();
}

const ADD_PAID = "__addPaid", ADD_FREE = "__addFree";

/**
 * Choix d'un modèle en liste déroulante ancrée sous le champ (la liste native de macOS s'ouvre
 * par-dessus). Ne propose que les modèles de l'offre filtrée (sauf `allTiers`) ; la valeur est dans
 * l'input caché #id, et `action` reçoit le modèle choisi.
 */
function modelDropdown(id, value, opts = {}) {
  const tf = opts.allTiers ? "" : state.tierFilter;
  const tierLabel = { free: tr("gratuit"), paid: tr("payant") };
  const groups = state.avail.filter((g) => !tf || providerInfo(g.name)?.tier === tf);
  const cur = groups.some((g) => g.models.some((m) => m.key === value)) ? value : "";
  const label = (g) => (providerInfo(g.name)?.label || g.name) + ` · ${tierLabel[providerInfo(g.name)?.tier] || ""}`;
  const placeholder = tf === "free" ? tr("— choisir un modèle gratuit —") : tf === "paid" ? tr("— choisir un modèle payant —") : tr("— choisir —");
  // Aucun modèle utilisable dans une offre : proposer d'en ajouter un (menu Modèles).
  const none = (tier) => opts.offerAdd && (!tf || tf === tier) && !availFlat().some((m) => m.tier === tier);
  const add = [none("free") && [ADD_FREE, tr("↓ Télécharger un modèle gratuit…")], none("paid") && [ADD_PAID, tr("+ Ajouter un modèle payant…")]].filter(Boolean);
  return `<div class="picker" data-picker data-on-pick="${esc(opts.action || "")}">
    <input type="hidden" id="${id}" value="${esc(cur)}">
    <button type="button" class="picker-btn" data-action="pickerToggle"><span class="v ${cur ? "mono" : "muted"}">${esc(cur || placeholder)}</span><span class="muted">▾</span></button>
    <div class="picker-pop" hidden>
      <input type="search" placeholder="${tr("Filtrer…")}" data-action="pickerFilter" autocomplete="off">
      <div class="picker-list">
        ${groups.map((g) => `<div data-group><div class="picker-g">${esc(label(g))}${g.models.length ? "" : ` — ${esc(g.error || tr("aucun modèle"))}`}</div>
          ${g.models.map((m) => `<button type="button" class="picker-o ${m.key === cur ? "on" : ""}" data-action="pickerPick" data-v="${esc(m.key)}">${esc(m.model)}${m.details ? ` <span class="d">· ${esc(m.details)}</span>` : ""}</button>`).join("")}</div>`).join("")}
        ${add.map(([v, l]) => `<button type="button" class="picker-o" data-action="pickerPick" data-v="${v}" data-add>${l}</button>`).join("")}
        ${!groups.some((g) => g.models.length) && !add.length ? `<div class="muted small" style="padding:8px">${tf === "free" ? tr("Aucun modèle gratuit disponible.") : tf === "paid" ? tr("Aucun modèle payant disponible.") : tr("Aucun modèle disponible.")}</div>` : ""}
      </div>
    </div>
  </div>`;
}

async function loadPromptSource() {
  state.promptSrc = await api("/api/prompt/source");
  state.promptCur = state.promptSrc.source ? await api("/api/prompt/system").catch((e) => ({ error: e.message })) : null;

async function loadPromptCandidates() {
  state.promptCands = "loading"; render();
  state.promptCands = await api("/api/prompt/candidates").catch((e) => { toast(e.message, true); return []; });

function sourceLabel(src) {
  if (!src) return "–";
  if (src.kind === "module") return `<span class="mono">${esc(src.module)}</span> → <span class="mono strong">${esc(src.export)}</span>`;
  if (src.kind === "file") return tr("fichier {file}", { file: `<span class="mono">${esc(src.file)}</span>` });
  return `${tr("écrit directement dans {file}", { file: '<span class="mono">bench.config.ts</span>' })}${src.kind === "code" ? ` (${tr("fonction")})` : ""}`;
}

function viewPrompt() {
  const ps = state.promptSrc, cur = state.promptCur;
  if (!ps) return `<section class="card"><p class="empty"><span class="spin"></span> ${tr("Chargement…")}</p></section>`;
  const src = ps.source;
  const choosing = !src || state.promptChanging;
  return `
  ${src ? `<section class="card">
    <div class="card-h"><h2>${tr("Prompt système")}</h2>
      <div class="btns">
        ${cur?.text ? `<button class="b" data-action="promptToggleText">${state.promptShowText ? tr("Masquer le texte") : tr("Afficher le texte")}</button>` : ""}
        <button class="b" data-action="promptChange">${state.promptChanging ? tr("Annuler") : tr("Changer de prompt")}</button>
      </div></div>
    <div class="row" style="gap:6px 20px;align-items:baseline">
      <div><span class="muted small">${tr("Source")}</span><div>${sourceLabel(src)}</div></div>

      ${tr("Aucun prompt n'est encore configuré : choisir l'un des prompts trouvés dans le projet, ou le définir à la main.")}</p>
  </section>`}
  ${choosing ? viewPromptCandidates() + viewPromptManual() : ""}`;
}

function viewPromptCandidates() {
  const c = state.promptCands;
  const list = Array.isArray(c) ? c : [];
  const best = list.find((x) => x.ok);
  const src = state.promptSrc?.source;
  const isCurrent = (x) => src && ((src.kind === "module" && x.kind === "module" && src.export === x.export && src.module.endsWith(x.file)) || (src.kind === "file" && x.kind === "file" && src.file.endsWith(x.file)));
  return `

async function loadEnv() {
  state.envInfo = await api("/api/server/env");
  state.envDraft = { ...state.envInfo.names };
}

function viewEnv() {
  const i = state.envInfo, d = state.envDraft;
  if (!i || !d) return `<section class="card"><p class="empty"><span class="spin"></span> ${tr("Chargement…")}</p></section>`;
  const changed = ENV_ROLES.some(({ role }) => (d[role] || "") !== (i.names[role] || ""));
  const isDefault = ENV_ROLES.every(({ role }) => (d[role] || "") === i.defaults[role]);
  const known = [...new Set([...i.inEnvFiles, ...i.inCode])].sort();
  const found = (n) => {
    if (!n) return `<span class="muted small">${tr("non utilisée")}</span>`;
    const f = i.inEnvFiles.includes(n), c = i.inCode.includes(n);
    if (f || c) return `${f ? `<span class="chip ok">${esc(i.envFile)} ✓</span>` : ""} ${c ? `<span class="chip ok">${tr("lue par le code")} ✓</span>` : ""}`;
    return `<span class="chip warn" title="${tr("Ni dans les fichiers d'environnement, ni dans le code (src, app, lib, server)")}">${tr("introuvable dans le projet")}</span>`;
  };
  const v = (r) => d[r] || i.defaults[r];
  return `
  <section class="card">
    <div class="card-h"><h2>${tr("Variables d'environnement du serveur")}</h2>${changed ? `<span class="chip warn">${tr("modifications non enregistrées")}</span>` : ""}</div>
    <p class="small" style="margin:0 0 12px">${tr("Pour chaque serveur, le bench copie le projet, écrit ces variables dans le {file} de la copie, puis le lance.", { file: `<span class="mono">${esc(i.envFile)}</span>` })}

    <div class="table-wrap"><table>
      <thead><tr><th>${tr("Rôle")}</th><th>${tr("Nom de la variable")}</th><th>${tr("Dans le projet")}</th><th>${tr("Valeur écrite par le bench")}</th></tr></thead>
      <tbody>${ENV_ROLES.map((r) => `<tr>
        <td><div class="strong">${r.title}${r.required ? "" : ` <span class="muted small">${tr("(facultatif)")}</span>`}</div><div class="muted small">${r.what}</div></td>
        <td><input type="text" id="env-${r.role}" class="mono" data-action="envName" data-role="${r.role}" value="${esc(d[r.role] || "")}" list="envNames" placeholder="${r.required ? esc(i.defaults[r.role]) : tr("aucune")}" autocomplete="off" spellcheck="false" style="width:210px"></td>
        <td>${found(d[r.role])}</td>
        <td class="small">${r.value(i)}</td>
      </tr>`).join("")}</tbody>
    </table></div>
    <div class="btns" style="margin-top:14px">
      <button class="b primary" data-action="saveEnv" ${changed && !state.savingEnv ? "" : "disabled"}>${state.savingEnv ? '<span class="spin"></span> ' : ""}${tr("Enregistrer")}</button>
      <button class="b" data-action="resetEnv" ${changed ? "" : "disabled"}>${tr("Annuler les modifications")}</button>
      <button class="b" data-action="defaultEnv" ${isDefault ? "disabled" : ""} title="${esc(Object.values(i.defaults).join(", "))}">${tr("Valeurs par défaut")}</button>
      <span class="muted small" style="margin-left:auto">${tr("Enregistré dans {file}", { file: `<span class="mono">${esc(i.configFile)}</span>` })} (<span class="mono">server.env</span>)</span>
    </div>
  </section>

  <section class="card">
    <div class="card-h"><h2>${tr("Guide")}</h2></div>
    <div class="section">

      <ol class="small" style="margin:0;padding-left:20px;display:grid;gap:4px">

        <li>${tr("Dans ce {file}, il remplace {vars} par les valeurs du modèle choisi. Les autres variables ne changent pas.", { file: `<span class="mono">${esc(i.envFile)}</span>`, vars: `<span class="mono">${ENV_ROLES.map((r) => d[r.role]).filter(Boolean).map(esc).join("</span>, <span class=\"mono\">")}</span>` })}</li>

    <div class="section" style="margin-top:14px">
      <h3>${tr("Après un changement")}</h3>
      <ul class="small" style="margin:0;padding-left:20px;display:grid;gap:4px">
        <li>${tr("Il s'applique tout de suite aux {b}, sans redémarrer le bench.", { b: `<b>${tr("nouveaux serveurs")}</b>` })}</li>
        <li>${tr("Les {b} gardent les anciens noms dans leur {file} : les recréer, ou utiliser « changer de modèle » (✎ dans la liste des serveurs) pour réécrire leurs variables.", { b: `<b>${tr("serveurs existants")}</b>`, file: `<span class="mono">${esc(i.envFile)}</span>` })}</li>
        <li>${tr("Le bloc {block} de la config est réécrit. Le reste du fichier ne change pas.", { block: '<span class="mono">server.env</span>' })}</li>

function filteredMCases() {
  const q = state.mFilter.q.toLowerCase();
  return state.mCases.filter((c) =>
    (!state.mFilter.category || c.category === state.mFilter.category) &&
    (!q || (c.id + " " + c.steps.map((s) => s.message).join(" ") + " " + (c.description || "")).toLowerCase().includes(q)));
}

function viewMRun() {
  const running = state.servers.filter((s) => s.phase === "running");
  const selS = running.filter((s) => state.selServers.has(s.id));
  const selC = state.mCases.filter((c) => state.mSelCases.includes(c.id));
  const requests = selS.length * selC.reduce((a, c) => a + c.steps.length, 0) * state.mRuns;
  const list = filteredMCases();
  const cats = [...new Set([...(state.mStatus?.categories || []), ...state.mCases.map((c) => c.category).filter(Boolean)])];

  return `
  ${state.mActive ? mActivePanel() : ""}
  ${!state.mActive && state.mLastFinished ? `<div class="card card-h" style="margin:0"><span>${tr("Campagne terminée.")}</span><button class="b" data-action="openMReport" data-id="${esc(state.mLastFinished)}">${tr("Voir le rapport")}</button></div>` : ""}
  <div class="grid2">
    <section class="card">
      <div class="card-h">
        <h2>${tr("Serveurs")} <span class="muted">${tr("{n}/{total} actif(s)", { n: selS.length, total: running.length })}</span></h2>
        <div class="btns"><button class="link" data-action="selServers" data-v="all">${tr("Tous")}</button><button class="link" data-action="selServers" data-v="none">${tr("Aucun")}</button><button class="link" data-action="mtab" data-tab="servers">${tr("Gérer")}</button></div>
      </div>
      ${state.servers.length ? `<ul class="checklist">${state.servers.map((s) => {
        const live = s.phase === "running";
        return `<li><label style="${live ? "" : "cursor:default;opacity:.6"}"><input type="checkbox" data-action="toggleServer" data-id="${esc(s.id)}" ${live ? "" : "disabled"} ${live && state.selServers.has(s.id) ? "checked" : ""}>
          <span class="txt"><span class="strong">${esc(s.name)}</span>
          <span class="msg mono">${esc(s.model)} · :${s.port}</span></span>
          ${providerChip(s.provider)} ${live ? "" : phaseChip(s.phase)}</label></li>`;
      }).join("")}</ul>`
        : `<p class="empty">${tr("Aucun serveur.")}<br><button class="link" data-action="mtab" data-tab="servers">${tr("Créer un serveur")}</button></p>`}
      ${state.servers.length && !running.length ? `<p class="muted small">${tr("Démarrez au moins un serveur dans l'onglet « Serveurs ».")}</p>` : ""}
    </section>
    <section class="card">
      <div class="card-h">
        <h2>${tr("Cas de test")} <span class="muted">${selC.length}/${state.mCases.length}</span></h2>
        <div class="btns">
          <button class="link" data-action="mSelCases" data-v="all">${tr("Tous")}</button>
          <button class="link" data-action="mSelCases" data-v="none">${tr("Aucun")}</button>
          <button class="link" data-action="mSelCases" data-v="invert">${tr("Inverser")}</button>
          <button class="link" data-action="mtab" data-tab="cases">${tr("Gérer")}</button>
        </div>
      </div>
      <div class="row" style="margin-bottom:10px">
        <input type="search" id="mCaseSearch" class="grow" placeholder="${tr("Filtrer (id, message…)")}" value="${esc(state.mFilter.q)}" data-action="mCaseSearch">
        <select id="mCaseCat" data-action="mCaseCat"><option value="">${tr("Toutes les catégories")}</option>${cats.map((c) => `<option ${state.mFilter.category === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>
      </div>
      ${list.length ? `<ul class="checklist">${list.map((c) => `
        <li><label><input type="checkbox" data-action="toggleMCase" data-id="${esc(c.id)}" ${state.mSelCases.includes(c.id) ? "checked" : ""}>
          <span class="txt"><span class="strong mono">${esc(c.id)}</span> ${c.category ? `<span class="chip">${esc(c.category)}</span>` : ""} ${c.steps.length > 1 ? `<span class="chip accent">${tr("{n} tours", { n: c.steps.length })}</span>` : ""}
          <span class="msg">${esc(c.steps.map((s) => s.message).join(" → "))}</span></span></label></li>`).join("")}</ul>`
        : `<p class="empty">${tr("Aucun cas ne correspond.")}</p>`}
    </section>
  </div>
  <section class="card launch">
    <label class="field grow">${tr("Nom du rapport (facultatif)")}<input type="text" id="mRunName" data-action="mRunName" value="${esc(state.mRunName)}" placeholder="${tr("ex. luna vs qwen, de bout en bout")}"></label>
    <label class="field">${tr("Répétitions par cas")}<input type="number" id="mRunsInput" data-action="mRunsInput" min="1" max="10" value="${state.mRuns}" style="width:90px"></label>
    <label class="field" title="${tr("Serveurs testés en même temps s'ils utilisent un modèle distant (cloud). Les cas d'un même serveur, et les serveurs sur modèle local, restent l'un après l'autre. 1 = tout à la suite.")}">${tr("Serveurs en parallèle")}<input type="number" id="mParallelInput" data-action="mParallelInput" min="1" max="16" value="${state.mParallel}" style="width:90px"></label>
    <div class="muted small">${tr("{s} serveur(s) × {c} cas × {r} = {n} requête(s)", { s: selS.length, c: selC.length, r: state.mRuns, n: `<b>${requests}</b>` })}${state.mParallel > 1 ? ` · ${tr("jusqu'à {n} serveurs en parallèle (modèle local : à la suite)", { n: state.mParallel })}` : ""} <span class="mono">${esc(state.mStatus?.chatPath || "")}</span></div>
    <button class="b primary" data-action="mLaunch" ${!requests || state.mActive ? "disabled" : ""}>${tr("Lancer la campagne")}</button>
  </section>`;
}

function mActivePanel() {
  const a = state.mActive;
  const pct = a.total ? (a.done / a.total) * 100 : 0;
  const recent = (state.mActiveReport?.results || []).slice(-8).reverse();
  return `
  <section class="card">
    <div class="card-h">
      <h2><span class="spin"></span> ${tr("Campagne serveurs en cours")}</h2>
      <div class="btns"><button class="b" data-action="openMReport" data-id="${esc(a.reportId)}">${tr("Voir le rapport")}</button><button class="b danger" data-action="mStopRun">${tr("Arrêter")}</button></div>
    </div>
    <div class="progress"><div style="width:${pct}%"></div></div>
    <p class="muted small">${tr("{done}/{total} cas", { done: a.done, total: a.total })} · ${tr("en cours : {name}", { name: `<b>${esc((a.current || "").split(", ").filter(Boolean).map(serverName).join(", "))}</b>` })}</p>
    ${recent.length ? `<div class="table-wrap"><table><tbody>${recent.map((r) => `
      <tr><td><span class="pill ${r.status}">${RESULT_ICON[r.status]}</span></td><td class="mono">${esc(r.caseId)}</td><td>${esc(serverName(r.serverId))}</td>
      <td class="num">${fmt.s(r.latencyMs)}</td><td class="small muted">${esc(r.failures.join(" ; "))}</td></tr>`).join("")}</tbody></table></div>` : ""}
  </section>`;
}

function viewMReports() {
  if (state.mReportId && state.mReport) return viewMReport();
  if (!state.mReports.length) return `<section class="card"><p class="empty">${tr("Aucun rapport. Lancez une campagne depuis l'onglet « Lancer ».")}</p></section>`;
  return `
  <section class="card">
    <div class="card-h"><h2>${tr("Rapports serveurs")} <span class="muted">${state.mReports.length}</span></h2></div>
    <div class="table-wrap"><table>
      <thead><tr><th>${tr("Date")}</th><th>${tr("Nom")}</th><th>${tr("Statut")}</th><th>${tr("Score par serveur")}</th><th class="num">${tr("Cas")}</th><th></th></tr></thead>
      <tbody>${state.mReports.map((r) => `
        <tr class="clickable" data-action="openMReport" data-id="${esc(r.id)}">
          <td style="white-space:nowrap">${fmt.date(r.date)}</td>
          <td>${esc(r.name || "")}<div class="muted small">${tr("{n} run(s)", { n: r.runs })}</div></td>
          <td>${statusChip(r.status)}</td>
          <td>${r.summary.map((s) => `<div class="small">${esc(s.name)} <span class="mono muted">${esc(s.model)}</span> <b>${fmt.pct(s.passed, s.total)}</b> <span class="muted">(${s.passed}/${s.total})</span></div>`).join("")}</td>
          <td class="num">${r.caseCount}</td>
          <td class="num"><button class="icon" title="${tr("Supprimer")}" data-action="deleteMReport" data-id="${esc(r.id)}">🗑</button></td>
        </tr>`).join("")}</tbody>
    </table></div>
  </section>`;
}

function viewMReport() {
  const r = state.mReport;
  const running = r.status === "running";
  const failing = r.results.filter((x) => x.status !== "pass");
  const cases = state.mOnlyFailures ? r.cases.filter((c) => r.results.some((x) => x.caseId === c.id && x.status !== "pass")) : r.cases;
  return `
  <section class="card">
    <div class="card-h">
      <div>
        <button class="link" data-action="closeMReport">← ${tr("Tous les rapports")}</button>
        <h2 style="margin-top:6px">${esc(r.name || tr("Rapport du {date}", { date: fmt.date(r.date) }))} ${statusChip(r.status)}</h2>
        <div class="muted small">${fmt.date(r.date)} · ${tr("{c} cas × {r} run(s)", { c: r.cases.length, r: r.runs })}</div>
      </div>
      <div class="btns">
        <button class="b primary" data-action="mReplayFailures" ${!failing.length || running || state.mReplaying.size || state.mActive ? "disabled" : ""}>${state.mReplaying.size ? '<span class="spin"></span> ' : ""}${tr("Rejouer les échecs ({n})", { n: failing.length })}</button>
        <button class="b" data-action="downloadMReport">${tr("Télécharger JSON")}</button>
        <button class="b danger" data-action="deleteMReport" data-id="${esc(r.id)}" ${running ? "disabled" : ""}>${tr("Supprimer")}</button>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="card-h"><h3>${tr("Synthèse par serveur")}</h3><span class="muted small">${tr("latences par requête (étapes en erreur exclues)")}</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th>${tr("Serveur")}</th><th>${tr("Score")}</th><th class="num">${tr("Vérifs OK")}</th><th class="num">${tr("Échecs")}</th><th class="num">${tr("Erreurs")}</th><th class="num">${tr("Erreurs techniques")}</th>
        <th class="num">${tr("Latence moy.")}</th><th class="num">${tr("Médiane")}</th><th class="num">${tr("Max")}</th>
        <th class="num" title="${tr("Appels au modèle faits par le serveur")}">${tr("Appels LLM")}</th><th class="num">${tr("Latence LLM moy.")}</th><th class="num">${tr("Tokens entrée")}</th><th class="num">${tr("Tokens sortie")}</th>
        <th class="num" title="${tr("Coût des appels LLM de la campagne (prix de la config)")}">${tr("Coût")}</th><th class="num">${tr("Coût / cas")}</th><th>${tr("Code")}</th></tr></thead>
      <tbody>${r.summary.map((s) => {
        const meta = r.servers.find((x) => x.id === s.serverId) || {};
        return `<tr>
          <td><span class="strong">${esc(s.name)}</span><div class="mono small">${esc(s.model)} ${providerChip(s.provider)}</div></td>
          <td><div class="score"><b>${fmt.pct(s.passed, s.total)}</b><div class="progress"><div style="width:${s.total ? (s.passed / s.total) * 100 : 0}%"></div></div></div><div class="muted small">${tr("{n}/{total} cas", { n: s.passed, total: s.total })}</div></td>
          <td class="num">${fmt.pct(s.checksOk, s.checksTotal)}<div class="muted small">${s.checksOk}/${s.checksTotal}</div></td>
          <td class="num">${s.failed || "–"}</td>
          <td class="num">${s.errors || "–"}</td>
          <td class="num" title="${tr("Réponses de type « error »")}">${s.technicalErrors || "–"}</td>
          <td class="num">${fmt.s(s.avgStepMs)}</td>
          <td class="num">${fmt.s(s.medianStepMs)}</td>
          <td class="num">${fmt.s(s.maxStepMs)}</td>
          <td class="num">${fmt.n(s.llmCalls)}${s.llmErrors ? `<div class="bad-t small">${tr("{n} en erreur", { n: s.llmErrors })}</div>` : ""}</td>
          <td class="num">${fmt.s(s.avgLlmMs)}</td>
          <td class="num">${fmt.n(s.avgPromptTokens)}</td>
          <td class="num">${fmt.n(s.avgCompletionTokens)}</td>
          <td class="num">${money(s.totalCost)}</td>
          <td class="num">${money(s.costPerCase)}</td>
          <td class="small mono">${esc(meta.sourceCommit || "–")}</td>
        </tr>`;
      }).join("")}</tbody>
    </table></div>
  </section>

  <section class="card">
    <div class="card-h">
      <h3>${tr("Résultats par cas")} <span class="muted small">${tr("cliquer un résultat pour le détail des étapes")}</span></h3>
      <label class="small"><input type="checkbox" data-action="mOnlyFailures" ${state.mOnlyFailures ? "checked" : ""}> ${tr("Échecs seulement")}</label>
    </div>
    ${cases.length ? `<div class="table-wrap"><table>
      <thead><tr><th>${tr("Cas")}</th>${r.servers.map((s) => `<th>${esc(s.name)}<div class="mono muted" style="font-weight:400">${esc(s.model)}</div></th>`).join("")}</tr></thead>
      <tbody>${cases.map((c) => `
        <tr>
          <td style="min-width:240px"><span class="mono strong">${esc(c.id)}</span> ${c.category ? `<span class="chip">${esc(c.category)}</span>` : ""}<div class="muted small">${esc(c.steps.map((s) => s.message).join(" → "))}</div></td>
          ${r.servers.map((s) => {
            const rs = r.results.filter((x) => x.caseId === c.id && x.serverId === s.id);
            if (!rs.length) return `<td class="muted">${running ? "…" : "–"}</td>`;
            return `<td>${rs.map((x) => `<button class="pill ${x.status} ${state.mReplaying.has(x.id) ? "busy" : ""} ${state.mResultId === x.id ? "sel" : ""}" data-action="openMResult" data-id="${esc(x.id)}" title="${esc(x.status === "pass" ? tr("réussi") : x.failures.join(" ; "))}">${state.mReplaying.has(x.id) ? '<span class="spin"></span>' : RESULT_ICON[x.status]} ${fmt.s(x.latencyMs)}</button>`).join("")}
              ${rs.filter((x) => x.status !== "pass").slice(0, 1).map((x) => `<div class="small bad-t">${esc(x.failures.slice(0, 2).join(" ; "))}</div>`).join("")}</td>`;
          }).join("")}
        </tr>`).join("")}</tbody>
    </table></div>` : `<p class="empty">${state.mOnlyFailures ? tr("Aucun échec 🎉") : tr("Aucun résultat.")}</p>`}
  </section>`;
}

function drawerMResult() {
  const r = state.mReport;
  const x = r.results.find((y) => y.id === state.mResultId);
  if (!x) return "";
  const c = r.cases.find((y) => y.id === x.caseId);
  const s = r.servers.find((y) => y.id === x.serverId) || {};
  const busy = state.mReplaying.has(x.id);
  const label = { pass: tr("Réussi"), fail: tr("Échec"), error: tr("Erreur") }[x.status];
  return `
  <div class="overlay" data-action="closeLayer">
    <aside class="panel" data-stop>
      <div class="panel-h">
        <div><div class="muted small">${esc(s.name)} · <span class="mono">${esc(s.model)}</span> · run ${x.run}</div><h2 class="mono">${esc(x.caseId)}</h2>${c?.description ? `<div class="muted small">${esc(c.description)}</div>` : ""}</div>
        <button class="icon" data-action="closeLayer" title="${tr("Fermer")}">✕</button>
      </div>
      <div class="banner ${x.status}"><b>${label}</b>${x.failures.length ? " — " + esc(x.failures.join(" ; ")) : ""}</div>
      <div class="btns">
        <button class="b primary" data-action="mReplay" data-id="${esc(x.id)}" ${busy || r.status === "running" || state.mActive ? "disabled" : ""}>${busy ? `<span class="spin"></span> ${tr("Rejeu…")}` : tr("Rejouer ce cas")}</button>
        <span class="muted small">${tr("Le serveur doit être démarré. Version actuelle du cas.")}</span>
      </div>
      <dl class="kv">
        <div><dt>${tr("Durée totale")}</dt><dd>${fmt.s(x.latencyMs)}</dd></div>
        <div><dt>${tr("Étapes")}</dt><dd>${x.steps.length}</dd></div>
        ${(state.mStatus?.caseFields || []).map((f) => `<div><dt>${esc(f.label)}</dt><dd>${esc(c?.[f.name] ?? f.default ?? "–")}</dd></div>`).join("")}
        <div><dt>${tr("Exécuté le")}</dt><dd class="small">${fmt.date(x.at)}</dd></div>
      </dl>
      ${x.steps.map((st, i) => `
        <div class="step">
          <div class="step-h">
            <span><span class="pill ${st.status}">${RESULT_ICON[st.status]}</span> <b>${tr("Étape {n}", { n: i + 1 })}</b> ${kindChip(st.kind)} ${st.httpStatus ? `<span class="chip">HTTP ${st.httpStatus}</span>` : ""}</span>
            <span class="muted small">${fmt.s(st.latencyMs)}${st.summary ? " · " + esc(st.summary) : ""}</span>
          </div>
          <pre><b>user</b> ${esc(st.message)}</pre>
          ${st.reply != null ? `<div class="small muted">${tr("Réponse (message)")}</div><pre>${esc(st.reply)}</pre>` : ""}
          ${st.error ? `<div class="bad-t small mono">${esc(st.error)}</div>` : ""}
          ${st.checks.length ? `<ul class="checks">${st.checks.map((k) => `<li><span class="${k.pass ? "ok-t" : "bad-t"}">${k.pass ? "✓" : "✗"}</span> ${esc(k.label)}</li>`).join("")}</ul>` : `<div class="muted small">${tr("Pas de vérification : réussite si pas d'erreur technique.")}</div>`}
          <div class="section">
            <div class="small strong">${tr("Serveur")} · ${esc(state.mStatus?.chatPath || "")}</div>
            <details><summary class="small">${tr("Requête envoyée au serveur")}</summary><pre>${esc(JSON.stringify(st.request, null, 2))}</pre></details>
            <details><summary class="small">${tr("Réponse du serveur")}</summary><pre>${esc(typeof st.response === "string" ? st.response : JSON.stringify(st.response, null, 2))}</pre></details>
          </div>
          ${llmCallsBlock(st.llmCalls || [])}
        </div>`).join("")}
      ${x.steps.length < (c?.steps.length || 0) ? `<p class="muted small">${tr("{n} étape(s) non jouée(s) après une erreur.", { n: c.steps.length - x.steps.length })}</p>` : ""}
    </aside>
  </div>`;
}

function viewMCases() {
  return `
  <section class="card">
    <div class="card-h">
      <h2>${tr("Cas de test serveurs")} <span class="muted">${state.mCases.length}</span></h2>
      <button class="b primary" data-action="newMCase">+ ${tr("Nouveau cas")}</button>
    </div>
    <p class="muted small" style="margin-top:0">${tr("Enregistrés dans {file}.", { file: `<span class="mono">${esc(state.status?.dataDir || "")}/server-cases.json</span>` })}
      ${tr("Chaque cas est une conversation envoyée à {path} dans une session neuve ; les vérifications portent sur la réponse de chaque étape.", { path: `<span class="mono">${esc(state.mStatus?.chatPath || "")}</span>` })}
      ${tr("{week} = dans 7 jours.", { week: '<span class="mono">{{J+7}}</span>' })}</p>
    ${state.mCases.length ? `<div class="table-wrap"><table>
      <thead><tr><th>${tr("Id")}</th><th>${tr("Catégorie")}</th><th>${tr("Conversation")}</th><th class="num">${tr("Vérifs")}</th><th></th></tr></thead>
      <tbody>${state.mCases.map((c) => `
        <tr class="clickable" data-action="editMCase" data-id="${esc(c.id)}">
          <td class="mono strong">${esc(c.id)}${(state.mStatus?.caseFields || []).filter((f) => c[f.name] != null).map((f) => `<div class="muted small">${esc(c[f.name])}</div>`).join("")}</td>
          <td>${c.category ? `<span class="chip">${esc(c.category)}</span>` : ""}</td>
          <td>${c.steps.map((s, i) => `<div>${c.steps.length > 1 ? `<span class="muted small">${i + 1}.</span> ` : ""}${esc(s.message)}${(state.mStatus?.stepOptions || []).filter((o) => s[o.name]).map((o) => ` <span class="chip">${esc(o.label)}</span>`).join("")}</div>`).join("")}
            ${c.description ? `<div class="muted small">${esc(c.description)}</div>` : ""}</td>
          <td class="num">${c.steps.reduce((a, s) => a + (s.checks || []).length, 0)}</td>
          <td class="num" style="white-space:nowrap">
            <button class="icon" title="${tr("Dupliquer")}" data-action="duplicateMCase" data-id="${esc(c.id)}">⧉</button>
            <button class="icon" title="${tr("Supprimer")}" data-action="deleteMCase" data-id="${esc(c.id)}">🗑</button>
          </td>
        </tr>`).join("")}</tbody>
    </table></div>` : `<p class="empty">${tr("Aucun cas.")}</p>`}
  </section>`;
}

function mCheckFieldInput(check, f, path) { return fieldInput(f, check[f.name], path); }

const caseDefaults = () => Object.fromEntries((state.mStatus?.caseFields || []).map((f) => [f.name, f.default ?? ""]));

function modalMEditor() {
  const d = state.mEditing.draft;
  const types = state.mStatus?.checkTypes || [];
  const typeOf = (t) => types.find((x) => x.type === t);
  const cats = [...new Set([...(state.mStatus?.categories || []), ...state.mCases.map((c) => c.category).filter(Boolean)])];
  return `
  <div class="overlay center" data-action="closeLayer">
    <div class="panel" data-stop>
      <datalist id="serverCats">${cats.map((c) => `<option value="${esc(c)}">`).join("")}</datalist>
      <div class="panel-h"><h2>${state.mEditing.originalId ? tr("Modifier le cas serveur") : tr("Nouveau cas serveur")}</h2><button class="icon" data-action="closeLayer">✕</button></div>
      <div class="row">
        <label class="field grow">${tr("Id (unique)")}<input type="text" data-path="id" value="${esc(d.id)}" placeholder="search-then-details"></label>
        <label class="field">${tr("Catégorie")}<input type="text" data-path="category" list="serverCats" value="${esc(d.category || "")}"></label>
        ${(state.mStatus?.caseFields || []).map((f) => `<label class="field">${esc(f.label)}${fieldInput(f, d[f.name], f.name)}</label>`).join("")}
      </div>
      <label class="field">${tr("Description")}<input type="text" data-path="description" value="${esc(d.description || "")}" placeholder="${tr("Ce que le cas vérifie")}"></label>

      ${d.steps.map((st, i) => `
        <div class="step">
          <div class="step-h">
            <h3>${tr("Étape {n}", { n: i + 1 })}${i === d.steps.length - 1 && d.steps.length > 1 ? ` (${tr("dernière")})` : ""}</h3>
            ${d.steps.length > 1 ? `<button class="icon" data-action="removeMStep" data-i="${i}" title="${tr("Retirer l'étape")}">✕</button>` : ""}
          </div>
          <label class="field">${tr("Message utilisateur")}<textarea rows="2" data-path="steps.${i}.message" placeholder="${tr("Message de l'utilisateur")}">${esc(st.message)}</textarea></label>
          ${/\{\{/.test(st.message) ? `<div class="muted small">${tr("Envoyé comme :")} <span class="mono">${esc(resolveDates(st.message))}</span></div>` : ""}
          <div class="btns small">
