function llmCallsBlock(calls) {
  if (!calls.length) return `<div class="muted small">${tr("Aucun appel LLM enregistré pour cette étape.")}</div>`;
  return `<div class="section"><div class="small strong">${tr("Appels LLM du serveur ({n})", { n: calls.length })}</div>
    ${calls.map((c, i) => {
      const msgs = c.request?.messages || [];
      return `<details ${c.error ? "open" : ""}>
        <summary class="small"><span class="chip ${c.error ? "bad" : "accent"}">${esc(callKindLabel(c.kind))}</span> <span class="mono">${esc(c.model || "")}</span>
          · ${fmt.s(c.latencyMs)} · HTTP ${c.status}${c.promptTokens ? ` · ${c.promptTokens} → ${c.completionTokens ?? "?"} tokens` : ""}${c.finishReason ? ` · ${esc(c.finishReason)}` : ""}${c.stream ? " · stream" : ""}${c.cost ? ` · ${money(c.cost)}` : ""}</summary>
        <div style="display:grid;gap:8px;margin-top:8px">
          ${c.error ? `<div class="bad-t small mono">${esc(c.error)}</div>` : ""}
          <div class="small muted">${tr("Messages envoyés au modèle")}</div>
          ${msgs.map((m) => {
            const content = typeof m.content === "string" ? m.content : JSON.stringify(m.content);
            const ref = content.match(/^<<prompt:([0-9a-f]+)>>$/);
            return `<pre><b>${esc(m.role)}</b> ${ref ? `<button class="link small" data-action="showMPrompt" data-h="${ref[1]}">${tr("prompt système ({n} caractères) — afficher", { n: (state.mReport?.prompts?.[ref[1]] || "").length.toLocaleString(LOCALE) })}</button>` : esc(content)}</pre>`;
          }).join("")}
          <div class="small muted">${tr("Réponse du modèle")}</div>
          <pre>${esc(c.content != null ? prettyJson(c.content) : typeof c.response === "string" ? c.response : tr("(vide)"))}</pre>
          ${c.http ? httpExchange(c) : `<details><summary class="small">${tr("Requête HTTP complète")} (${esc(c.path)})</summary>${jsonPre({ ...c.request, messages: undefined })}</details>
          <details><summary class="small">${tr("Réponse HTTP complète")}</summary>${jsonPre(c.response)}</details>`}
        </div>
      </details>`;
    }).join("")}
  </div>`;
}

function freshMCheck(type) { return freshCheck(type, state.mStatus?.checkTypes); }

function freshCheck(type, types) {
  const t = (types || []).find((x) => x.type === type);
  const c = { type };
  (t?.fields || []).forEach((f) => { c[f.name] = f.kind === "select" ? f.options[0] : f.kind === "tuples" ? [] : f.kind === "boolean" ? false : ""; });
  return c;
}

async function mReplayOne(id, quiet = false) {
  const reportId = state.mReport.id;
  state.mReplaying.add(id); render(); renderLayer();
  try {
    const fresh = await api(`/api/server/reports/${reportId}/replay`, { method: "POST", body: { resultId: id } });
    if (!quiet) toast(fresh.status === "pass" ? tr("Rejeu : réussi ✓") : tr("Rejeu : toujours en échec"));
    return fresh;
  } catch (e) {
    toast(e.message, true);
  } finally {
    state.mReplaying.delete(id);
    if (state.mReportId === reportId) await guard(() => loadMReport(reportId));
    render(); renderLayer();
  }
}

/** Modèle choisi dans la liste de la passerelle pour l'offre affichée (gardé en basculant d'offre). */
function gwPicked(target) {
  const tf = state.tierFilter, picks = state.gwPicks ||= {};
  const keys = new Set(availFlat().filter((m) => !tf || m.tier === tf).map((m) => m.key));
  return [picks[tf], target].find((k) => k && keys.has(k)) || "";
}

const GW_ACTIONS = {
  gwPick(el) {
    const picks = state.gwPicks ||= {};
    picks[state.tierFilter] = el.value;
    const tier = tierOfKey(el.value);
    if (tier) picks[tier] = el.value;
  },
  async gwUse(el) { await gwSet(el.dataset.v); },
  pickerToggle(el) {
    const pop = el.nextElementSibling;
    document.querySelectorAll(".picker-pop:not([hidden])").forEach((p) => { if (p !== pop) p.hidden = true; });
    pop.hidden = !pop.hidden;
    if (pop.hidden) return;
    // Position fixe sous le bouton : la liste n'est pas coupée par un tableau ou une carte à défilement.
    const r = el.getBoundingClientRect();
    const below = innerHeight - r.bottom - 12;
    pop.style.position = "fixed";
    pop.style.left = `${r.left}px`;
    pop.style.width = `${Math.max(r.width, 280)}px`;
    pop.style.right = "auto";
    if (below < 220 && r.top > below) { pop.style.top = "auto"; pop.style.bottom = `${innerHeight - r.top + 4}px`; }
    else { pop.style.bottom = "auto"; pop.style.top = `${r.bottom + 4}px`; }
    pop.querySelector(".picker-list").style.maxHeight = `${Math.max(160, Math.min(320, (below < 220 && r.top > below ? r.top : below) - 60))}px`;
    const q = pop.querySelector("input"); q.value = ""; actions.pickerFilter(q); q.focus();
    pop.querySelector(".picker-o.on")?.scrollIntoView({ block: "nearest" });
  },
  pickerFilter(el) {
    const q = el.value.trim().toLowerCase();
    el.closest(".picker-pop").querySelectorAll("[data-group]").forEach((g) => {
      let any = false;
      g.querySelectorAll(".picker-o").forEach((o) => { const ok = !q || o.dataset.v.toLowerCase().includes(q); o.hidden = !ok; any ||= ok; });
      g.hidden = !any && Boolean(q);
    });
  },
  pickerPick(el) {
    const picker = el.closest("[data-picker]");
    picker.querySelector(".picker-pop").hidden = true;
    const onPick = picker.dataset.onPick;
    if (el.hasAttribute("data-add")) return actions[onPick]?.({ value: el.dataset.v });
    picker.querySelector("input[type=hidden]").value = el.dataset.v;
    const v = picker.querySelector(".picker-btn .v");
    v.textContent = el.dataset.v; v.className = "v mono";
    picker.querySelectorAll(".picker-o.on").forEach((o) => o.classList.remove("on"));
    el.classList.add("on");
    actions[onPick]?.({ value: el.dataset.v });
  },
  revealKey(el) {
    const k = el.previousElementSibling;
    const shown = el.textContent === tr("masquer");
    if (!shown) { k.dataset.masked = k.textContent; k.textContent = k.dataset.key; } else k.textContent = k.dataset.masked;
    el.textContent = shown ? tr("afficher") : tr("masquer");
  },
  gwCall(el) {
    // Par identifiant : la liste est rafraîchie en continu, un index pourrait désigner un autre appel.
    const c = state.gw.calls.find((x) => x.id === el.dataset.id);
    if (!c) return toast(tr("Appel introuvable (sorti de l'historique)"), true);
    const prompts = state.gw.prompts || {};
    const all = c.request?.messages || [];
    // Les clients de chat renvoient toute la conversation à chaque appel : ce qui précède le dernier
    // message utilisateur est de l'historique, pas une trace d'un autre appel.
    const lastUser = all.findLastIndex((m) => m.role === "user");
    const msg = (m) => {
      const content = typeof m.content === "string" ? m.content : JSON.stringify(m.content);
      const ref = content.match(/^<<prompt:([0-9a-f]+)>>$/);
      return `<pre><b>${esc(m.role)}</b> ${esc(ref ? prompts[ref[1]] || content : content)}</pre>`;
    };
    const system = all.filter((m, i) => i < lastUser && ["system", "developer"].includes(m.role));
    const history = all.filter((m, i) => i < lastUser && !["system", "developer"].includes(m.role));
    const current = lastUser < 0 ? all : all.slice(lastUser);
    const msgs = system.map(msg).join("")
      + (history.length ? `<details><summary class="small">${tr("Historique de conversation renvoyé par votre serveur dans cette requête ({n} message(s))", { n: history.length })}</summary><div style="display:grid;gap:8px;margin-top:8px">${history.map(msg).join("")}</div></details>` : "")
      + current.map(msg).join("");
    state.modal = `<div class="overlay center" data-action="closeModal"><div class="panel" data-stop>
      <div class="panel-h"><div><h2>${esc(callKindLabel(c.kind))} · <span class="mono">${esc(c.model)}</span></h2><div class="muted small">${fmt.date(c.at)} · HTTP ${c.status} · ${fmt.s(c.latencyMs)}</div></div><button class="icon" data-action="closeModal">✕</button></div>
      ${c.error ? `<div class="bad-t small mono">${esc(c.error)}</div>` : ""}
      <div class="section"><h3>${tr("Messages envoyés")}</h3>${msgs || '<p class="muted small">–</p>'}</div>
      <div class="section"><h3>${tr("Réponse")}</h3>${jsonPre(c.content ?? c.response)}</div>
      ${httpExchange(c)}
    </div></div>`;
    renderLayer();
  },
};

        ${row(tr("Proxy LLM du bench"), c(d.proxyUrl), tr("URL que le serveur appelle réellement : chaque requête y est enregistrée puis relayée"))}
      </table></div>

      <div class="section"><h3>${tr("Variables d'environnement")}</h3><table class="info">
        <tr><th>${tr("Variable")}</th><td><div class="row" style="justify-content:space-between"><span class="muted small">${tr("dans le fichier {file}", { file: esc(d.envFile.split("/").pop()) })}</span><span class="muted small">${tr("reçue au démarrage")}</span></div></td></tr>
        ${d.vars.map((v) => row(`<span class="mono">${esc(v.name)}</span><div class="small" style="font-weight:400">${ROLES[v.role] || v.role}</div>`,
          `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div>${c(v.file)}</div><div>${v.atStart !== v.file ? `<b>${c(v.atStart)}</b>` : c(v.atStart)}</div></div>`)).join("")}
      </table>
      <p class="muted small" style="margin:0">${tr("Au démarrage, le bench passe ces variables dans l'environnement du processus ; elles priment sur le fichier (dotenv ne les écrase pas). En gras : valeur différente du fichier. Le fichier garde le vrai endpoint pour que la copie reste utilisable seule. Clé API masquée.")}</p></div>

      <div class="section"><h3>${tr("Accès")}</h3><table class="info">
        ${row(tr("Serveur"), live ? `<a href="${esc(d.appUrl)}" target="_blank" rel="noopener" class="mono">${esc(d.appUrl)}</a>` : c(d.appUrl))}
        ${row(tr("Santé"), c(d.healthUrl), tr("prêt quand cette URL répond 2xx"))}
        ${row(tr("Route de chat testée"), c(d.chat))}
        ${row(tr("Appels LLM hors campagne"), `${d.pendingCalls}${d.lastCallAt ? ` <span class="muted small">· ${tr("dernier {date}", { date: fmt.date(d.lastCallAt) })}</span>` : ""}`, tr("enregistrés par le proxy depuis la dernière campagne"))}
      </table></div>

      <div class="section"><h3>${tr("Fichiers")}</h3><table class="info">
        ${row(tr("Dossier du serveur"), c(d.dir), tr("copie du projet"))}
        ${row(tr("Source copiée"), `${c(d.source)}${d.sourceCommit ? ` <span class="muted small">· ${tr("commit")} <span class="mono">${esc(d.sourceCommit)}</span></span>` : ""}`)}
        ${row(tr("Fichier d'environnement"), c(d.envFile))}
        ${row(tr("Journal"), c(d.logFile))}
        ${row(tr("Métadonnées"), c(d.metaFile))}
        ${d.shareDirs.length ? row(tr("Dossiers partagés"), d.shareDirs.map((x) => c(x)).join(" "), tr("liens symboliques vers ceux du projet")) : ""}
      </table></div>

      <div class="section"><h3>${tr("Commandes")}</h3><table class="info">
        ${row(tr("Installation"), d.commands.install.length ? d.commands.install.map((x) => c(x)).join("<br>") : `<span class="muted">${d.linkedModules ? tr("aucune (dépendances partagées)") : tr("aucune")}</span>`)}
        ${row(tr("Build"), d.commands.build.length ? d.commands.build.map((x) => c(x)).join("<br>") : `<span class="muted">${tr("aucun")}</span>`)}
        ${row(tr("Démarrage"), c(d.commands.start))}
      </table></div>

      <div class="section"><h3>${tr("Dates")}</h3><table class="info">
        ${row(tr("Créé le"), fmt.date(d.createdAt))}
        ${row(tr("Code copié le"), fmt.date(d.updatedAt))}
      </table></div>
    </div></div>`;
    renderLayer();
  },
  async copyText(el) {
    try { await navigator.clipboard.writeText(el.dataset.text); toast(tr("Copié")); } catch { toast(tr("Copie impossible"), true); }
  },
  async openLog(el) { state.logFor = el.dataset.id; state.logText = ""; renderLayer(); await guard(loadLog); renderLayer(); const pre = $("#logPre"); if (pre) pre.scrollTop = pre.scrollHeight; },
  async deleteServer(el) {
    if (!confirm(tr("Arrêter et supprimer « {name} » et son dossier ?", { name: serverName(el.dataset.id) }))) return;
    await guard(async () => {
      await api("/api/server/servers/" + el.dataset.id, { method: "DELETE" });
      state.selServers.delete(el.dataset.id); store.set("selServers", [...state.selServers]);
      await loadServers(); render(); toast(tr("Serveur supprimé"));
    });
  },

  // Lancer
  selServers(el) {
    state.selServers = new Set(el.dataset.v === "all" ? state.servers.filter((s) => s.phase === "running").map((s) => s.id) : []);
    store.set("selServers", [...state.selServers]); render();
  },
  toggleServer(el) {
    el.checked ? state.selServers.add(el.dataset.id) : state.selServers.delete(el.dataset.id);
    store.set("selServers", [...state.selServers]); render();
  },
  mSelCases(el) {
    const visible = filteredMCases().map((c) => c.id);
    const sel = new Set(state.mSelCases);
    if (el.dataset.v === "all") visible.forEach((id) => sel.add(id));
    if (el.dataset.v === "none") visible.forEach((id) => sel.delete(id));
    if (el.dataset.v === "invert") visible.forEach((id) => (sel.has(id) ? sel.delete(id) : sel.add(id)));
    state.mSelCases = [...sel]; store.set("mSelCases", state.mSelCases); render();
  },
  toggleMCase(el) {
    const sel = new Set(state.mSelCases);
    el.checked ? sel.add(el.dataset.id) : sel.delete(el.dataset.id);
    state.mSelCases = [...sel]; store.set("mSelCases", state.mSelCases); render();
  },
  mCaseSearch(el) { state.mFilter.q = el.value; render(); },
  mCaseCat(el) { state.mFilter.category = el.value; render(); },
  mRunName(el) { state.mRunName = el.value; },
  mParallelInput(el) { state.mParallel = Math.min(16, Math.max(1, Number(el.value) || 1)); store.set("mParallel", state.mParallel); render(); },
  mRunsInput(el) { state.mRuns = Math.min(10, Math.max(1, Number(el.value) || 1)); render(); },
  async mLaunch() {
    await guard(async () => {
      const serverIds = state.servers.filter((s) => s.phase === "running" && state.selServers.has(s.id)).map((s) => s.id);
      const caseIds = state.mCases.filter((c) => state.mSelCases.includes(c.id)).map((c) => c.id);
      const { reportId } = await api("/api/server/runs", { method: "POST", body: { serverIds, caseIds, runs: state.mRuns, name: state.mRunName, parallel: state.mParallel } });
      state.mActive = { reportId, done: 0, total: serverIds.length * caseIds.length * state.mRuns, current: serverIds[0] };
      state.mLastFinished = null;
      toast(tr("Campagne serveurs lancée"));
      render();
    });
  },
  async mStopRun() { await guard(() => api("/api/server/runs/stop", { method: "POST" })); toast(tr("Arrêt demandé")); },

  // Rapports
  async openMReport(el) {
    state.mReportId = el.dataset.id; store.set("mReportId", state.mReportId);
    state.menu = "mcp"; state.mtab = "reports"; store.set("menu", "mcp"); store.set("mtab", "reports");
    state.mResultId = null; state.mOnlyFailures = false;
    await guard(() => loadMReport(state.mReportId));
    render(); renderLayer();
  },
  async closeMReport() {
    state.mReportId = null; state.mReport = null; store.set("mReportId", null);
    await guard(loadMReports); render();
  },
  async deleteMReport(el) {
    if (!confirm(tr("Supprimer ce rapport ?"))) return;
    await guard(async () => {
      await api("/api/server/reports/" + el.dataset.id, { method: "DELETE" });
      if (state.mReportId === el.dataset.id) { state.mReportId = null; state.mReport = null; store.set("mReportId", null); }
      await loadMReports(); render(); toast(tr("Rapport supprimé"));
    });
  },
  mOnlyFailures(el) { state.mOnlyFailures = el.checked; render(); },
  openMResult(el) { state.mResultId = el.dataset.id; render(); renderLayer(); },
  async mReplay(el) { await mReplayOne(el.dataset.id); },
  async mReplayFailures() {
    const ids = state.mReport.results.filter((x) => x.status !== "pass").map((x) => x.id);
    ids.forEach((id) => state.mReplaying.add(id));
    render(); renderLayer();
    let fixed = 0;
    for (const id of ids) if ((await mReplayOne(id, true))?.status === "pass") fixed++;
    toast(tr("{n} cas rejoué(s) · {fixed} désormais réussi(s)", { n: ids.length, fixed }));
  },
  showMPrompt(el) {
    const text = state.mReport?.prompts?.[el.dataset.h] || tr("(introuvable)");
    state.modal = `<div class="overlay center" data-action="closeModal"><div class="panel" data-stop>
      <div class="panel-h"><div><h2>${tr("Prompt système")}</h2><div class="muted small mono">${esc(el.dataset.h)} · ${tr("{n} caractères", { n: text.length.toLocaleString(LOCALE) })}</div></div><button class="icon" data-action="closeModal">✕</button></div>
      <pre style="max-height:70vh">${esc(text)}</pre></div></div>`;
    renderLayer();
  },
  downloadMReport() {
    const { summary, ...report } = state.mReport;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(report, null, 2)], { type: "application/json" }));
    a.download = `bench-serveurs-${report.id}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },

  // Cas de test serveurs
  newMCase() {
    state.mEditing = { originalId: null, draft: { id: "", description: "", category: "", ...caseDefaults(), steps: [{ message: "", checks: [{ type: "notError" }] }] } };
    renderLayer();
  },
  editMCase(el) {
    const c = state.mCases.find((x) => x.id === el.dataset.id);
    state.mEditing = { originalId: c.id, draft: structuredClone({ description: "", category: "", ...caseDefaults(), ...c }) };
    renderLayer();
  },
  duplicateMCase(el) {
    const c = state.mCases.find((x) => x.id === el.dataset.id);
    state.mEditing = { originalId: null, draft: structuredClone({ description: "", category: "", ...caseDefaults(), ...c, id: c.id + tr("-copie") }) };
    renderLayer();
  },
  async deleteMCase(el) {
    if (!confirm(tr("Supprimer le cas « {id} » ?", { id: el.dataset.id }))) return;
    await guard(async () => {
      await api("/api/server/cases/" + encodeURIComponent(el.dataset.id), { method: "DELETE" });
      state.mEditing = null; renderLayer();
      await loadMCases(); render(); toast(tr("Cas supprimé"));
    });
  },
  addMStep() { readEditor(); state.mEditing.draft.steps.push({ message: "", checks: [{ type: "notError" }] }); renderLayer(); },
  removeMStep(el) { readEditor(); state.mEditing.draft.steps.splice(Number(el.dataset.i), 1); renderLayer(); },
  addMCheck(el) { readEditor(); const st = state.mEditing.draft.steps[Number(el.dataset.i)]; (st.checks ||= []).push(freshMCheck("kind")); renderLayer(); },
  removeMCheck(el) { readEditor(); state.mEditing.draft.steps[Number(el.dataset.i)].checks.splice(Number(el.dataset.j), 1); renderLayer(); },
  mCheckType(el) {
    readEditor();
    state.mEditing.draft.steps[Number(el.dataset.i)].checks[Number(el.dataset.j)] = freshMCheck(el.value);
    renderLayer();
  },
  async saveMCase() {
    readEditor();
    const d = state.mEditing.draft;
    const body = { originalId: state.mEditing.originalId, case: d };
    await guard(async () => {
      const saved = await api("/api/server/cases", { method: "POST", body });
      if (!state.mSelCases.includes(saved.id)) { state.mSelCases = [...state.mSelCases.filter((id) => id !== state.mEditing.originalId), saved.id]; store.set("mSelCases", state.mSelCases); }
      state.mEditing = null; renderLayer();
      await loadMCases(); render(); toast(tr("Cas enregistré"));
    });
  },
};

// =============================================================================================
// Actions
// =============================================================================================
const actions = {
  setLang(el) { store.set("lang", el.dataset.v); location.reload(); },
  async tab(el) {
    state.tab = el.dataset.tab;
    store.set("tab", state.tab);
    state.resultId = null;
    render(); renderLayer();
    if (state.tab === "reports") { await guard(loadReports); if (state.reportId) await guard(() => loadReport(state.reportId)); render(); }
    if (state.tab === "run") { await loadAvail(); render(); }
    if (state.tab === "prompt") await actions.promptOpen();
  },
  async promptOpen() {
    await guard(loadPromptSource); render();
    if (!state.promptSrc?.source && state.promptCands === null) await loadPromptCandidates();
  },
  promptToggleText() { state.promptShowText = !state.promptShowText; render(); },
  async promptChange() {
    state.promptChanging = !state.promptChanging; render();
    if (state.promptChanging && state.promptCands === null) await loadPromptCandidates();
  },
  promptDetect() { return loadPromptCandidates(); },
  promptMode(el) { state.promptManual.mode = el.dataset.v; state.promptManual.test = null; render(); },
  pmField(el) { state.promptManual[el.dataset.k] = el.value; },
  async promptTest() {
    const m = state.promptManual;
    await guard(async () => {
      m.test = await api("/api/prompt/test", { method: "POST", body: m.mode === "file" ? { kind: "file", file: m.file } : { kind: "module", module: m.module, export: m.export } });
    });
    render();
  },
  async promptUse(el) {
    const x = state.promptCands.find((c) => c.id === el.dataset.id);
    if (!x) return;
    await savePrompt(x.kind === "module"
      ? { kind: "module", module: x.file, export: x.export, version: x.version ? { module: x.version.file, export: x.version.export } : null }
      : { kind: "file", file: x.file });
  },
  async promptSaveManual() {
    const m = state.promptManual;
    await savePrompt(m.mode === "module" ? { kind: "module", module: m.module, export: m.export } : m.mode === "file" ? { kind: "file", file: m.file } : { kind: "text", text: m.text });
  },

  // Lancer
  selModels(el) {
    state.selModels = new Set(el.dataset.v === "all" ? availFlat().filter((m) => !state.tierFilter || m.tier === state.tierFilter).map((m) => m.key) : []);
    store.set("selModels", [...state.selModels]); render();
  },
  toggleModel(el) {
    el.checked ? state.selModels.add(el.dataset.name) : state.selModels.delete(el.dataset.name);
    store.set("selModels", [...state.selModels]); render();
  },
  selCases(el) {
    const visible = filteredCases().map((c) => c.id);
    const sel = new Set(state.selCases);
    if (el.dataset.v === "all") visible.forEach((id) => sel.add(id));
    if (el.dataset.v === "none") visible.forEach((id) => sel.delete(id));
    if (el.dataset.v === "invert") visible.forEach((id) => (sel.has(id) ? sel.delete(id) : sel.add(id)));
    state.selCases = [...sel]; store.set("selCases", state.selCases); render();
  },
  toggleCase(el) {
    const sel = new Set(state.selCases);
    el.checked ? sel.add(el.dataset.id) : sel.delete(el.dataset.id);
    state.selCases = [...sel]; store.set("selCases", state.selCases); render();
  },
  caseSearch(el) { state.caseFilter.q = el.value; render(); },
  caseCat(el) { state.caseFilter.category = el.value; render(); },
  async refreshAvail() { await loadAvail(); render(); },
  runName(el) { state.runName = el.value; },
  parallelInput(el) { state.parallel = Math.min(16, Math.max(1, Number(el.value) || 1)); store.set("parallel", state.parallel); render(); },
  runsInput(el) { state.runs = Math.min(10, Math.max(1, Number(el.value) || 1)); render(); },
  async launch() {
    await guard(async () => {
      const models = availFlat().filter((m) => state.selModels.has(m.key)).map((m) => m.key);
      const caseIds = state.cases.filter((c) => state.selCases.includes(c.id)).map((c) => c.id);
      const { reportId } = await api("/api/runs", { method: "POST", body: { models, caseIds, runs: state.runs, name: state.runName, parallel: state.parallel } });
      state.active = { reportId, done: 0, total: models.length * caseIds.length * state.runs, phase: "loading", current: models[0] };
      state.lastFinished = null;
      toast(tr("Campagne lancée"));
      render();
    });
  },
  async stopRun() { await guard(() => api("/api/runs/stop", { method: "POST" })); toast(tr("Arrêt demandé : le test en cours se termine d'abord")); },

  // Rapports
  async openReport(el) {
    state.reportId = el.dataset.id; store.set("reportId", state.reportId);
    state.tab = "reports"; store.set("tab", "reports");
    state.resultId = null; state.onlyFailures = false;
    await guard(() => loadReport(state.reportId));
    render(); renderLayer();
  },
  async closeReport() {
    state.reportId = null; state.report = null; store.set("reportId", null);
    await guard(loadReports); render();
  },
  async deleteReport(el) {
    if (!confirm(tr("Supprimer ce rapport ?"))) return;
    await guard(async () => {
      await api("/api/reports/" + el.dataset.id, { method: "DELETE" });
      if (state.reportId === el.dataset.id) { state.reportId = null; state.report = null; store.set("reportId", null); }
      await loadReports(); render(); toast(tr("Rapport supprimé"));
    });
  },
  onlyFailures(el) { state.onlyFailures = el.checked; render(); },
  openResult(el) { state.resultId = el.dataset.id; render(); renderLayer(); },
  openDiff(el) { state.diffCase = el.dataset.case; state.diffRef = null; state.modal = modalDiff(); renderLayer(); },
  diffRef(el) { state.diffRef = el.value; state.modal = modalDiff(); renderLayer(); },
  async replay(el) { await replayOne(el.dataset.id); },
  async replayFailures() {
    const ids = failingResults(state.report).map((x) => x.id);
    ids.forEach((id) => state.replaying.add(id));
    render(); renderLayer();
    let fixed = 0;
    for (const id of ids) if ((await replayOne(id, true))?.status === "pass") fixed++;
    toast(tr("{n} test(s) rejoué(s) · {fixed} désormais réussi(s)", { n: ids.length, fixed }));
  },
  showPrompt() {
    state.modal = `<div class="overlay center" data-action="closeModal"><div class="panel" data-stop>
      <div class="panel-h"><div><h2>${tr("Prompt système")}</h2><div class="muted small">${state.report.promptVersion ? `${tr("version")} ${esc(state.report.promptVersion)} · ` : ""} ${tr("{n} caractères", { n: state.report.systemPrompt.length.toLocaleString(LOCALE) })}</div></div><button class="icon" data-action="closeModal">✕</button></div>
      <pre style="max-height:70vh">${esc(state.report.systemPrompt)}</pre></div></div>`;
    renderLayer();
  },
  closeModal() { state.modal = null; renderLayer(); },
  downloadReport() {
    const { summary, ...report } = state.report;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(report, null, 2)], { type: "application/json" }));
    a.download = `bench-${report.id}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },
  closeLayer() {
    if (state.modal) { state.modal = null; }
    else if (state.provDraft) { state.provDraft = null; }
    else if (state.keyDraft) { state.keyDraft = null; }
    else if (state.editing) { state.editing = null; }
    else if (state.mEditing) { state.mEditing = null; }
    else if (state.logFor) { state.logFor = null; }
    else { state.resultId = null; state.mResultId = null; render(); }
    renderLayer();
  },

  // Cas de test
  newCase() {
    const nc = state.status?.prompt?.newCase || {};
    state.editing = { originalId: null, draft: structuredClone({ id: "", description: "", category: "", message: "", history: [], checks: [], ...nc }) };
    renderLayer();
  },
  editCase(el) {
    const c = state.cases.find((x) => x.id === el.dataset.id);
    state.editing = { originalId: c.id, draft: structuredClone({ history: [], checks: [], description: "", ...c }) };
    renderLayer();
  },
  duplicateCase(el) {
    const c = state.cases.find((x) => x.id === el.dataset.id);
    state.editing = { originalId: null, draft: structuredClone({ history: [], checks: [], description: "", ...c, id: c.id + tr("-copie") }) };
    renderLayer();
  },
  async deleteCase(el) {
    if (!confirm(tr("Supprimer le cas « {id} » ?", { id: el.dataset.id }))) return;
    await guard(async () => {
      await api("/api/cases/" + encodeURIComponent(el.dataset.id), { method: "DELETE" });
      state.editing = null; renderLayer();
      await loadCases(); render(); toast(tr("Cas supprimé"));
    });
  },
  addHistory() { readEditor(); state.editing.draft.history.push({ role: state.editing.draft.history.at(-1)?.role === "user" ? "assistant" : "user", content: "" }); renderLayer(); },
  removeHistory(el) { readEditor(); state.editing.draft.history.splice(Number(el.dataset.i), 1); renderLayer(); },
  addCheck() { readEditor(); state.editing.draft.checks.push(freshCheck((state.status?.prompt?.checkTypes || [])[0]?.type, state.status?.prompt?.checkTypes)); renderLayer(); },
  removeCheck(el) { readEditor(); state.editing.draft.checks.splice(Number(el.dataset.i), 1); renderLayer(); },
  checkType(el) {
    readEditor();
    state.editing.draft.checks[Number(el.dataset.i)] = freshCheck(el.value, state.status?.prompt?.checkTypes);
    renderLayer();
  },
  async saveCase() {
    readEditor();
    const d = state.editing.draft;
    const body = { originalId: state.editing.originalId, case: { ...d, history: (d.history || []).filter((h) => h.content.trim()) } };
    await guard(async () => {
      const saved = await api("/api/cases", { method: "POST", body });
      if (!state.selCases.includes(saved.id)) { state.selCases = [...state.selCases.filter((id) => id !== state.editing.originalId), saved.id]; store.set("selCases", state.selCases); }
      state.editing = null; renderLayer();
      await loadCases(); render(); toast(tr("Cas enregistré"));
    });
  },

  // Modèles
  async refreshModels() { await Promise.all([loadModels(), loadAvail()]); render(); },
  async deleteModel(el) {
    if (!confirm(tr("Supprimer {name} du disque ?", { name: el.dataset.name }))) return;
    await guard(async () => { await api("/api/models/" + encodeURIComponent(el.dataset.name), { method: "DELETE" }); await Promise.all([loadModels(), loadAvail()]); render(); toast(tr("Modèle supprimé")); });
  },
  async pull(el) { await startPull(el.dataset.name); },
  async cancelPull(el) { await guard(() => api("/api/pulls/" + encodeURIComponent(el.dataset.name), { method: "DELETE" })); state.pulls = await api("/api/pulls"); render(); },
  async searchLibrary() {
    state.libraryLoading = true; render();
    await guard(async () => { state.library = await api("/api/library/search?q=" + encodeURIComponent(state.libraryQuery)); });
    state.libraryLoading = false; render();
  },
  async toggleTags(el) {
    const name = el.dataset.name;
    if (state.tags[name]) { delete state.tags[name]; render(); return; }
    state.tags[name] = "loading"; render();
    await guard(async () => { state.tags[name] = await api("/api/library/tags?name=" + encodeURIComponent(name)); });
    if (state.tags[name] === "loading") delete state.tags[name];
    render();
  },
};

Object.assign(actions, MCP_ACTIONS, GW_ACTIONS);

async function startPull(name) {
  name = String(name || "").trim();
  if (!name) return;
  await guard(async () => {
    await api("/api/pulls", { method: "POST", body: { name } });
    state.pulls = await api("/api/pulls");
    toast(tr("Téléchargement de {name} lancé", { name }));
    render();
  });
}

async function replayOne(id, quiet = false) {
  const reportId = state.report.id;
  state.replaying.add(id); render(); renderLayer();
  try {
    const fresh = await api(`/api/reports/${reportId}/replay`, { method: "POST", body: { resultId: id } });
    if (!quiet) toast(fresh.status === "pass" ? tr("Rejeu : réussi ✓") : tr("Rejeu : toujours en échec"));
    return fresh;
  } catch (e) {
    toast(e.message, true);
  } finally {
    state.replaying.delete(id);
    if (state.reportId === reportId) await guard(() => loadReport(reportId));
    render(); renderLayer();
  }
}

// ---- Délégation d'événements ----
document.addEventListener("click", (e) => {
  document.querySelectorAll(".picker-pop:not([hidden])").forEach((p) => { if (!p.closest("[data-picker]").contains(e.target)) p.hidden = true; });
}, true);
addEventListener("scroll", (e) => {
  document.querySelectorAll(".picker-pop:not([hidden])").forEach((p) => { if (!p.contains(e.target)) p.hidden = true; });
}, true);
addEventListener("resize", () => document.querySelectorAll(".picker-pop:not([hidden])").forEach((p) => { p.hidden = true; }));
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.matches(".picker-pop input")) {
    e.preventDefault();
    e.target.closest(".picker-pop").querySelector(".picker-o:not([hidden]):not(:disabled)")?.click();
    return;
  }
  if (e.key !== "Escape") return;
  const open = document.querySelector(".picker-pop:not([hidden])");
  if (open) { open.hidden = true; e.stopImmediatePropagation(); }
}, true);
document.addEventListener("click", (e) => {
  const stop = e.target.closest("[data-stop]");
  const el = e.target.closest("[data-action]");
  if (!el || (stop && !stop.contains(el))) return;
  if (el.matches("input, select") ) return; // gérés par "change"
  if (el.classList.contains("overlay") && e.target !== el) return; // clic dans le panneau
  e.preventDefault();
  actions[el.dataset.action]?.(el);
});
document.addEventListener("change", (e) => {
  const el = e.target.closest("input[data-action], select[data-action]");
  if (el && el.type !== "search" && el.type !== "text") actions[el.dataset.action]?.(el);
});
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.matches("input[type=search][data-action], input[type=text][data-action], textarea[data-action]")) actions[el.dataset.action]?.(el);
});
document.addEventListener("submit", (e) => {
  const form = e.target.closest("[data-form]");
  if (!form) return;
  e.preventDefault();
  if (form.dataset.form === "pull") { startPull($("#pullName").value); $("#pullName").value = ""; }
  if (form.dataset.form === "library") { state.libraryQuery = $("#libQuery").value; actions.searchLibrary(); }
  if (form.dataset.form === "newServer") actions.createServer();
  if (form.dataset.form === "gateway") { const v = $("#gwModel")?.value; if (v) gwSet(v); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#layer").innerHTML) actions.closeLayer(); });

// =============================================================================================
// Rafraîchissement périodique (campagne en cours, téléchargements)
// =============================================================================================
let lastSig = "";
async function tick() {
  try {
    const wasActive = state.active;
    state.active = await api("/api/runs/active");
    if (state.active) {
      const rep = await api("/api/reports/" + state.active.reportId);
      state.activeReport = rep;
      if (state.reportId === state.active.reportId) state.report = rep;
    }
    if (wasActive && !state.active) {
      state.lastFinished = wasActive.reportId;
      state.activeReport = null;
      toast(tr("Campagne terminée"));
      await loadReports();
      if (state.reportId === wasActive.reportId) await loadReport(state.reportId);
      await loadModels();
    }
    if ((state.menu === "models" && state.modtab === "free") || state.pulls.some((p) => !p.done)) {
      const before = state.pulls.filter((p) => !p.done).length;
      state.pulls = await api("/api/pulls");
      const after = state.pulls.filter((p) => !p.done).length;
      if (after < before) { await Promise.all([loadModels(), loadAvail()]); state.pulls.filter((p) => p.done && !p.error).forEach((p) => toast(tr("{name} téléchargé", { name: p.name }))); }
    }
    await mcpTick();
    if (state.menu === "gw" || state.gw) await loadGateway().catch(() => {});
    const sig = JSON.stringify([state.menu, state.active, state.pulls, state.report?.results?.length, state.report?.status, state.models.length,
      state.mActive, state.servers.map((x) => [x.id, x.phase, x.error, x.updatedAt, x.model]), state.mReport?.results?.length, state.mReport?.status, state.logText.length,
      state.gw?.target, state.gw?.stats?.calls]);
    if (sig !== lastSig) {
      lastSig = sig;
      if (!state.editing && !state.mEditing && !state.modal && !state.provDraft && !state.keyDraft && !state.changingModel) {
        render();
        if (state.resultId || state.mResultId || state.logFor) {
          const pre = $("#logPre");
          const atBottom = !pre || pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 20;
          renderLayer();
          const next = $("#logPre");
          if (next && atBottom) next.scrollTop = next.scrollHeight;
        }
      }
    }
  } catch {
    // serveur arrêté : on réessaie au prochain tour
  } finally {
    setTimeout(tick, 1500);
  }
}

// =============================================================================================
// Démarrage
// =============================================================================================
(async () => {
  await guard(loadStatus);
  const p = state.status?.prompt, sv = state.status?.server;
  await Promise.all([loadModels(), loadAvail(), guard(loadGateway), guard(loadMStatus),
    p ? guard(loadCases) : null, p ? guard(loadReports) : null,
    sv ? guard(loadServers) : null, sv ? guard(loadMCases) : null, sv ? guard(loadMReports) : null, sv ? guard(loadEnv) : null]);
  state.selCases ??= [];
  state.mSelCases ??= [];
  if (state.reportId) await loadReport(state.reportId).catch(() => { state.reportId = null; store.set("reportId", null); });
  if (state.mReportId) await loadMReport(state.mReportId).catch(() => { state.mReportId = null; store.set("mReportId", null); });
  render();
  if (state.menu === "models" && state.modtab === "free" && state.status?.ollama) actions.searchLibrary();
  if (state.menu === "llm" && (state.tab === "prompt" || !state.status?.prompt)) actions.promptOpen();
  tick();
})();
</script>
